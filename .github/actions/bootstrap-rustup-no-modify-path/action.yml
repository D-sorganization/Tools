name: "Bootstrap rustup without editing shell profiles"
description: >
  Install rustup with --no-modify-path when it is missing from PATH, then expose
  CARGO_HOME/bin on GITHUB_PATH. dtolnay/rust-toolchain installs rustup without
  --no-modify-path when rustup is absent, which appends to host shell profiles on
  self-hosted runners (RM#2064).

runs:
  using: composite
  steps:
    - name: Install rustup if missing
      shell: bash
      run: |
        if ! command -v rustup >/dev/null 2>&1; then
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none --no-modify-path -y
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
        fi
