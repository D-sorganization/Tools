version: 2

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: pyqt6-sip
        versions: ["13.13.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 10
