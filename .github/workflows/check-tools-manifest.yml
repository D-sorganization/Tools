name: Check Tools Manifest
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "src/**/gui_registration.py"
      - "src/**/launch_gui.py"
      - "src/**/launch_pyqt6.py"
      - "src/**/launch_web.py"
      - "scripts/check_tools_manifest_layout.py"
      - "scripts/generate_tools_json.py"
      - "tools.json"
      - "tool_surface_contract.json"
  pull_request:
    paths:
      - "src/**/gui_registration.py"
      - "src/**/launch_gui.py"
      - "src/**/launch_pyqt6.py"
      - "src/**/launch_web.py"
      - "scripts/check_tools_manifest_layout.py"
      - "scripts/generate_tools_json.py"
      - "tools.json"
      - "tool_surface_contract.json"

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  check-manifest:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        with:
          python-version: "3.11"
          cache: pip

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Generate tools.json and tool_surface_contract.json
        run: python scripts/generate_tools_json.py

      - name: Check launcher-backed tool registrations
        run: python scripts/check_tools_manifest_layout.py

      - name: Check tools.json for changes
        run: |
          git diff --exit-code tools.json || {
            echo "::error::tools.json is out of sync with gui_registration.py files."
            echo "Run: python scripts/generate_tools_json.py"
            exit 1
          }

      - name: Check tool_surface_contract.json for changes
        run: |
          git diff --exit-code tool_surface_contract.json || {
            echo "::error::tool_surface_contract.json is out of sync with gui_registration.py files."
            echo "Run: python scripts/generate_tools_json.py"
            exit 1
          }

      - name: Publish contract summary
        if: always()
        run: |
          echo "## Tool Surface Contract" >> "$GITHUB_STEP_SUMMARY"
          python -c "
          import json
          c = json.load(open('tool_surface_contract.json'))
          tools = c['tools']
          dual = sum(1 for t in tools if t['surfaces']['pyqt6'] and t['surfaces']['web'])
          pyqt_only = sum(1 for t in tools if t['surfaces']['pyqt6'] and not t['surfaces']['web'])
          web_only = sum(1 for t in tools if not t['surfaces']['pyqt6'] and t['surfaces']['web'])
          print(f'- **Total tools**: {len(tools)}')
          print(f'- **Dual surface** (PyQt6 + Web): {dual}')
          print(f'- **PyQt6 only**: {pyqt_only}')
          print(f'- **Web only**: {web_only}')
          " >> "$GITHUB_STEP_SUMMARY"
