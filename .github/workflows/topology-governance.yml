name: Topology Governance
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "docs/architecture/CANONICAL_TOPOLOGY.md"
      - "scripts/check_repo_topology.py"
      - ".github/workflows/topology-governance.yml"
      - "README.md"
      - "src/**"
      - "tests/**"
      - "config/**"
  push:
    branches: [main]
    paths:
      - "docs/architecture/CANONICAL_TOPOLOGY.md"
      - "scripts/check_repo_topology.py"
      - ".github/workflows/topology-governance.yml"

defaults:
  run:
    shell: bash

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  topology-check:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v7
      - name: Clean up broken editable pth files
        run: |
          python3 -S -c "
          import glob, os
          patterns = [
              '/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth',
              '/home/dieterolson/actions-runners/.shared-tool-cache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth'
          ]
          for pat in patterns:
              for p in glob.glob(pat):
                  print('Found:', p)
                  try:
                      os.remove(p)
                      print('Deleted successfully:', p)
                  except Exception as e:
                      print('Error deleting:', p, e)
          "
      - name: Force-clean stale Python tool cache (NVMe runners)
        run: |
          for cache_root in /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache /home/dieterolson/actions-runners-nvme/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Checking $cache_root/Python for stale 3.12 installations..."
              for version_dir in "$cache_root/Python"/3.12.*; do
                if [ -d "$version_dir" ]; then
                  for arch_dir in "$version_dir"/*; do
                    if [ -d "$arch_dir" ]; then
                      if [ ! -x "$arch_dir/bin/python" ] && [ ! -x "$arch_dir/bin/python3" ]; then
                        echo "Directory $arch_dir is incomplete or broken. Cleaning..."
                        sudo rm -rf "$arch_dir" || rm -rf "$arch_dir" || true
                      else
                        py_bin="$arch_dir/bin/python"
                        if [ ! -x "$py_bin" ]; then
                          py_bin="$arch_dir/bin/python3"
                        fi
                        echo "Testing zlib import on $py_bin..."
                        if ! "$py_bin" -c "import zlib"; then
                          echo "Directory $arch_dir is corrupt (zlib import failed). Cleaning..."
                          sudo rm -rf "$arch_dir" || rm -rf "$arch_dir" || true
                        else
                          echo "Directory $arch_dir is healthy."
                        fi
                      fi
                    fi
                  done
                fi
              done
            fi
          done
      - name: Validate topology policy
        run: python3 scripts/check_repo_topology.py
