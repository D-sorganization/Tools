name: Topology Governance

on:
  pull_request:
    paths:
      - "docs/architecture/CANONICAL_TOPOLOGY.md"
      - "scripts/check_repo_topology.py"
      - ".github/workflows/topology-governance.yml"
      - "README.md"
      - "src/**"
      - "tests/**"
      - "config/**"
  push:
    branches: [main]
    paths:
      - "docs/architecture/CANONICAL_TOPOLOGY.md"
      - "scripts/check_repo_topology.py"
      - ".github/workflows/topology-governance.yml"

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using GitHub-hosted"
          fi
  topology-check:
    needs: pick-runner
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate topology policy
        run: python3 scripts/check_repo_topology.py
