name: Topology Governance
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "docs/architecture/CANONICAL_TOPOLOGY.md"
      - "scripts/check_repo_topology.py"
      - ".github/workflows/topology-governance.yml"
      - "README.md"
      - "src/**"
      - "tests/**"
      - "config/**"
  push:
    branches: [main]
    paths:
      - "docs/architecture/CANONICAL_TOPOLOGY.md"
      - "scripts/check_repo_topology.py"
      - ".github/workflows/topology-governance.yml"

defaults:
  run:
    shell: bash

jobs:
  topology-check:
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    # Stdlib-only gate (see SPEC 1.1.370); same hosted placement as detect-secrets
    # (#5782) so fleet runner loss cannot block merge on infra.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate topology policy
        run: python3 scripts/check_repo_topology.py
