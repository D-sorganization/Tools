name: Publish Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write # Required for PyPI trusted publishing

jobs:
  build-python-wheel:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Maturin
        run: pip install maturin

      - name: Build Wheel
        run: |
          cd rust_core/tools-core
          maturin build --release --features python
          echo "## Python Wheel Built" >> $GITHUB_STEP_SUMMARY
          ls -la ../../target/wheels/

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v6
        with:
          name: python-wheel
          path: target/wheels/*.whl
          retention-days: 30

  build-wasm-package:
    name: Build WASM/NPM Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM Package
        run: |
          cd rust_core/tools-core
          wasm-pack build --target web --release -- --features wasm
          echo "## WASM Package Built" >> $GITHUB_STEP_SUMMARY
          ls -la pkg/

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v6
        with:
          name: wasm-package
          path: rust_core/tools-core/pkg/
          retention-days: 30

  publish-pypi:
    name: Publish to PyPI
    needs: [build-python-wheel]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
    environment:
      name: pypi # GitHub environment with PyPI trusted publishing configured
    steps:
      - name: Download Wheel
        uses: actions/download-artifact@v5
        with:
          name: python-wheel
          path: dist/

      - name: Install twine
        run: pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "## Publishing to PyPI" >> $GITHUB_STEP_SUMMARY
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "⚠️ PYPI_API_TOKEN secret not configured. Skipping publish." >> $GITHUB_STEP_SUMMARY
            echo "To enable publishing, add PYPI_API_TOKEN secret to the 'pypi' environment." >> $GITHUB_STEP_SUMMARY
          else
            twine upload dist/*.whl
            echo "✅ Published to PyPI" >> $GITHUB_STEP_SUMMARY
          fi

  publish-npm:
    name: Publish to NPM
    needs: [build-wasm-package]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
    steps:
      - name: Download WASM Package
        uses: actions/download-artifact@v5
        with:
          name: wasm-package
          path: pkg/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "## Publishing to NPM" >> $GITHUB_STEP_SUMMARY
          cd pkg
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️ NPM_TOKEN secret not configured. Skipping publish." >> $GITHUB_STEP_SUMMARY
            echo "To enable publishing, add NPM_TOKEN secret to the repository." >> $GITHUB_STEP_SUMMARY
          else
            npm publish --access public
            echo "✅ Published to NPM" >> $GITHUB_STEP_SUMMARY
          fi

  publish-summary:
    name: Publish Summary
    needs: [build-python-wheel, build-wasm-package]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Summary
        run: |
          echo "## Artifact Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Wheel (tools_core) | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| WASM/NPM Package (tools-core) | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "### Release: ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
            echo "Publishing to PyPI and NPM triggered." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.dry_run }}" == "false" ]; then
            echo "### Manual publish (dry_run=false)" >> $GITHUB_STEP_SUMMARY
            echo "Publishing to PyPI and NPM triggered." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Dry run — artifacts built but NOT published" >> $GITHUB_STEP_SUMMARY
            echo "To publish, re-run with dry_run=false or create a release." >> $GITHUB_STEP_SUMMARY
          fi
