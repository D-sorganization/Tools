name: Publish Artifacts
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write # Required for PyPI trusted publishing

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  build-python-wheel:
    timeout-minutes: 30
    needs: pick-runner
    name: Build Python Wheel
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable pragma: allowlist secret

      - name: Setup Python
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Install Maturin
        run: pip install maturin

      - name: Build Wheel
        run: |
          cd rust_core/tools-core
          maturin build --release --features python,extension-module
          echo "## Python Wheel Built" >> $GITHUB_STEP_SUMMARY
          ls -la ../../target/wheels/

      - name: Upload Wheel Artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-wheel
          path: target/wheels/*.whl
          retention-days: 30

  build-wasm-package:
    timeout-minutes: 30
    needs: pick-runner
    name: Build WASM/NPM Package
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable pragma: allowlist secret
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        env:
          WASM_PACK_VERSION: "0.13.1"
          WASM_PACK_SHA256: "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539" # pragma: allowlist secret
        run: |
          archive="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL \
            "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${archive}" \
            -o "${archive}"
          echo "${WASM_PACK_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}"
          mkdir -p "$HOME/.cargo/bin"
          cp "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            "$HOME/.cargo/bin/wasm-pack"
          chmod +x "$HOME/.cargo/bin/wasm-pack"

      - name: Build WASM Package
        run: |
          cd rust_core/tools-core
          wasm-pack build --target web --release -- --features wasm
          echo "## WASM Package Built" >> $GITHUB_STEP_SUMMARY
          ls -la pkg/

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-package
          path: rust_core/tools-core/pkg/
          retention-days: 30

  publish-pypi:
    timeout-minutes: 30
    name: Publish to PyPI
    needs: [pick-runner, build-python-wheel]
    runs-on: d-sorg-fleet
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
    environment:
      name: pypi # GitHub environment with PyPI trusted publishing configured
    steps:
      - name: Download Wheel
        uses: actions/download-artifact@v8
        with:
          name: python-wheel
          path: dist/

      - name: Install twine
        run: pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "## Publishing to PyPI" >> $GITHUB_STEP_SUMMARY
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "⚠️ PYPI_API_TOKEN secret not configured. Skipping publish." >> $GITHUB_STEP_SUMMARY
            echo "To enable publishing, add PYPI_API_TOKEN secret to the 'pypi' environment." >> $GITHUB_STEP_SUMMARY
          else
            twine upload dist/*.whl
            echo "✅ Published to PyPI" >> $GITHUB_STEP_SUMMARY
          fi

  publish-npm:
    timeout-minutes: 30
    name: Publish to NPM
    needs: [pick-runner, build-wasm-package]
    runs-on: d-sorg-fleet
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == 'false')
    environment:
      name: npm # GitHub environment with NPM_TOKEN and required reviewers.
    steps:
      - name: Download WASM Package
        uses: actions/download-artifact@v8
        with:
          name: wasm-package
          path: pkg/

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Publish to NPM
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "## Publishing to NPM" >> $GITHUB_STEP_SUMMARY
          cd pkg
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "⚠️ NPM_TOKEN secret not configured. Skipping publish." >> $GITHUB_STEP_SUMMARY
            echo "To enable publishing, add NPM_TOKEN secret to the 'npm' environment." >> $GITHUB_STEP_SUMMARY
          else
            npm publish --access public
            echo "✅ Published to NPM" >> $GITHUB_STEP_SUMMARY
          fi

  publish-summary:
    timeout-minutes: 30
    name: Publish Summary
    needs: [pick-runner, build-python-wheel, build-wasm-package]
    runs-on: d-sorg-fleet
    steps:
      - name: Generate Summary
        run: |
          echo "## Artifact Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Wheel (tools_core) | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "| WASM/NPM Package (tools-core) | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "### Release: ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
            echo "Publishing to PyPI and NPM triggered." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ inputs.dry_run }}" == "false" ]; then
            echo "### Manual publish (dry_run=false)" >> $GITHUB_STEP_SUMMARY
            echo "Publishing to PyPI and NPM triggered." >> $GITHUB_STEP_SUMMARY
          else
            echo "### Dry run — artifacts built but NOT published" >> $GITHUB_STEP_SUMMARY
            echo "To publish, re-run with dry_run=false or create a release." >> $GITHUB_STEP_SUMMARY
          fi
