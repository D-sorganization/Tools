name: "Validation Only - Issue 4714 Reconciliation Admission"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-issue-4714-reconciliation
  cancel-in-progress: false

jobs:
  focused-contract:
    name: Exact RED Intrinsic Delivery Admission
    runs-on: d-sorg-fleet
    timeout-minutes: 10
    steps:
      - name: Require Approved OGLaptop Runner
        shell: bash
        run: |
          case "${RUNNER_NAME:-}" in
            d-sorg-local-Oglaptop-1|d-sorg-local-Oglaptop-2|d-sorg-local-Oglaptop-3|d-sorg-local-Oglaptop-4)
              ;;
            *)
              echo "::error::Validation runner is outside the approved OGLaptop allowlist."
              exit 2
              ;;
          esac
          echo "Validated approved runner: ${RUNNER_NAME}"

      - name: Checkout Exact RED Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: bb4db02bff9f3fb0fc53ceec6403cccb6283d38f
          persist-credentials: false

      - name: Verify Exact RED Source
        shell: bash
        run: |
          expected_commit="bb4db02bff9f3fb0fc53ceec6403cccb6283d38f"
          expected_tree="f385e86cbb46ad89f259b279e0b3085af63337e5"
          test "$(git rev-parse HEAD)" = "${expected_commit}"
          test "$(git rev-parse 'HEAD^{tree}')" = "${expected_tree}"

      - name: Bootstrap Isolated Pinned Pytest Venv
        shell: bash
        run: |
          venv_path="${RUNNER_TEMP}/issue-4714-reconciliation-venv"
          python3 -m venv "${venv_path}"
          PIP_CONFIG_FILE=/dev/null PIP_NO_INPUT=1 \
            "${venv_path}/bin/python" -m pip install \
            --disable-pip-version-check \
            --index-url https://pypi.org/simple \
            --no-deps \
            --only-binary=:all: \
            pytest==9.0.3 \
            pytest-xdist==3.8.0 \
            execnet==2.1.1 \
            iniconfig==2.3.0 \
            packaging==26.2 \
            pluggy==1.6.0 \
            pygments==2.20.0
          echo "${venv_path}/bin" >> "${GITHUB_PATH}"

      - name: Run Exact Serial RED Contract
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -n 0 -p xdist.plugin
          tests/architecture/test_mocap_intrinsic_delivery_admission.py
