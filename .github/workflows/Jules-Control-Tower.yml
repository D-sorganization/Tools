name: Jules Control Tower

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ BLAST RADIUS DOCUMENTATION — Jules Control Tower                           │
# │                                                                             │
# │ WHAT THIS WORKFLOW CAN DO:                                                  │
# │  • Read repository contents and workflow run status (top-level)             │
# │  • Dispatch to worker sub-workflows via workflow_call (secrets: inherit)    │  # pragma: allowlist secret
# │  • Read CI run results and check iteration limits                           │
# │  • Route events to the appropriate worker workflow                          │
# │                                                                             │
# │ WHAT THIS WORKFLOW CANNOT DO (by itself):                                   │
# │  • Push commits or create/delete branches directly                          │
# │  • Open, close, or merge pull requests directly                             │
# │  • Trigger or cancel other workflow runs directly                           │
# │  • Write to issues or security events directly                              │
# │  ──  Write permissions are granted only at the job level of the             │
# │       worker workflow that actually requires them, not here.                │
# │                                                                             │
# │ APPROVAL GATES:                                                             │
# │  • Iteration limit: MAX_REPAIR_ITERATIONS=3 per MAX_ITERATIONS_WINDOW_HOURS │
# │  • Bot-actor guard: push/PR events from jules-bot are dropped silently      │
# │  • Protected-branch guard: main/master failures route to hotfix (no direct  │
# │    push); non-main failures route to auto-repair with its own limits        │
# └─────────────────────────────────────────────────────────────────────────────┘

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, closed]
  workflow_run:
    workflows: ["CI Standard"]
    types: [completed]
  workflow_dispatch:

# SAFEGUARD: Maximum iterations to prevent infinite repair loops
env:
  MAX_REPAIR_ITERATIONS: 3
  MAX_ITERATIONS_WINDOW_HOURS: 1

concurrency:
  group: jules-control-tower-${{ github.repository }}
  cancel-in-progress: true

# Least-privilege: this orchestrator only reads; write grants live in workers.
permissions:
  contents: read
  actions: read
  checks: read

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    # Same-repository guard (Tools #4923 / #4464): the call-* jobs below
    # dispatch reusable workflows with `secrets: inherit` whose jobs hold
    # contents/pull-requests: write, so a fork-sourced workflow_run must be
    # refused before triage ever runs.
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }} # pragma: allowlist secret
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  triage:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    if: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) }}
    # Removed global actor check to allow scheduled runs even if file modified by bot
    outputs:
      target: ${{ steps.decide.outputs.target }}
    steps:
      # SAFEGUARD: Check if we've exceeded max repair iterations in the time window
      - name: Check Iteration Limits
        id: check-limits
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }} # pragma: allowlist secret
          MAX_REPAIR_LIMIT: ${{ env.MAX_REPAIR_ITERATIONS }}
        run: |
          echo "Checking repair iteration limits..."
          BRANCH="${{ github.event.workflow_run.head_branch }}"
          HOURS_AGO=$(date -u -d "${{ env.MAX_ITERATIONS_WINDOW_HOURS }} hours ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-${{ env.MAX_ITERATIONS_WINDOW_HOURS }}H +%Y-%m-%dT%H:%M:%SZ)

          FAILURE_COUNT=$(gh run list \
            --workflow="CI Standard" \
            --branch="$BRANCH" \
            --limit=20 \
            --json conclusion,createdAt,status \
            --jq "[.[] | select(.conclusion == \"failure\" and .createdAt > \"$HOURS_AGO\")] | length" \
            2>/dev/null || echo "0")

          if [ "$FAILURE_COUNT" -ge "$MAX_REPAIR_LIMIT" ]; then
            echo "::error::Max repair iterations reached. Manual intervention required."
            echo "exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "exceeded=false" >> $GITHUB_OUTPUT
          fi

      - name: Analyze Event Context
        id: decide
        if: steps.check-limits.outcome == 'skipped' || steps.check-limits.outputs.exceeded != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const event = context.eventName;
            const actor = context.actor;
            const schedule = context.payload.schedule;
            const manualTarget = context.payload.inputs?.target;
            let target = "none";

            console.log(`Event: ${event}, Actor: ${actor}, Schedule: ${schedule}`);

            // 0. MANUAL DISPATCH - Honor explicit target selection
            if (event === "workflow_dispatch" && manualTarget && manualTarget !== "auto") {
              target = manualTarget;
              console.log(`Manual dispatch: ${target}`);
            }
            // 1. CI FAILURE -> AUTO-REPAIR or HOTFIX-CREATOR
            else if (event === "workflow_run" && context.payload.workflow_run.conclusion === "failure") {
               // Allow bot to trigger repair (handled by check-limits loop protection)
               const failedBranch = context.payload.workflow_run.head_branch;
               if (failedBranch === "main" || failedBranch === "master") {
                  target = "hotfix-creator";
               } else {
                  target = "auto-repair";
               }
            }
            // 2. SCHEDULED RUNS - Route by cron pattern (deterministic) with UTC time fallback
            else if (event === "schedule" || (event === "workflow_dispatch" && (!manualTarget || manualTarget === "auto"))) {
              // Always run schedules regardless of actor
              // Primary: Match exact cron pattern for deterministic routing
              if (schedule) {
                switch (schedule) {
                  case "0 8 * * 1,4":
                    // Single schedule triggers all work - use time-based routing below
                    target = "none";
                    break;
                  default:
                    target = "none";
                }
              }

              // Fallback: UTC time-based routing (for workflow_dispatch with auto or edge cases)
              if (target === "none") {
                const now = new Date();
                const hour = now.getUTCHours();
                const minute = now.getUTCMinutes();

                if (hour === 8 && minute < 30) {
                  target = "assessment-generator";
                } else if (hour === 8 && minute >= 30) {
                  target = "code-quality-reviewer";
                } else if (hour === 9 && minute < 30) {
                  target = "completist";
                } else if (hour === 9 && minute >= 30) {
                  target = "documentation-auditor";
                } else if (hour === 10 && minute >= 30) {
                  target = "sentinel";
                } else if (hour === 11 && minute < 30) {
                  target = "auto-refactor";
                } else if (hour === 11 && minute >= 30) {
                  target = "issue-resolver";
                } else if (hour === 12) {
                  target = "pr-compiler";
                } else if (hour === 13) {
                  target = "auto-rebase";
                } else {
                  target = "none";
                }
              }
            }
            // 3. PUSH TO MAIN -> DOCS
            else if (event === "push" && context.ref === "refs/heads/main") {
              if (actor === 'jules-bot' || actor === 'jules-ai[bot]') {
                 console.log("Ignoring push by bot to prevent doc-scribe loops.");
                 target = "none";
              } else {
                 target = "doc-scribe";
              }
            }
            // 4. NEW PR -> TEST GENERATOR
            else if (event === "pull_request" && context.payload.action === 'opened') {
               if (actor === 'jules-bot' || actor === 'jules-ai[bot]') {
                  console.log("Ignoring PR open by bot.");
                  target = "none";
               } else {
                  target = "test-generator";
               }
            }
            // 5. PR CLOSED -> ARCHIVIST
            else if (event === "pull_request" && context.payload.action === 'closed' && context.payload.pull_request.merged) {
               target = "archivist";
            }

            console.log(`Decision: Dispatching [${target}]`);
            core.setOutput("target", target);

  # --- WORKER DISPATCH ---

  call-repair:
    needs: triage
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.triage.outputs.target == 'auto-repair'
    uses: ./.github/workflows/Jules-Auto-Repair.yml
    with:
      run_id: ${{ format('{0}', github.event.workflow_run.id) }}
      branch: ${{ github.event.workflow_run.head_branch || '' }}
    secrets: inherit # pragma: allowlist secret

  call-hotfix-creator:
    needs: triage
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.triage.outputs.target == 'hotfix-creator'
    uses: ./.github/workflows/Jules-Hotfix-Creator.yml
    with:
      run_id: ${{ format('{0}', github.event.workflow_run.id) }}
      failed_branch: ${{ github.event.workflow_run.head_branch || '' }}
    secrets: inherit # pragma: allowlist secret

  call-scribe:
    needs: triage
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.triage.outputs.target == 'doc-scribe'
    uses: ./.github/workflows/Jules-Documentation-Scribe.yml
    secrets: inherit # pragma: allowlist secret

  call-tests:
    needs: triage
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.triage.outputs.target == 'test-generator'
    uses: ./.github/workflows/Jules-Test-Generator.yml
    secrets: inherit # pragma: allowlist secret

  call-auto-refactor:
    needs: triage
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.triage.outputs.target == 'auto-refactor'
    uses: ./.github/workflows/Jules-Auto-Refactor.yml
    secrets: inherit # pragma: allowlist secret

  call-auto-rebase:
    needs: triage
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.triage.outputs.target == 'auto-rebase'
    uses: ./.github/workflows/Jules-Auto-Rebase.yml
    secrets: inherit # pragma: allowlist secret

  call-archivist:
    needs: triage
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.triage.outputs.target == 'archivist'
    uses: ./.github/workflows/Jules-Archivist.yml
    secrets: inherit # pragma: allowlist secret

  call-sentinel:
    needs: triage
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.triage.outputs.target == 'sentinel'
    uses: ./.github/workflows/Jules-Sentinel.yml
    secrets: inherit # pragma: allowlist secret

  call-issue-resolver:
    needs: triage
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.triage.outputs.target == 'issue-resolver'
    uses: ./.github/workflows/Jules-Issue-Resolver.yml
    secrets: inherit # pragma: allowlist secret

  call-documentation-auditor:
    needs: triage
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.head_repository.full_name == github.repository) && needs.triage.outputs.target == 'documentation-auditor'
    uses: ./.github/workflows/Jules-Documentation-Auditor.yml
    secrets: inherit # pragma: allowlist secret
