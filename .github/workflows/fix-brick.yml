name: Fix Brick Toolcache
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-toolcache:
    strategy:
      matrix:
        runner:
          [
            d-sorg-fleet-2core,
            d-sorg-fleet-4core,
            d-sorg-fleet-8core,
            d-sorg-fleet-docker,
          ]
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Kill zombie Python processes
        run: |
          echo "Killing zombie python processes..."
          pkill -9 -f python || echo "no python processes found"
          pkill -9 -f python3 || echo "no python3 processes found"
          sleep 2

      - name: Create Symlink
        run: |
          echo "Attempting to create symlink..."
          if [ -L /opt/hostedtoolcache ]; then
            echo "/opt/hostedtoolcache is already a symlink."
            ls -la /opt/hostedtoolcache
          elif [ -d /opt/hostedtoolcache ]; then
            echo "/opt/hostedtoolcache is a directory."
            ls -la /opt/hostedtoolcache
          else
            echo "/opt/hostedtoolcache does not exist. Creating..."
            # Try sudo to create symlink. Since it's self-hosted, we check if NOPASSWD is set.
            sudo ln -s /home/dieterolson/actions-runners/.shared-tool-cache /opt/hostedtoolcache || echo "sudo failed"
            ls -la /opt/hostedtoolcache || echo "ls failed"
          fi

      - name: Clean up broken editable pth files
        run: |
          echo "Finding and removing broken editable .pth files..."
          if [ -d /opt/hostedtoolcache ]; then
            find /opt/hostedtoolcache -name "*__editable__*.pth" -print
            find /opt/hostedtoolcache -name "*__editable__*.pth" -delete || echo "delete failed"
          else
            echo "/opt/hostedtoolcache does not exist."
          fi

      - name: Clean up corrupted Python cache
        run: |
          echo "Cleaning Python tool cache..."
          # Clean opt/hostedtoolcache
          if [ -d /opt/hostedtoolcache/Python ]; then
            ls -la /opt/hostedtoolcache/Python
            echo "Deleting cached Python versions in /opt/hostedtoolcache..."
            rm -rf /opt/hostedtoolcache/Python || echo "rm /opt/hostedtoolcache failed"
          fi
          # Clean home/dieterolson/actions-runners/.shared-tool-cache
          if [ -d /home/dieterolson/actions-runners/.shared-tool-cache/Python ]; then
            echo "Deleting cached Python versions in actions-runners shared cache..."
            rm -rf /home/dieterolson/actions-runners/.shared-tool-cache/Python || echo "rm actions-runners shared cache failed"
          fi
          # Clean home/dieterolson/actions-runners-nvme/.shared-tool-cache
          if [ -d /home/dieterolson/actions-runners-nvme/.shared-tool-cache/Python ]; then
            echo "Deleting cached Python versions in actions-runners-nvme shared cache..."
            rm -rf /home/dieterolson/actions-runners-nvme/.shared-tool-cache/Python || echo "rm nvme shared cache failed"
          fi
