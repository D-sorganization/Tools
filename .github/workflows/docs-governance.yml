name: Docs Governance
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "rust_core/**"
      - "shared_scripts/**"
      - "schemas/**"
      - "manuals/tools/**"
      - "config/**"
      - "scripts/**"
      - "tests/architecture/test_design_manual_governance_contract.py"
      - "tests/architecture/test_tools_module_inventory_contract.py"
      - "tests/architecture/test_tools_manual_renderer_contract.py"
      - "tests/architecture/test_tools_textbook_chapter_contract.py"
      - "tests/architecture/test_tools_formula_traceability_contract.py"
      - ".github/workflows/docs-governance.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - "rust_core/**"
      - "shared_scripts/**"
      - "schemas/**"
      - "manuals/tools/**"
      - "config/**"
      - "scripts/**"
      - "tests/architecture/test_design_manual_governance_contract.py"
      - "tests/architecture/test_tools_module_inventory_contract.py"
      - "tests/architecture/test_tools_manual_renderer_contract.py"
      - "tests/architecture/test_tools_textbook_chapter_contract.py"
      - "tests/architecture/test_tools_formula_traceability_contract.py"
      - ".github/workflows/docs-governance.yml"

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  docs-governance:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        with:
          python-version: "3.12"
          cache: pip
      - uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e
        with:
          version: "3.8.2.1"
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Install focused governance test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest==9.0.3 jsonschema==4.24.0 pypdf==6.15.0
      - name: Validate docs governance
        run: python3 scripts/check_docs_governance.py
      - name: Validate engineering design-manual governance
        run: python3 -m scripts.check_design_manual_governance
      - name: Validate Tools module-inventory freshness
        run: python3 -m scripts.build_tools_module_inventory --check
      - name: Validate Tools textbook chapter contract
        run: python3 -m scripts.lint_tools_textbook_chapters
      - name: Validate Tools governed exemplar traceability
        run: python3 -m scripts.check_tools_exemplars
      - name: Validate Tools manual artifact freshness and semantics
        run: python3 -m scripts.render_tools_design_manual --check
      - name: Test engineering design-manual governance
        run: >-
          python3 -m pytest
          -o addopts=''
          tests/architecture/test_design_manual_governance_contract.py
          tests/architecture/test_tools_module_inventory_contract.py
          tests/architecture/test_tools_manual_renderer_contract.py
          tests/architecture/test_tools_textbook_chapter_contract.py
          tests/architecture/test_tools_formula_traceability_contract.py
          tests/architecture/test_tools_exemplar_manuals_contract.py
          -m 'not integration' -q
