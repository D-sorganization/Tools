# spec-check.yml — Specification Freshness Enforcement
#
# PURPOSE: Ensures SPEC.md is updated when source files change.
# DEPLOYMENT: Copy this file to .github/workflows/spec-check.yml in each repo.
#
# HOW IT WORKS:
# 1. On pull requests, detects which files changed
# 2. If source files changed but SPEC.md did not, posts a warning
# 3. Blocks merge unless spec-exempt label is applied or SPEC.md is updated
#
# Change-log rows are keyed by pull request, not by a serial spec version
# (Repository_Management#1520). This job only checks that SPEC.md was touched;
# the row grammar is enforced by shared_scripts/fleet_hooks.py spec-changelog
# and tests/architecture/test_spec_version_freshness.py.
#
# CONFIGURATION: Edit the 'source_patterns' in the Check step to match
# your repo's source directories.

name: Spec Check
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

    paths:
      - "docs/**"
      - "specs/**"
      - "**/*.md"
permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  spec-freshness:
    needs: pick-runner
    name: Verify SPEC.md freshness
    runs-on: d-sorg-fleet
    # Skip if spec-exempt label is applied
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (!contains(github.event.pull_request.labels.*.name, 'spec-exempt'))
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check if source files changed without SPEC.md update
        id: check
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          echo "Changed files:"
          git diff --name-only "$BASE_SHA" HEAD

          # Source patterns that require a spec update live in
          # scripts/ci/check_spec_freshness.py. A PR that carries only valid
          # change fragments (changes/<issue>-<slug>.md, RM-5 /
          # Repository_Management#1976) passes without editing SPEC.md:
          # collate-changes.yml writes the PR-keyed row after merge.
          python3 scripts/ci/check_spec_freshness.py --base "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Post warning comment
        if: steps.check.outputs.needs_update == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const body = `## ⚠️ SPEC.md Update Required

            Source files were modified in this PR but \`SPEC.md\` was not updated and no valid change fragment was found.

            **Per the [Specification-Driven Development Policy](https://github.com/D-sorganization/Repository_Management/blob/main/docs/SPECIFICATION_DRIVEN_DEVELOPMENT_POLICY.md):**
            - Preferred: Create a change fragment with \`python shared_scripts/changes_fragment.py new --issue <issue_number> --summary "one-line summary"\`
            - Alternatively: Update \`SPEC.md\` to reflect your changes and add a change log row
            - Or add the \`spec-exempt\` label if this PR genuinely doesn't affect the spec

            *This check is enforced by the spec-check CI workflow.*`;

            // Check if we already posted a comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.data.find(c =>
              c.body.includes('SPEC.md Update Required') &&
              c.user.type === 'Bot'
            );

            if (!existingComment) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail if spec is stale
        if: steps.check.outputs.needs_update == 'true'
        shell: bash
        run: |
          echo "::error::Source files changed but SPEC.md was not updated and no valid change fragment was found."
          echo "Update SPEC.md, add a change fragment (changes/README.md), or add the 'spec-exempt' label to bypass."
          exit 1

      - name: Spec check passed
        if: steps.check.outputs.needs_update == 'false'
        shell: bash
        run: |
          echo "✅ Spec check passed."
          if [[ "${{ steps.check.outputs.spec_changed }}" == "true" ]]; then
            echo "   SPEC.md was updated alongside source changes. Good."
          elif [[ "${{ steps.check.outputs.fragment_valid }}" == "true" ]]; then
            echo "   A valid change fragment stands in for the SPEC.md edit."
          elif [[ "${{ steps.check.outputs.source_changed }}" == "false" ]]; then
            echo "   No source files changed — spec update not required."
          fi
