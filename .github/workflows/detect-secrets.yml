name: Detect Secrets

# Enforces the detect-secrets baseline: any new secret introduced by a PR
# (or push to main) that is not already audited in `.secrets.baseline`
# will cause this job to fail.
#
# See issue #2407 (Credential and secret management hardening).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: |
          python -m pip install --upgrade pip
          python -m pip install detect-secrets

      - name: Scan against baseline
        run: |
          cp .secrets.baseline .secrets.baseline.before
          detect-secrets scan --baseline .secrets.baseline

      - name: Fail if baseline changed (new secret detected)
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys

          def load_normalized(path: str) -> dict:
              data = json.loads(pathlib.Path(path).read_text())
              data.pop("generated_at", None)
              results = {}
              for filename, findings in data.get("results", {}).items():
                  normalized_name = filename.replace("\\", "/")
                  normalized_findings = []
                  for finding in findings:
                      item = dict(finding)
                      if "filename" in item:
                          item["filename"] = item["filename"].replace("\\", "/")
                      normalized_findings.append(item)
                  results[normalized_name] = normalized_findings
              data["results"] = dict(sorted(results.items()))
              return data

          before = load_normalized(".secrets.baseline.before")
          after = load_normalized(".secrets.baseline")
          if before != after:
              print("detect-secrets baseline changed after normalization")
              sys.exit(1)
          PY
