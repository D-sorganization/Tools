name: Detect Secrets

# Enforces the detect-secrets baseline: any new secret introduced by a PR
# (or push to main) that is not already audited in `.secrets.baseline`
# will cause this job to fail.
#
# See issue #2407 (Credential and secret management hardening).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect-secrets:
    runs-on: [self-hosted, Linux, X64, d-sorg-fleet]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The scanner evaluates the current tree against the committed baseline;
          # fetching repository history only adds transfer time on the shared fleet.
          fetch-depth: 1

      - name: Clean up broken editable pth files
        run: |
          python3 -S -c "
          import glob, os
          patterns = [
              '/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth',
              '/home/dieterolson/actions-runners/.shared-tool-cache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth'
          ]
          for pat in patterns:
              for p in glob.glob(pat):
                  print('Found:', p)
                  try:
                      os.remove(p)
                      print('Deleted successfully:', p)
                  except Exception as e:
                      print('Error deleting:', p, e)
          "

      - name: Force-clean stale Python tool cache (NVMe runners)
        run: |
          for cache_root in /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache /home/dieterolson/actions-runners-nvme/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Checking $cache_root/Python for stale 3.12 installations..."
              for version_dir in "$cache_root/Python"/3.12.*; do
                if [ -d "$version_dir" ]; then
                  for arch_dir in "$version_dir"/*; do
                    if [ -d "$arch_dir" ]; then
                      if [ ! -x "$arch_dir/bin/python" ] && [ ! -x "$arch_dir/bin/python3" ]; then
                        echo "Directory $arch_dir is incomplete or broken. Cleaning..."
                        sudo rm -rf "$arch_dir" || rm -rf "$arch_dir" || true
                      else
                        py_bin="$arch_dir/bin/python"
                        if [ ! -x "$py_bin" ]; then
                          py_bin="$arch_dir/bin/python3"
                        fi
                        echo "Testing zlib import on $py_bin..."
                        if ! "$py_bin" -c "import zlib"; then
                          echo "Directory $arch_dir is corrupt (zlib import failed). Cleaning..."
                          sudo rm -rf "$arch_dir" || rm -rf "$arch_dir" || true
                        else
                          echo "Directory $arch_dir is healthy."
                        fi
                      fi
                    fi
                  done
                fi
              done
            fi
          done
      - name: Set up Python
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Install detect-secrets
        run: |
          python -m pip install detect-secrets

      - name: Scan against baseline
        run: |
          cp .secrets.baseline .secrets.baseline.before
          python -m detect_secrets scan --baseline .secrets.baseline --exclude-files '(^|/)(\.secrets\.baseline(\..*)?|src/document_processing/pdf_renamer/(API_KEY_SETUP|QUICK_START|README)\.md|.*\.txt|.*\.log|.*\.json|.*\.xml|.*\.ipynb)$'

      - name: Fail if baseline changed (new secret detected)
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys
          from collections import Counter

          def result_fingerprints(path: str) -> Counter[tuple[str, str, str]]:
              data = json.loads(pathlib.Path(path).read_text())
              fingerprints = []
              for filename, findings in data.get("results", {}).items():
                  normalized_name = filename.replace("\\", "/")
                  for finding in findings:
                      fingerprints.append(
                          (
                              normalized_name,
                              finding.get("type", ""),
                              finding.get("hashed_secret", ""),
                          )
                      )
              return Counter(fingerprints)

          before = result_fingerprints(".secrets.baseline.before")
          after = result_fingerprints(".secrets.baseline")
          added = after - before
          removed = before - after
          if added:
              print("detect-secrets baseline changed after normalization")
              for label, delta in (("added", added), ("removed", removed)):
                  summary = Counter((filename, kind) for filename, kind, _ in delta.elements())
                  for (filename, kind), count in sorted(summary.items()):
                      print(f"{label}: {count} finding(s) in {filename} ({kind})")
              sys.exit(1)
          PY
