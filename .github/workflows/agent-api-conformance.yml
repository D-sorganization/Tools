name: agent-api-conformance

on:
  pull_request:
    paths:
      - "src/shared/python/calc_backend/**"
      - "config/fleet_agent_api_conformance/**"
      - "scripts/run_agent_api_conformance.py"
      - ".github/workflows/agent-api-conformance.yml"
      - ".mcp.json"
      - "pyproject.toml"
      - "llms.txt"
  push:
    branches: [main]
    paths:
      - "src/shared/python/calc_backend/**"
      - "config/fleet_agent_api_conformance/**"
      - "scripts/run_agent_api_conformance.py"
      - ".github/workflows/agent-api-conformance.yml"
      - ".mcp.json"
      - "pyproject.toml"
      - "llms.txt"
  merge_group:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package with MCP extra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e ".[calc-mcp,test]"

      - name: Run Fleet Agent API conformance
        env:
          TOOLS_GIT_SHA: ${{ github.sha }}
        run: python scripts/run_agent_api_conformance.py
