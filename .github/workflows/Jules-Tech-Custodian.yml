name: Jules Tech Debt Custodian
on:
  workflow_call:

jobs:
  refactor-worst-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v6
        with: { node-version: "20" }
      - run: |
          npm install -g @google/jules
          pip install ruff==0.5.0

      - name: Identify Target File
        id: target
        run: |
          WORST_FILE=$(ruff check . --output-format text --select ALL 2>/dev/null | cut -d: -f1 | sort | uniq -c | sort -nr | head -n1 | awk '{print $2}')
          if [ -z "$WORST_FILE" ]; then
            echo "has_issues=false" >> $GITHUB_OUTPUT
          else
            echo "file=$WORST_FILE" >> $GITHUB_OUTPUT
            echo "has_issues=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Cleanup Branch
        if: steps.target.outputs.has_issues == 'true'
        id: branch # FIX: Added ID so we can output data
        env:
          TARGET: ${{ steps.target.outputs.file }}
        run: |
          # Quote $TARGET to handle paths with spaces
          BRANCH_NAME="refactor/custodian-$(date +%Y%m%d)-$(basename "$TARGET")"
          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"
          # FIX: This output now belongs to step 'branch', not 'target'
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Jules Integration (Disabled - API Migration Required)
        if: steps.target.outputs.has_issues == 'true'
        run: |
          # TODO: Jules CLI API changed in v0.1.x
          # Old: jules auth --token / jules task fix --prompt
          # New: jules new "prompt" / jules remote pull --session <id>
          # See: workflow-fixes/2026-01-19-jules-cli-migration in Repository_Management
          echo "::warning::Jules CLI integration disabled pending API migration"
          echo "Target: ${{ steps.target.outputs.file }}"
          echo "Branch: ${{ steps.branch.outputs.branch_name }}"
          # Exit gracefully - PR creation below will be skipped since no changes made

      - name: Dispatch Jules (Disabled)
        if: false  # Disabled until Jules CLI migration complete
        env:
          TARGET: ${{ steps.target.outputs.file }}
          # FIX: Reference the correct step output
          BRANCH: ${{ steps.branch.outputs.branch_name }}
        run: |
          jules task fix \
            --branch $BRANCH \
            --prompt "Refactor '$TARGET' to fix linting errors. Do not change logic."

      - name: Open PR
        if: steps.target.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch_name }}
          TARGET: ${{ steps.target.outputs.file }}
        run: |
          # 1. Create the PR (Capture the URL)
          PR_URL=$(gh pr create \
            --title "chore: weekly refactor of $TARGET" \
            --body "Automated cleanup." \
            --base main \
            --head $BRANCH \
            --label "auto-fix")

          echo "PR Created: $PR_URL"

          # 2. FORCE READY STATE (Fixes Draft Issue)
          # We use || true so it doesn't fail if the PR is already ready
          gh pr ready "$PR_URL" || true
