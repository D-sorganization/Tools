# Maturin CI — file_watcher Rust extension
#
# Two jobs. `wheel-gate` builds the `file_watcher_rs` Rust crate (cross-platform
# notify-based watcher with debouncing + gitignore filtering) on the local fleet
# and asserts the compiled module imports, on Python 3.10, 3.11 and 3.12: the
# crate's own pyproject declares requires-python >=3.10, and this is where that
# claim is proven. `rust-backend-gate` additionally asserts the wrapper package
# `shared.python.file_watcher` selects the Rust backend and runs its tests, on
# 3.11 and 3.12 only: that is root-package code, which conftest will not collect
# below the root requires-python floor (3.11), so a 3.10 leg exits 5 (#5434).
# Python 3.13 coverage is documented but not hard-gated here until all fleet
# runners have a 3.13 toolcache.
# The repo's
# local-only runner guard forbids hosted ubuntu/windows/macos runners; broad
# platform packaging remains covered by the existing allowlisted maturin
# workflow.
#
# Previously the wrapper imported ITSELF
# (`from shared.python.file_watcher import ...`) so the compiled extension was
# never reached and the backend was permanently `watchdog` (issue #3520).
# Renaming the compiled module to `file_watcher_rs` removes the self-import; this
# gate proves the extension is actually selected. The job hard-fails if the rust
# backend is not selected, so a broken/missing accelerator breaks the build
# instead of silently falling back to watchdog.

name: Maturin — file_watcher

on:
  push:
    branches: [main]
    paths:
      - "rust_core/file_watcher/**"
      - "src/shared/python/file_watcher/**"
      - ".github/workflows/maturin-file-watcher.yml"
  pull_request:
    paths:
      - "rust_core/file_watcher/**"
      - "src/shared/python/file_watcher/**"
      - ".github/workflows/maturin-file-watcher.yml"
  workflow_dispatch:

concurrency:
  group: maturin-file-watcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-gate:
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: file_watcher_rs wheel gate (Python ${{ matrix.python-version }})
    runs-on: d-sorg-fleet
    timeout-minutes: 30
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_TERM_COLOR: always

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Isolate Rust homes
        uses: ./.github/actions/isolate-rust-homes
      - name: Bootstrap rustup without editing shell profiles
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # dtolnay/rust-toolchain installs rustup WITHOUT --no-modify-path when
          # rustup is not on PATH (always true with a per-job CARGO_HOME). On
          # self-hosted runners that appends `. "$CARGO_HOME/env"` to the host's
          # ~/.bashrc and ~/.bash_profile on every job (RM#2064).
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none --no-modify-path -y
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy
      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip watchdog pytest
          python -m pip install --force-reinstall --no-cache-dir maturin
      - name: Build file_watcher_rs wheel
        run: python -m maturin build --release -m rust_core/file_watcher/Cargo.toml --out dist
      - name: Install the built wheel
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          python -m pip install "$WHEEL"
      - name: Assert the compiled module imports (hard fail — no silent skip)
        shell: bash
        run: |
          python - <<'PY'
          import file_watcher_rs as m
          required = {"FileWatcher", "ChangeEvent"}
          missing = required - set(dir(m))
          assert not missing, f"file_watcher_rs missing exports: {missing}"
          print("file_watcher_rs OK:", sorted(required))
          PY

  rust-backend-gate:
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: file_watcher_rs (d-sorg-fleet, Python ${{ matrix.python-version }})
    runs-on: d-sorg-fleet
    timeout-minutes: 30
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_TERM_COLOR: always

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Isolate Rust homes
        uses: ./.github/actions/isolate-rust-homes
      - name: Bootstrap rustup without editing shell profiles
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # dtolnay/rust-toolchain installs rustup WITHOUT --no-modify-path when
          # rustup is not on PATH (always true with a per-job CARGO_HOME). On
          # self-hosted runners that appends `. "$CARGO_HOME/env"` to the host's
          # ~/.bashrc and ~/.bash_profile on every job (RM#2064).
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --default-toolchain none --no-modify-path -y
            echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          fi
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip watchdog pytest
          python -m pip install --force-reinstall --no-cache-dir maturin

      - name: Build file_watcher_rs wheel
        run: python -m maturin build --release -m rust_core/file_watcher/Cargo.toml --out dist

      - name: Install the built wheel
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          python -m pip install "$WHEEL"

      - name: Assert the compiled module imports (hard fail — no silent skip)
        shell: bash
        run: |
          python - <<'PY'
          import file_watcher_rs as m
          required = {"FileWatcher", "ChangeEvent"}
          missing = required - set(dir(m))
          assert not missing, f"file_watcher_rs missing exports: {missing}"
          print("file_watcher_rs OK:", sorted(required))
          PY

      - name: Assert the wrapper selects the Rust backend (gate)
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from shared.python.file_watcher import backend
          got = backend()
          assert got == "rust", f"expected rust backend, got {got!r}"
          print("file_watcher backend gate OK:", got)
          PY

      - name: Run file_watcher test suite (gate)
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          python -m pytest tests/shared/python/file_watcher \
            -o addopts="" -p no:cacheprovider -v
