name: File Size Budget

# Enforces the 500-LOC-per-file budget for Python and Rust sources under src/.
# See docs/assessments/monolith_inventory_2026-04-10.md and issue #1997.
# Existing monoliths are grandfathered via scripts/monolith_baseline.txt.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**/*.py"
      - "src/**/*.rs"
      - "scripts/check_file_size_budget.py"
      - "scripts/monolith_baseline.txt"
      - ".github/workflows/file-size-budget.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  file-size-budget:
    runs-on: d-sorg-fleet
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR merge commit and both parents are sufficient for the
          # changed-file diff below. Full history repeatedly exhausts the
          # job timeout while unshallowing persistent self-hosted clones
          # (same contract as the CI Standard quality-gate checkout).
          fetch-depth: 2

      - name: Clean up broken editable pth files
        run: |
          python3 -S -c "
          import glob, os
          patterns = [
              '/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth',
              '/home/dieterolson/actions-runners/.shared-tool-cache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth'
          ]
          for pat in patterns:
              for p in glob.glob(pat):
                  print('Found:', p)
                  try:
                      os.remove(p)
                      print('Deleted successfully:', p)
                  except Exception as e:
                      print('Error deleting:', p, e)
          "

      - name: Resolve base ref
        id: base-ref
        shell: bash
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            base_ref="${{ github.base_ref }}"
          else
            base_ref="${{ github.event.repository.default_branch }}"
          fi
          if [ -z "$base_ref" ]; then
            base_ref="main"
          fi
          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "Using base ref: $base_ref"

      - name: Fetch base ref (bounded)
        shell: bash
        run: |
          # Keep the base fetch bounded so persistent self-hosted clones do
          # not transfer full history; deepen only until a merge base exists.
          base_ref="${{ steps.base-ref.outputs.base_ref }}"
          git fetch --depth=200 origin "$base_ref"
          for deepen in 1000 4000; do
            if git merge-base "origin/$base_ref" HEAD >/dev/null 2>&1; then
              break
            fi
            echo "No merge base at current depth; deepening by $deepen"
            git fetch --deepen="$deepen" origin "$base_ref"
          done
          if ! git merge-base "origin/$base_ref" HEAD >/dev/null 2>&1; then
            echo "::warning::No merge base with origin/$base_ref after bounded deepening; the budget check will scan all files against the baseline."
          fi

      - name: Enforce 500 LOC budget on changed files
        shell: bash
        run: |
          python3 scripts/check_file_size_budget.py \
            --max-loc 500 \
            --changed-only \
            --base-ref "origin/${{ steps.base-ref.outputs.base_ref }}" \
            --baseline-file scripts/monolith_baseline.txt
