name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better diffs
          
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit pytest pytest-cov
          if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi
          # Install from python/ subdirectory only
          
      - name: Run MATLAB Quality Check (Static Analysis)
        id: matlab-quality
        continue-on-error: true  # Non-blocking due to MATLAB license restrictions
        run: |
          if [ -f tools/matlab_utilities/scripts/matlab_quality_check.py ]; then
            echo "=========================================="
            echo "MATLAB Code Quality Checks"
            echo "=========================================="
            python tools/matlab_utilities/scripts/matlab_quality_check.py --output-format json > matlab_quality_results.json || true
            python tools/matlab_utilities/scripts/matlab_quality_check.py --output-format text || echo "⚠️  Quality issues found - see report above (non-blocking)"
          else
            echo "⚠️  MATLAB quality check script not found - skipping"
          fi
          
      - name: Upload MATLAB Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-quality-report
          path: matlab_quality_results.json
          retention-days: 30
          if-no-files-found: ignore
          
      - name: Run quality check
        id: quality-check
        run: |
          if [ -f scripts/quality-check.py ]; then
            python scripts/quality-check.py
          else
            echo "⚠️ Warning: scripts/quality-check.py not found"
          fi
          
      - name: Check for placeholders
        id: placeholders
        run: |
          # Fail if TODO, FIXME, or other placeholders found in Python files
          # Exclude quality check scripts that contain the patterns they check for
          # Use Python script if available for smarter detection (excludes type hints)
          # Use command directly in if condition to protect from -e flag behavior
          if [ -f scripts/check_placeholders.py ]; then
            if ! python3 scripts/check_placeholders.py; then
              echo "❌ ERROR: Placeholders found in code"
              exit 1
            else
              echo "✅ No placeholders found"
            fi
          else
            # Fallback to grep with improved pattern (exclude type hints with ...)
            # Pattern: match TODO/FIXME/XXX/HACK/NotImplementedError, or standalone ellipsis (not in type hints)
            if grep -r -E "\bTODO\b|\bFIXME\b|\bXXX\b|\bHACK\b|\bpass\s+#|NotImplementedError|^\s*\.\.\.\s*$|^\s*\.\.\.\s+#" \
              --include="*.py" \
              --exclude-dir=".git" \
              --exclude-dir="archive" \
              --exclude-dir="legacy" \
              --exclude-dir="experimental" \
              --exclude="quality_check.py" \
              --exclude="quality_check_script.py" \
              --exclude="quality-check.py" \
              --exclude="matlab_quality_check.py" \
              --exclude="check_placeholders.py" .; then
              echo "❌ ERROR: Placeholders found in code"
              exit 1
            else
              echo "✅ No placeholders found"
            fi
          fi
            
      - name: Check for magic numbers
        id: magic-numbers
        continue-on-error: true  # Non-blocking warning
        run: |
          # Check for common magic numbers that should be constants
          # Exclude constants_file.py (contains documented constants) and quality check scripts
          if grep -r "[^0-9a-zA-Z_]3\.14[0-9]*\|9\.8[0-9]*\|6\.67[0-9]*\|2\.71[0-9]*" \
            --include="*.py" \
            --exclude-dir=".git" \
            --exclude-dir="tests" \
            --exclude="constants_file.py" \
            --exclude="quality_check_script.py" \
            --exclude="quality-check.py" \
            --exclude="matlab_quality_check.py" .; then
            echo "⚠️ WARNING: Possible magic numbers found (should be named constants with sources)"
            echo "Examples: 3.14→math.pi, 9.8→GRAVITY_M_S2, 2.71→math.e"
            exit 1  # Fail to trigger warning indicator in summary
          else
            echo "✅ No obvious magic numbers found"
          fi
          
      - name: Check for approximations
        id: approximations
        run: |
          # Fail if "approximately" or similar found
          # Exclude constants_file.py (contains documented values with sources)
          # Exclude MATLAB files (may have legitimate variable names like 'approx')
          # Only check Python files for approximation words and ~ symbols
          if grep -ri "approximately\|roughly" \
            --include="*.py" \
            --exclude-dir=".git" \
            --exclude-dir="docs" \
            --exclude="constants_file.py" .; then
            echo "❌ ERROR: Approximations found - use exact values with sources"
            exit 1
          fi
          # Check for ~ in Python comments (but exclude constants_file.py)
          if grep -ri "~[0-9]" \
            --include="*.py" \
            --exclude-dir=".git" \
            --exclude-dir="docs" \
            --exclude="constants_file.py" .; then
            echo "❌ ERROR: Approximations found - use exact values with sources"
            exit 1
          fi
          echo "✅ No approximations found"
            
      - name: Run pre-commit
        id: pre-commit
        continue-on-error: true  # Non-blocking to match Audio_Processor
        run: |
          pre-commit run --all-files --show-diff-on-failure
          PRECOMMIT_EXIT_CODE=$?
          if [ $PRECOMMIT_EXIT_CODE -ne 0 ]; then
            echo "⚠️ Pre-commit checks failed, but this does not block CI. Please fix these issues."
            exit $PRECOMMIT_EXIT_CODE
          fi
          
      - name: Run strict type checking
        id: type-checking
        run: |
          pip install mypy
          if find . -name "*.py" -not -path "./archive/*" -not -path "./legacy/*" | head -n1 | grep -q .; then
            mypy . --strict --ignore-missing-imports || echo "⚠️ Type errors found"
          else
            echo "No Python files to type check"
          fi
          
      - name: Run tests with coverage
        id: tests
        run: |
          if [ -d python/tests ] || [ -d tests ]; then
            pytest -xvs --cov=python --cov-report=term-missing --cov-fail-under=60 || {
              echo "❌ Tests failed or coverage below 60%"
              exit 1
            }
          else
            echo "⚠️ WARNING: No tests directory found - ADD TESTS!"
          fi
          
      - name: Verify reproducibility
        run: |
          # Check that random seeds are set in Python files using randomness
          echo "Checking for unseeded randomness..."
          for file in $(find . -name "*.py" -type f -not -path "./archive/*" -not -path "./legacy/*"); do
            if grep -q "np\.random\|random\.\|torch\." "$file" 2>/dev/null; then
              if ! grep -q "seed\|random_state\|generator" "$file"; then
                echo "⚠️ Warning: $file uses randomness without visible seed"
              fi
            fi
          done
          
      - name: Check for required constants documentation
        run: |
          # Verify physical constants have units and sources
          echo "Checking constants documentation..."
          for file in $(find . -name "*.py" -type f -not -path "./tests/*" -not -path "./archive/*"); do
            if grep -q "GRAVITY\|MASS\|DENSITY\|COEFFICIENT" "$file" 2>/dev/null; then
              if ! grep -q "\[.*\].*#\|#.*\[.*\]" "$file"; then
                echo "⚠️ Warning: $file may have undocumented constants (need units + source)"
              fi
            fi
          done
          
      - name: Summary
        if: always()
        run: |
          echo "### CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # MATLAB Quality Check (non-blocking, continue-on-error: true)
          if [ "${{ steps.matlab-quality.outcome }}" == "success" ]; then
            echo "| MATLAB Quality Check | ✅ |" >> $GITHUB_STEP_SUMMARY
          elif [ -z "${{ steps.matlab-quality.outcome }}" ]; then
            echo "| MATLAB Quality Check | ⏭️ (skipped) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| MATLAB Quality Check | ⚠️ (non-blocking) |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Quality Check
          if [ "${{ steps.quality-check.outcome }}" == "success" ]; then
            echo "| Quality Check | ✅ |" >> $GITHUB_STEP_SUMMARY
          elif [ -z "${{ steps.quality-check.outcome }}" ]; then
            echo "| Quality Check | ⏭️ (skipped) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Quality Check | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi
          # Placeholders
          if [ "${{ steps.placeholders.outcome }}" == "success" ]; then
            echo "| No Placeholders | ✅ |" >> $GITHUB_STEP_SUMMARY
          elif [ -z "${{ steps.placeholders.outcome }}" ]; then
            echo "| No Placeholders | ⏭️ (skipped) |" >> $GITHUB_STEP_SUMMARY
          else
          else
            echo "| No Placeholders | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi
          # Magic Numbers
          if [ "${{ steps.magic-numbers.outcome }}" == "success" ]; then
            echo "| No Magic Numbers | ✅ |" >> $GITHUB_STEP_SUMMARY
          elif [ -z "${{ steps.magic-numbers.outcome }}" ]; then
            echo "| No Magic Numbers | ⏭️ (skipped) |" >> $GITHUB_STEP_SUMMARY
          else
          else
            echo "| No Magic Numbers | ⚠️ |" >> $GITHUB_STEP_SUMMARY
          fi
          # Approximations
          if [ "${{ steps.approximations.outcome }}" == "success" ]; then
            echo "| No Approximations | ✅ |" >> $GITHUB_STEP_SUMMARY
          elif [ -z "${{ steps.approximations.outcome }}" ]; then
            echo "| No Approximations | ⏭️ (skipped) |" >> $GITHUB_STEP_SUMMARY
          else
          else
            echo "| No Approximations | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi
          # Pre-commit (non-blocking)
          if [ "${{ steps.pre-commit.outcome }}" == "success" ]; then
            echo "| Pre-commit | ✅ |" >> $GITHUB_STEP_SUMMARY
          elif [ -z "${{ steps.pre-commit.outcome }}" ]; then
            echo "| Pre-commit | ⏭️ (skipped) |" >> $GITHUB_STEP_SUMMARY
          else
          else
            echo "| Pre-commit | ⚠️ (non-blocking) |" >> $GITHUB_STEP_SUMMARY
          fi
          # Type Checking
          if [ "${{ steps.type-checking.outcome }}" == "success" ]; then
            echo "| Type Checking | ✅ |" >> $GITHUB_STEP_SUMMARY
          elif [ -z "${{ steps.type-checking.outcome }}" ]; then
            echo "| Type Checking | ⏭️ (skipped) |" >> $GITHUB_STEP_SUMMARY
          else
          else
            echo "| Type Checking | ⚠️ |" >> $GITHUB_STEP_SUMMARY
          fi
          # Tests
          if [ "${{ steps.tests.outcome }}" == "success" ]; then
            echo "| Tests + Coverage | ✅ |" >> $GITHUB_STEP_SUMMARY
          elif [ -z "${{ steps.tests.outcome }}" ]; then
            echo "| Tests + Coverage | ⏭️ (skipped) |" >> $GITHUB_STEP_SUMMARY
          else
          else
            echo "| Tests + Coverage | ❌ |" >> $GITHUB_STEP_SUMMARY
          fi
          
  matlab-analysis:
    runs-on: ubuntu-latest
    if: false  # Enable when MATLAB runner available
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v2
        with:
          command: |
            % Add paths
            addpath(genpath('matlab'));
            
            % Check for magic numbers in MATLAB
            mFiles = dir('**/*.m');
            for i = 1:length(mFiles)
                content = fileread(fullfile(mFiles(i).folder, mFiles(i).name));
                if contains(content, {'3.14', '9.8', '6.67'})
                    warning('Possible magic number in %s', mFiles(i).name);
                end
            end
            
            % Run tests
            results = runtests('matlab/tests');
            assertSuccess(results);
