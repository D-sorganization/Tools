name: Rate Web Playwright

on:
  pull_request:
    paths:
      - "src/rate_of_closure/web/**"
      - ".github/workflows/rate-web-playwright.yml"
  push:
    branches: [main]
    paths:
      - "src/rate_of_closure/web/**"
      - ".github/workflows/rate-web-playwright.yml"
  workflow_dispatch:

concurrency:
  group: rate-web-playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-worker-e2e:
    name: Rate web production Worker E2E
    runs-on: d-sorg-fleet
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/rate_of_closure/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/rate_of_closure/web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci

      - name: Install locked Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Exercise production Worker lifecycle and layouts
        run: npm run test:e2e

      - name: Retain Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rate-web-playwright-report
          path: |
            src/rate_of_closure/web/playwright-report/
            src/rate_of_closure/web/test-results/
          if-no-files-found: error
          retention-days: 14
