name: Rate Web Playwright PR

on:
  pull_request:
    paths:
      - "src/rate_of_closure/web/**"
      - "src/rate_of_closure/club/**"
      - "src/rate_of_closure/model.py"
      - "src/rate_of_closure/plotting/**"
      - "src/rate_of_closure/simulation/**"
      - "src/rate_of_closure/variation/**"
      - "src/rate_of_closure/ui/pyqt6/**"
      - "src/shared/python/swing_sim/variation/**"
      - "tests/rate_of_closure/pyqt_variation_render_probe.py"
      - "tests/rate_of_closure/test_pyqt_variation_rendered_interactions.py"
      - "tests/ops/test_rate_web_playwright_workflow.py"
      - "pyproject.toml"
      - ".github/workflows/rate-web-playwright.yml"
      - ".github/workflows/rate-web-playwright-trusted.yml"

concurrency:
  group: rate-web-playwright-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-worker-e2e:
    name: Rate web production Worker E2E (ephemeral PR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/rate_of_closure/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/rate_of_closure/web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install locked web dependencies
        run: npm ci

      - name: Install Playwright-pinned browser runtimes
        run: npx --no-install playwright install --with-deps chromium firefox webkit

      - name: Exercise production Worker lifecycle, layouts, and browser parity
        run: npm run test:e2e

      - name: Install bounded PyQt render dependencies
        working-directory: .
        run: python -m pip install -e ".[gui,dev]" "scipy>=1.10,<1.18" "pytest-benchmark==5.2.3"

      - name: Exercise PyQt rendered interactions at 100 and 150 percent DPI
        working-directory: .
        env:
          QT_QPA_PLATFORM: offscreen
          RATE_PYQT_EVIDENCE_DIR: rate-pyqt-screenshots
        run: python -m pytest tests/rate_of_closure/test_pyqt_variation_rendered_interactions.py -q -n 0

      - name: Retain Playwright evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rate-web-playwright-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            src/rate_of_closure/web/playwright-report/
            src/rate_of_closure/web/test-results/
            rate-pyqt-screenshots/
          if-no-files-found: error
          retention-days: 14
