name: Rate of Closure Visual Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/rate-of-closure-visual-evidence.yml"
      - "src/rate_of_closure/web/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ground-tee-playwright:
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: d-sorg-fleet
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/rate_of_closure/web
    # Self-hosted runners share one ~/.npm across every job on the host, so
    # setup-node's `cache: npm` saved all of it (2.4 GB) and the restore
    # timed the job out. A workspace-local cache holds only this lockfile.
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/rate_of_closure/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Build production web application
        run: npm run build
      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Capture Ground and Tee evidence
        run: >-
          npx playwright test
          --project=chromium-desktop --project=chromium-narrow
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rate-of-closure-ground-tee-${{ github.sha }}
          path: |
            src/rate_of_closure/web/test-results/
            src/rate_of_closure/web/playwright-report/
          if-no-files-found: error
          retention-days: 14
