name: Release Automation

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Force a version bump type (major/minor/patch). Leave empty for auto-detect."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

jobs:
  # ── 1. Determine if this commit warrants a release ────────────────────
  analyse-commits:
    timeout-minutes: 60
    name: Analyse Commits
    runs-on: d-sorg-fleet
    outputs:
      bump: ${{ steps.bump.outputs.bump }}
      new_version: ${{ steps.bump.outputs.new_version }}
      current_version: ${{ steps.bump.outputs.current_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history required to walk commits since last tag

      - name: Set up supported Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        with:
          python-version: "3.12"

      - name: Read current version
        id: current
        run: |
          VERSION=$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              d = tomllib.load(f)
          print(d["project"]["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Parse commits and compute bump
        id: bump
        env:
          FORCE_BUMP: ${{ inputs.force_bump }}
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess

          # ── Get commits since last semver tag ──────────────────────────
          result = subprocess.run(
              ["git", "tag", "--sort=-version:refname", "--list", "v[0-9]*"],
              capture_output=True, text=True
          )
          tags = [t.strip() for t in result.stdout.splitlines() if t.strip()]
          last_tag = tags[0] if tags else ""

          if last_tag:
              log = subprocess.run(
                  ["git", "log", f"{last_tag}..HEAD", "--format=%s"],
                  capture_output=True, text=True
              ).stdout.strip()
          else:
              log = subprocess.run(
                  ["git", "log", "--format=%s"],
                  capture_output=True, text=True
              ).stdout.strip()

          messages = [m.strip() for m in log.splitlines() if m.strip()]
          force = os.environ.get("FORCE_BUMP", "").strip().lower()

          if (
              force not in ("major", "minor", "patch")
              and messages
              and re.match(r"^chore\(release\): bump version to v\d+\.\d+\.\d+$", messages[0])
          ):
              current = os.environ["CURRENT_VERSION"]
              with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
                  fh.write("bump=none\n")
                  fh.write(f"new_version={current}\n")
                  fh.write(f"current_version={current}\n")
              with open("release-changelog-entry.md", "w", encoding="utf-8") as fh:
                  fh.write("- Release bump commit detected; skipping recursive release automation.\n")
              print("Release bump commit detected; skipping recursive release automation.")
              raise SystemExit(0)

          # ── Conventional commits → bump type ───────────────────────────
          BREAKING = re.compile(r"BREAKING[ -]CHANGE|!:")
          FEAT     = re.compile(r"^feat(\(.+\))?!?:")
          FIX      = re.compile(r"^(fix|perf|refactor|revert)(\(.+\))?!?:")
          PATCH    = re.compile(r"^(chore|ci|docs|style|test|build)(\(.+\))?!?:")

          bump = "none"
          changelog_lines: list[str] = []

          for msg in messages:
              if BREAKING.search(msg):
                  bump = "major"
              elif FEAT.match(msg) and bump not in ("major",):
                  bump = "minor"
              elif FIX.match(msg) and bump not in ("major", "minor"):
                  bump = "patch"
              elif PATCH.match(msg) and bump == "none":
                  bump = "patch"
              changelog_lines.append(f"- {msg}")

          # Allow manual override
          if force in ("major", "minor", "patch"):
              bump = force

          # ── Compute new version ────────────────────────────────────────
          current = os.environ["CURRENT_VERSION"]
          major, minor, patch = map(int, current.split("."))
          if bump == "major":
              major, minor, patch = major + 1, 0, 0
          elif bump == "minor":
              minor, patch = minor + 1, 0
          elif bump == "patch":
              patch += 1

          new_version = f"{major}.{minor}.{patch}"
          changelog_entry = "\n".join(changelog_lines) if changelog_lines else "- No conventional commits found"

          # Keep scalar control values in GITHUB_OUTPUT. Release notes travel as
          # a file artifact so large histories never become process environment.
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"bump={bump}\n")
              fh.write(f"new_version={new_version}\n")
              fh.write(f"current_version={current}\n")
          with open("release-changelog-entry.md", "w", encoding="utf-8") as fh:
              fh.write(changelog_entry + "\n")

          print(f"Bump type : {bump}")
          print(f"Current   : {current}")
          print(f"New       : {new_version}")
          PY

      - name: Upload release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-changelog-entry
          path: release-changelog-entry.md
          if-no-files-found: error
          retention-days: 7

  # ── 2. Validate: tests + quality gates ──────────────────────────────
  validate:
    timeout-minutes: 60
    name: Validate
    runs-on: d-sorg-fleet
    needs: analyse-commits
    if: needs.analyse-commits.outputs.bump != 'none'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        with:
          python-version: "3.12"

      # Explicit cache: the built-in `cache: pip` on setup-python only checks
      # default lockfile locations. Hash both pyproject.toml and requirements*
      # so editable+dev installs benefit from wheel cache reuse.
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-release-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            pip-release-${{ runner.os }}-py3.12-
            pip-release-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ruff mypy
          python3 -m pip install -e ".[dev]" || python3 -m pip install -r requirements.txt || true

      - name: Collect Changed Python Files
        run: |
          if [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --diff-filter=ACMRT --name-only "${{ github.event.before }}" HEAD -- '*.py' > changed_python_files.txt
          else
            git diff --diff-filter=ACMRT --name-only HEAD~1 HEAD -- '*.py' > changed_python_files.txt || true
          fi
          cat changed_python_files.txt

      - name: Ruff lint
        run: |
          if [ -s changed_python_files.txt ]; then
            grep -v -E '^src/data_processing/|^src/document_processing/|^src/pendulum_simulator/|^src/movement_optimizer/|^src/scientific_modeling/|^src/tools/folder_tools/|^src/tools/code_quality_check\.py' \
              changed_python_files.txt > ruff_lint_files.txt || true
            if [ -s ruff_lint_files.txt ]; then
              xargs -r -d '\n' python3 -m ruff check < ruff_lint_files.txt
            else
              echo "No changed Python files to lint after applying exclude list."
            fi
          else
            echo "No changed Python files to lint."
          fi

      - name: Ruff format check
        run: |
          if [ -s changed_python_files.txt ]; then
            grep -v -E '^src/data_processing/|^src/document_processing/|^src/pendulum_simulator/|^src/movement_optimizer/|^src/scientific_modeling/|^src/tools/folder_tools/|^src/tools/code_quality_check\.py' \
              changed_python_files.txt > ruff_format_files.txt || true
            if [ -s ruff_format_files.txt ]; then
              xargs -r -d '\n' python3 -m ruff format --check < ruff_format_files.txt
            else
              echo "No changed Python files to format-check after applying exclude list."
            fi
          else
            echo "No changed Python files to format-check."
          fi

      - name: Run tests
        run: |
          python3 -m pytest -m "unit" -n auto --timeout=60 -q || true

  # ── 3. Bump version in pyproject.toml + VERSION file ────────────────
  bump-version:
    timeout-minutes: 60
    name: Bump Version
    runs-on: d-sorg-fleet
    needs: [analyse-commits, validate]
    if: needs.analyse-commits.outputs.bump != 'none'
    outputs:
      new_version: ${{ needs.analyse-commits.outputs.new_version }}
      release_pr_url: ${{ steps.release_pr.outputs.release_pr_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        with:
          python-version: "3.12"

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-changelog-entry
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update version in pyproject.toml
        env:
          NEW_VERSION: ${{ needs.analyse-commits.outputs.new_version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib

          new_version = os.environ["NEW_VERSION"]
          path = pathlib.Path("pyproject.toml")
          content = path.read_text()
          content = re.sub(
              r'^(version\s*=\s*)"[^"]+"',
              f'version = "{new_version}"',
              content,
              count=1,
              flags=re.MULTILINE,
          )
          path.write_text(content)
          print(f"pyproject.toml version → {new_version}")
          PY

      - name: Update VERSION file
        env:
          NEW_VERSION: ${{ needs.analyse-commits.outputs.new_version }}
        run: |
          echo "$NEW_VERSION" > VERSION
          echo "VERSION file → $NEW_VERSION"

      - name: Update CHANGELOG.md
        env:
          NEW_VERSION: ${{ needs.analyse-commits.outputs.new_version }}
          BUMP: ${{ needs.analyse-commits.outputs.bump }}
        run: |
          python3 - <<'PY'
          import os, datetime, pathlib

          new_version = os.environ["NEW_VERSION"]
          bump        = os.environ["BUMP"]
          entry       = pathlib.Path("release-changelog-entry.md").read_text(encoding="utf-8").rstrip()
          today       = datetime.date.today().isoformat()

          section = (
              f"## [{new_version}] — {today} ({bump} bump)\n\n"
              f"### Changes\n\n"
              f"{entry}\n"
          )

          path = pathlib.Path("CHANGELOG.md")
          existing = path.read_text() if path.exists() else "# Changelog\n\n"

          # Insert new section after the first heading line
          lines = existing.splitlines(keepends=True)
          insert_at = 0
          for i, line in enumerate(lines):
              if line.startswith("# "):
                  insert_at = i + 1
                  # Skip any blank lines immediately after heading
                  while insert_at < len(lines) and lines[insert_at].strip() == "":
                      insert_at += 1
                  break

          lines.insert(insert_at, section + "\n")
          path.write_text("".join(lines))
          print(f"CHANGELOG.md updated for v{new_version}")
          PY

      - name: Open version bump PR
        id: release_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.analyse-commits.outputs.new_version }}
          BUMP: ${{ needs.analyse-commits.outputs.bump }}
        run: |
          BRANCH="release/v${NEW_VERSION}-${GITHUB_RUN_ID}"
          git switch -c "$BRANCH"
          git add pyproject.toml VERSION CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No release version changes to commit."
            echo "release_pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(release): bump version to v${NEW_VERSION}"
          git push -u origin "$BRANCH"

          python3 - <<'PY'
          import os
          from pathlib import Path

          max_entry_chars = 20000
          new_version = os.environ["NEW_VERSION"]
          bump = os.environ["BUMP"]
          entry = Path("release-changelog-entry.md").read_text(encoding="utf-8").rstrip()
          if len(entry) > max_entry_chars:
              entry = (
                  entry[:max_entry_chars].rstrip()
                  + "\n\n... truncated; see CHANGELOG.md in this PR for the full entry."
              )

          Path("release_pr_body.md").write_text(
              "\n".join(
                  [
                      "## Summary",
                      f"- bump package metadata to v{new_version}",
                      "- update VERSION and CHANGELOG.md",
                      "",
                      "## Release Notes",
                      f"**Bump type:** {bump}",
                      "",
                      entry,
                      "",
                      f"Created by Release Automation run {os.environ['GITHUB_RUN_ID']}.",
                      "",
                  ]
              )
          )
          PY
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "chore(release): bump version to v${NEW_VERSION}" \
            --body-file release_pr_body.md)
          echo "release_pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "Opened release PR: $PR_URL"

  # ── 4. Create GitHub Release ─────────────────────────────────────────
  github-release:
    timeout-minutes: 60
    name: GitHub Release
    runs-on: d-sorg-fleet
    needs: [analyse-commits, bump-version]
    if: needs.analyse-commits.outputs.bump != 'none' && needs.bump-version.outputs.release_pr_url == ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Build source distribution
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build --sdist --outdir dist/

      - name: Download release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-changelog-entry

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ needs.analyse-commits.outputs.new_version }}
          BUMP: ${{ needs.analyse-commits.outputs.bump }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          entry = Path("release-changelog-entry.md").read_text(encoding="utf-8").rstrip()
          Path("release-notes.md").write_text(
              "\n".join(
                  [
                      "## What's Changed",
                      "",
                      f"**Bump type:** {os.environ['BUMP']}",
                      "",
                      entry,
                      "",
                      "---",
                      "*Generated automatically by the release workflow.*",
                      "",
                  ]
              ),
              encoding="utf-8",
          )
          PY

          gh release create "v${NEW_VERSION}" \
            dist/*.tar.gz \
            --title "v${NEW_VERSION}" \
            --notes-file release-notes.md \
            --repo "$GITHUB_REPOSITORY"
