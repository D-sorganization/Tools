name: Jules Documentation Scribe (Worker)

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ BLAST RADIUS DOCUMENTATION — Jules Documentation Scribe                    │
# │                                                                             │
# │ WHAT THIS WORKFLOW CAN DO:                                                  │
# │  • Create a new docs/update-* branch                                       │
# │  • Dispatch Jules AI to update Google-style docstrings for changed .py     │
# │    files (does not touch READMEs)                                          │
# │  • Open a pull request targeting main with the docstring updates           │
# │  • Delete the docs branch if Jules makes no changes                        │
# │                                                                             │
# │ WHAT THIS WORKFLOW CANNOT DO:                                               │
# │  • Push directly to main                                                   │
# │  • Auto-merge the PR it creates                                            │
# │  • Modify non-Python files or READMEs                                      │
# │                                                                             │
# │ APPROVAL GATES:                                                             │
# │  • Only triggered on push to main by non-bot actors (via Control Tower)    │
# │  • Bot-actor guard in Control Tower prevents doc-scribe loops              │
# │  • PR requires human review before merge                                   │
# └─────────────────────────────────────────────────────────────────────────────┘
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:

# Least-privilege top level: no write access by default.
permissions:
  contents: read

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  audit-documentation:
    needs: pick-runner
    runs-on: d-sorg-fleet
    timeout-minutes: 30
    # Grant write only at this job level — branch creation, Jules dispatch, and
    # PR creation all happen here. pick-runner needs no write access.
    permissions:
      contents: write # create docs/update-* branch and push Jules changes
      pull-requests: write # open the docstring-update PR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2 # We need at least 2 commits to run diff (HEAD and HEAD^)

      - name: Identify Changed Files
        id: changes
        run: |
          # FIX: Compare the immediate last commit (HEAD) with its parent (HEAD^)
          # This accurately captures "what just changed" in the push
          FILES=$(git diff --name-only HEAD^ HEAD | grep "\.py$" || true)

          if [ -z "$FILES" ]; then
            echo "No python files changed. Exiting."
            echo "files=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Flatten newlines to commas
          FILES_FLAT=$(echo "$FILES" | tr '\n' ', ')
          echo "files=$FILES_FLAT" >> $GITHUB_OUTPUT

      - name: Setup Node
        if: steps.changes.outputs.files != ''
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install & Auth Jules
        if: steps.changes.outputs.files != ''
        run: |
          npm install -g @google/jules@0.1.42
          jules auth --token ${{ secrets.JULES_API_KEY }}

      - name: Create Docs Branch
        if: steps.changes.outputs.files != ''
        id: branch
        run: |
          BRANCH_NAME="docs/update-$(date +%s)"
          git checkout -b $BRANCH_NAME
          git push -u origin $BRANCH_NAME
          echo "name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Dispatch Jules
        if: steps.changes.outputs.files != ''
        env:
          FILES: ${{ steps.changes.outputs.files }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          jules task fix \
            --branch $BRANCH \
            --prompt "The following files were modified: [ $FILES ]. Update Google-style docstrings for CodeWiki. Do not touch READMEs."

      - name: Open PR
        if: steps.changes.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          git fetch origin $BRANCH

          # Check if the Jules branch has any actual changes compared to where we started
          if git diff --quiet HEAD..origin/$BRANCH; then
            echo "Jules made no changes."
            git push origin --delete $BRANCH
          else
            # 1. Create the PR (Capture the URL)
            PR_URL=$(gh pr create \
              --title "[Jules/Documentation-Scribe] docs: update metadata" \
              --body "Automated docstring updates." \
              --base main \
              --head $BRANCH \
              --label "auto-fix")
            
            echo "PR Created: $PR_URL"

            # 2. FORCE READY STATE (Fixes Draft Issue)
            gh pr ready "$PR_URL" || true
          fi
