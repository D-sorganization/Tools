name: Cross-Repo Python Integration

on:
  push:
    branches: [main]
    paths:
      - "src/shared/python/**"
      - ".github/workflows/cross-repo-python-integration.yml"
  pull_request:
    paths:
      - "src/shared/python/**"
      - ".github/workflows/cross-repo-python-integration.yml"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: cross-repo-python-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using GitHub-hosted"
          fi
  downstream-consumer-contracts:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        downstream:
          - repo: D-sorganization/Gasification_Model
            path: _downstream
            install: pip install -r requirements.txt
            test_command: xvfb-run pytest tests/shared_contracts/ -v --tb=short
            env_name: REQUIRE_REAL_UPSTREAM_DRIFT_TOOLS
          - repo: D-sorganization/UpstreamDrift
            path: _downstream
            install: pip install -e ".[dev,gui-test]"
            test_command: xvfb-run --auto-servernum pytest tests/shared_contracts/ --timeout=60 --timeout-method=thread -v --tb=short
            env_name: REQUIRE_REAL_TOOLS_REPO

    steps:
      - name: Checkout Tools
        uses: actions/checkout@v6

      - name: Checkout ${{ matrix.downstream.repo }}
        id: checkout_downstream
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.downstream.repo }}
          path: ${{ matrix.downstream.path }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.checkout_downstream.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        if: steps.checkout_downstream.outcome == 'success'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 xvfb \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libdbus-1-3 \
            libxcb-xinput0 \
            libxcb-xfixes0

      - name: Check downstream suite availability
        if: steps.checkout_downstream.outcome == 'success'
        working-directory: ${{ matrix.downstream.path }}
        id: suite
        run: |
          if [ -d tests/shared_contracts ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Tools workspace for downstream tests
        if: steps.checkout_downstream.outcome == 'success' && steps.suite.outputs.available == 'true'
        working-directory: ${{ matrix.downstream.path }}
        run: |
          tools_repo_root="${{ github.workspace }}"
          tools_link="$(dirname "$PWD")/Tools"
          ln -sfn "$tools_repo_root" "$tools_link"

          echo "TOOLS_REPO_ROOT=$tools_repo_root" >> "$GITHUB_ENV"

          tools_pythonpath="$tools_repo_root/src/shared/python:$tools_repo_root/src:$tools_repo_root/src/python/src"
          if [ -n "${PYTHONPATH:-}" ]; then
            echo "PYTHONPATH=$tools_pythonpath:$PYTHONPATH" >> "$GITHUB_ENV"
          else
            echo "PYTHONPATH=$tools_pythonpath" >> "$GITHUB_ENV"
          fi

      - name: Install downstream dependencies
        if: steps.checkout_downstream.outcome == 'success' && steps.suite.outputs.available == 'true'
        working-directory: ${{ matrix.downstream.path }}
        run: ${{ matrix.downstream.install }}

      - name: Run downstream consumer contracts
        if: steps.checkout_downstream.outcome == 'success' && steps.suite.outputs.available == 'true'
        working-directory: ${{ matrix.downstream.path }}
        env:
          QT_QPA_PLATFORM: offscreen
          REQUIRE_REAL_UPSTREAM_DRIFT_TOOLS: ${{ matrix.downstream.env_name == 'REQUIRE_REAL_UPSTREAM_DRIFT_TOOLS' && '1' || '' }}
          REQUIRE_REAL_TOOLS_REPO: ${{ matrix.downstream.env_name == 'REQUIRE_REAL_TOOLS_REPO' && '1' || '' }}
        run: ${{ matrix.downstream.test_command }}

      - name: Summary
        if: always() && steps.checkout_downstream.outcome == 'success' && steps.suite.outputs.available == 'true'
        run: |
          echo "## Cross-Repo Python Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Downstream: ${{ matrix.downstream.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test suite: tests/shared_contracts/" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (suite missing)
        if: steps.checkout_downstream.outcome == 'success' && steps.suite.outputs.available != 'true'
        run: |
          echo "## Cross-Repo Python Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Downstream: ${{ matrix.downstream.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skipped: downstream default branch does not yet contain tests/shared_contracts/." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (skipped)
        if: steps.checkout_downstream.outcome != 'success'
        run: |
          echo "## Cross-Repo Python Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Downstream: ${{ matrix.downstream.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skipped: workflow token could not checkout the downstream repository." >> "$GITHUB_STEP_SUMMARY"
