name: Cross-Repo Python Integration

on:
  push:
    branches: [main, staging]
    paths:
      - "src/shared/python/**"
      - "src/python/**"
      - "manifests/**"
      - ".github/workflows/cross-repo-python-integration.yml"
  pull_request:
    branches: [staging, main]
    paths:
      - "src/shared/python/**"
      - "src/python/**"
      - "manifests/**"
      - ".github/workflows/cross-repo-python-integration.yml"
  workflow_dispatch:

concurrency:
  group: cross-repo-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  downstream-consumer-contracts:
    needs: pick-runner
    runs-on: [self-hosted, Linux, X64, d-sorg-fleet]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        downstream:
          - repo: D-sorganization/Gasification_Model
            path: _downstream
            install: pip install -r requirements.txt
            test_command: xvfb-run pytest tests/shared_contracts/ -v --tb=short
            env_name: REQUIRE_REAL_UPSTREAM_DRIFT_TOOLS
            sparse_checkout: |
              src
              tests/shared_contracts
            sparse_cone: true
          - repo: D-sorganization/UpstreamDrift
            path: _downstream
            # The shared-contract lane injects this PR's Tools source through
            # TOOLS_REPO_ROOT/PYTHONPATH below. Keep UpstreamDrift's editable
            # install from rebuilding its UI or packaging its pinned Tools
            # snapshot, which is a different release-authority boundary.
            install: CI= SKIP_UI_BUILD=1 pip install -e ".[dev,gui-test]"
            test_command: xvfb-run --auto-servernum pytest tests/shared_contracts/ -n 0 --timeout=60 --timeout-method=thread -v --tb=short
            env_name: REQUIRE_REAL_TOOLS_REPO
            sparse_checkout: |
              README.md
              build_hooks.py
              launch_golf_suite.py
              launch_upstream_drift.py
              pyproject.toml
              scripts
              src/bunkershot3d/postproc/wrench_trace.py
              src/shared
              tests/conftest.py
              tests/shared_contracts
              tests/support
            sparse_cone: false

    steps:
      - name: Checkout Tools
        uses: actions/checkout@v7

      - name: Checkout ${{ matrix.downstream.repo }}
        id: checkout_downstream
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.downstream.repo }}
          path: ${{ matrix.downstream.path }}
          token: ${{ secrets.RUNNER_CHECK_TOKEN || github.token }}
          fetch-depth: 1
          sparse-checkout: ${{ matrix.downstream.sparse_checkout }}
          sparse-checkout-cone-mode: ${{ matrix.downstream.sparse_cone }}

      - name: Select persistent Python tool cache
        run: |
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "::error::RUNNER_TOOL_CACHE is unavailable"
            exit 1
          fi
          echo "AGENT_TOOLSDIRECTORY=$RUNNER_TOOL_CACHE" >> "$GITHUB_ENV"

      - name: Force-clean stale Python tool cache (NVMe runners)
        run: |
          for cache_root in "$AGENT_TOOLSDIRECTORY" /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache /home/dieterolson/actions-runners-nvme/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Checking $cache_root/Python for stale 3.11 installations..."
              for version_dir in "$cache_root/Python"/3.11.*; do
                if [ -d "$version_dir" ]; then
                  for arch_dir in "$version_dir"/*; do
                    if [ -d "$arch_dir" ]; then
                      if [ ! -x "$arch_dir/bin/python" ] && [ ! -x "$arch_dir/bin/python3" ]; then
                        echo "Directory $arch_dir is incomplete or broken. Cleaning..."
                        sudo rm -rf "$arch_dir" || rm -rf "$arch_dir" || true
                      else
                        py_bin="$arch_dir/bin/python"
                        if [ ! -x "$py_bin" ]; then
                          py_bin="$arch_dir/bin/python3"
                        fi
                        echo "Testing zlib import on $py_bin..."
                        if ! "$py_bin" -c "import zlib"; then
                          echo "Directory $arch_dir is corrupt (zlib import failed). Cleaning..."
                          sudo rm -rf "$arch_dir" || rm -rf "$arch_dir" || true
                        else
                          echo "Directory $arch_dir is healthy."
                        fi
                      fi
                    fi
                  done
                fi
              done
            fi
          done
      - name: Set up Python
        if: steps.checkout_downstream.outcome == 'success'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Purge pip cache
        run: |
          python -m pip cache purge || true
          python -c "
          import pathlib, site, shutil
          for sp in site.getsitepackages():
              sp_path = pathlib.Path(sp)
              if not sp_path.exists(): continue
              for p in sp_path.glob('~*'):
                  if p.is_dir(): shutil.rmtree(p, ignore_errors=True)
                  else: p.unlink(missing_ok=True)
              for d in sp_path.glob('*.dist-info'):
                  if not (d / 'RECORD').exists():
                      pkg = d.stem.split('-')[0].lower().replace('_', '-')
                      shutil.rmtree(d, ignore_errors=True)
                      for p in sp_path.glob(pkg + '*'):
                          if p.is_dir(): shutil.rmtree(p, ignore_errors=True)
                          else: p.unlink(missing_ok=True)
          " || true
      - name: Install system dependencies
        if: steps.checkout_downstream.outcome == 'success'
        run: |
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done; sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock && sudo apt-get -o DPkg::Lock::Timeout=300 update || true
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done; sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock && sudo apt-get -o DPkg::Lock::Timeout=300 update --fix-missing || true; sudo apt-get -o DPkg::Lock::Timeout=300 install -y \
            libegl1 libgl1 xvfb \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libdbus-1-3 \
            libxcb-xinput0 \
            libxcb-xfixes0

      - name: Check downstream suite availability
        if: steps.checkout_downstream.outcome == 'success'
        working-directory: ${{ matrix.downstream.path }}
        id: suite
        run: |
          if [ -d tests/shared_contracts ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Tools workspace for downstream tests
        if: steps.checkout_downstream.outcome == 'success' && steps.suite.outputs.available == 'true'
        working-directory: ${{ matrix.downstream.path }}
        run: |
          touch "${{ github.workspace }}/src/__init__.py" "${{ github.workspace }}/src/shared/__init__.py"
          mkdir -p src/shared/python vendor/ud-tools/src/shared/python tests/support
          touch src/shared/python/__init__.py vendor/ud-tools/src/shared/python/__init__.py
          touch tests/__init__.py tests/support/__init__.py
          touch src/shared/python/contracts.py vendor/ud-tools/src/shared/python/contracts.py
          if [ ! -f tests/support/suite_markers.py ]; then
            python -c "
          import pathlib
          content = '''from __future__ import annotations
          SUITE_MARKERS = frozenset({'unit', 'integration', 'e2e', 'slow', 'live_simulation', 'benchmark', 'perf', 'smoke', 'gate', 'parity', 'scientific', 'motion_pipeline'})
          ENFORCE_ENV_VAR = 'UD_ENFORCE_SUITE_MARKERS'
          RATCHET_ENV_VAR = 'UD_RATCHET_SUITE_MARKERS'
          def suite_markers_enforced() -> bool: return False
          def suite_markers_ratchet_enforced() -> bool: return False
          def load_suite_marker_baseline(): return set()
          def classify_item(item): return True
          '''
          pathlib.Path('tests/support/suite_markers.py').write_text(content, encoding='utf-8')
          "
          fi
          tools_repo_root="${{ github.workspace }}"
          tools_link="$(dirname "$PWD")/Tools"
          ln -sfn "$tools_repo_root" "$tools_link"

          echo "TOOLS_REPO_ROOT=$tools_repo_root" >> "$GITHUB_ENV"

          tools_pythonpath="$tools_repo_root:$tools_repo_root/src/shared/python:$tools_repo_root/src:$tools_repo_root/src/python/src"
          if [ -n "${PYTHONPATH:-}" ]; then
            echo "PYTHONPATH=$tools_pythonpath:$PYTHONPATH" >> "$GITHUB_ENV"
          else
            echo "PYTHONPATH=$tools_pythonpath" >> "$GITHUB_ENV"
          fi

      - name: Install downstream dependencies
        if: steps.checkout_downstream.outcome == 'success' && steps.suite.outputs.available == 'true'
        working-directory: ${{ matrix.downstream.path }}
        run: ${{ matrix.downstream.install }}

      - name: Run downstream consumer contracts
        if: steps.checkout_downstream.outcome == 'success' && steps.suite.outputs.available == 'true'
        working-directory: ${{ matrix.downstream.path }}
        env:
          QT_QPA_PLATFORM: offscreen
          REQUIRE_REAL_UPSTREAM_DRIFT_TOOLS: ${{ matrix.downstream.env_name == 'REQUIRE_REAL_UPSTREAM_DRIFT_TOOLS' && '1' || '' }}
          REQUIRE_REAL_TOOLS_REPO: ${{ matrix.downstream.env_name == 'REQUIRE_REAL_TOOLS_REPO' && '1' || '' }}
        run: ${{ matrix.downstream.test_command }}

      - name: Summary
        if: always() && steps.checkout_downstream.outcome == 'success' && steps.suite.outputs.available == 'true'
        working-directory: ${{ matrix.downstream.path }}
        run: |
          echo "## Cross-Repo Python Integration: ${{ matrix.downstream.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Downstream consumer: ${{ matrix.downstream.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contract suite: \`tests/shared_contracts/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -d tests/shared_contracts ]; then
            echo "### Contract categories tested:" >> "$GITHUB_STEP_SUMMARY"
            find tests/shared_contracts -name "test_*.py" -o -name "*_test.py" 2>/dev/null | sort | while read -r f; do
              echo "- \`$f\`" >> "$GITHUB_STEP_SUMMARY"
            done
          fi

      - name: Summary (suite missing)
        if: steps.checkout_downstream.outcome == 'success' && steps.suite.outputs.available != 'true'
        run: |
          echo "## Cross-Repo Python Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Downstream: ${{ matrix.downstream.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skipped: downstream default branch does not yet contain tests/shared_contracts/." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary (skipped)
        if: steps.checkout_downstream.outcome != 'success'
        run: |
          echo "## Cross-Repo Python Integration" >> "$GITHUB_STEP_SUMMARY"
          echo "- Downstream: ${{ matrix.downstream.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Skipped: workflow token could not checkout the downstream repository." >> "$GITHUB_STEP_SUMMARY"
