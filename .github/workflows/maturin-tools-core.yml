# Maturin CI — tools_core Python extension
#
# `wheel-gate` builds the `tools-core` Rust crate (shared simulation kernel:
# math primitives, ball flight, RRT, signal processing) as a maturin wheel on
# the local fleet and asserts the compiled module imports, on Python 3.10, 3.11
# and 3.12. The crate's own pyproject declares requires-python >=3.10, and this
# is where that claim is proven: ci-standard.yml builds it on 3.11 and 3.12
# only (#5436). It is a root Cargo workspace member and depends on
# rust_core/math-primitives, so changes to either trigger the gate.
# Python 3.13 coverage is deferred until all fleet runners have a 3.13
# toolcache (same policy as the other maturin workflows).

name: Maturin — tools_core

on:
  push:
    branches: [main]
    paths:
      - "rust_core/tools-core/**"
      - "rust_core/math-primitives/**"
      - "Cargo.toml"
      - ".github/workflows/maturin-tools-core.yml"
  pull_request:
    paths:
      - "rust_core/tools-core/**"
      - "rust_core/math-primitives/**"
      - "Cargo.toml"
      - ".github/workflows/maturin-tools-core.yml"
  workflow_dispatch:

concurrency:
  group: maturin-tools-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel-gate:
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: tools_core wheel gate (Python ${{ matrix.python-version }})
    runs-on: d-sorg-fleet
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall --no-cache-dir maturin
      - name: Build tools_core wheel
        run: python -m maturin build --release -m rust_core/tools-core/Cargo.toml --out dist
      - name: Install the built wheel
        shell: bash
        run: |
          WHEEL=$(ls dist/*.whl | head -1)
          python -m pip install "$WHEEL"
      - name: Assert the compiled module imports (hard fail — no silent skip)
        shell: bash
        run: |
          python - <<'PY'
          import tools_core as m
          required = {"Vector3", "Quaternion", "Matrix3", "simulate_trajectory", "lerp", "clamp"}
          missing = required - set(dir(m))
          assert not missing, f"tools_core missing exports: {missing}"
          print("tools_core OK:", sorted(required))
          PY
