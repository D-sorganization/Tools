name: "CodeQL"

# Re-enabled 2026-09-03 (Tools #4923, Repository_Management#1505 Phase 1 /
# RM #1507). The file had been parked as codeql-analysis.yml.disabled with a
# single no-op job since the runner-fleet migration. Python and
# JavaScript/TypeScript are analysed on every PR to main and weekly on main.
# Runs on the self-hosted fleet: local-only-runner-guard.yml does not allowlist
# a hosted runner for this workflow, and the CodeQL bundle downloads fine
# there (see docs/workflows/WORKFLOW_TRACKING.md).

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "manuals/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "manuals/**"
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: d-sorg-fleet
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write # upload SARIF to the code-scanning tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - name: Git HTTP/1.1 workaround
        run: git config --global http.version HTTP/1.1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Vendored third-party and generated trees are not this repo's code.
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/dist/**"
              - "**/build/**"
              - "manuals/**"
              - "docs/**"
              - "vendor/**"

      # Python and JavaScript need no build step; `autobuild` is intentionally
      # omitted so a broken Rust/Tauri toolchain can never fail the scan.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
