name: CodeQL Security Analysis

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.js"
      - "**.ts"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "**.js"
      - "**.ts"
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use extended security queries for more thorough analysis
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # Upload results to GitHub Security tab
          upload: true

  # Additional security checks that complement CodeQL
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install security tools
        run: |
          pip install bandit pip-audit safety

      - name: Run Bandit (Python security linter)
        run: |
          bandit -r src/ -ll -ii -x tests/,archive/,legacy/ -f json -o bandit-results.json || true
          bandit -r src/ -ll -ii -x tests/,archive/,legacy/ -f txt

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          pip-audit -r requirements.txt --progress-spinner=off || true

      - name: Run Safety check
        run: |
          safety check -r requirements.txt --full-report || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-results.json
          retention-days: 30

  # SAST for secrets detection
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
