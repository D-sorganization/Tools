name: "CodeQL"

# Re-enabled 2026-09-03 (Tools #4923, Repository_Management#1505 Phase 1 /
# RM #1507). The file had been parked as codeql-analysis.yml.disabled with a
# single no-op job since the runner-fleet migration. Python and
# JavaScript/TypeScript are analysed on every PR to main and weekly on main.
# Weekly scheduled scans run on ubuntu-latest (#5704) so they do not compete
# with PR lanes on d-sorg-fleet. PR and push events use the same hosted lane.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "manuals/**"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "manuals/**"
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write # upload SARIF to the code-scanning tab
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - name: Git HTTP/1.1 workaround
        run: git config --global http.version HTTP/1.1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # Vendored third-party and generated trees are not this repo's code.
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - "**/dist/**"
              - "**/build/**"
              - "manuals/**"
              - "docs/**"
              - "vendor/**"

      # Python and JavaScript need no build step; `autobuild` is intentionally
      # omitted so a broken Rust/Tauri toolchain can never fail the scan.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
