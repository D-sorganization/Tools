# Maturin CI — ai_backend Python wheels
#
# Builds Python extension wheels for `ai_backend` on the native Linux fleet.
# Windows/macOS qualification remains open in issue #5684; the Linux build
# matrix does not claim those platforms are qualified.
#
# Triggered on:
#   - push to main (when ai_backend sources change)
#   - pull_request touching ai_backend sources
#   - workflow_dispatch (manual trigger / release)
#
# Acceptance criteria (issue #2870):
#   1. Matrix: native Linux fleet × Python versions
#   2. Python versions: 3.10, 3.11, 3.12, 3.13
#   3. maturin build --release --features python,extension-module
#   4. Upload wheel artifacts per actual runner/python combination

name: Maturin — ai_backend Wheels

on:
  push:
    branches: [main]
    paths:
      - "rust_core/ai_backend/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "src/shared/python/ai/adapters/rust_adapter.py"
      - "tests/shared/python/ai/test_rust_adapter_wheel_smoke.py"
      - ".github/workflows/maturin-ai-backend.yml"
      - "tests/unit/rust/test_ai_backend_workspace.py"
  pull_request:
    paths:
      - "rust_core/ai_backend/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "src/shared/python/ai/adapters/rust_adapter.py"
      - "tests/shared/python/ai/test_rust_adapter_wheel_smoke.py"
      - ".github/workflows/maturin-ai-backend.yml"
      - "tests/unit/rust/test_ai_backend_workspace.py"
  workflow_dispatch:

concurrency:
  group: maturin-ai-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: Build native Linux wheel (Python ${{ matrix.python-version }})
    runs-on: d-sorg-fleet
    timeout-minutes: 30
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: "268435456"

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Isolate Rust homes
        uses: ./.github/actions/isolate-rust-homes
      - name: Bootstrap rustup without editing shell profiles
        if: runner.os != 'Windows'
        uses: ./.github/actions/bootstrap-rustup-no-modify-path
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            rust_core/ai_backend/target
          key: maturin-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ hashFiles('rust_core/ai_backend/Cargo.toml', 'Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            maturin-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-
            maturin-${{ runner.os }}-${{ runner.arch }}-

      - name: Install maturin
        run: pip install maturin

      - name: Clippy - ai_backend (python feature)
        working-directory: rust_core/ai_backend
        run: cargo clippy --features python -- -D warnings

      - name: Build wheel
        working-directory: rust_core/ai_backend
        run: maturin build --release --features python,extension-module --out ../../dist/${{ runner.os }}/${{ runner.arch }}/py${{ matrix.python-version }}

      - name: Assert wheel manylinux policy (oracle 3)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip auditwheel
          shopt -s nullglob
          WHEELS=(dist/${{ runner.os }}/${{ runner.arch }}/py${{ matrix.python-version }}/*.whl)
          if (( ${#WHEELS[@]} != 1 )); then
            printf 'Expected exactly one wheel, found %s\n' "${#WHEELS[@]}" >&2
            exit 1
          fi
          WHEEL="${WHEELS[0]}"
          auditwheel show "$WHEEL" | tee /tmp/auditwheel-show.txt
          if ! grep -qi manylinux /tmp/auditwheel-show.txt; then
            repair_dir="dist/${{ runner.os }}/${{ runner.arch }}/py${{ matrix.python-version }}/repaired"
            mkdir -p "$repair_dir"
            auditwheel repair -w "$repair_dir" "$WHEEL"
            REPAIRED=$(ls "$repair_dir"/*.whl | head -1)
            auditwheel show "$REPAIRED" | tee /tmp/auditwheel-repaired.txt
            if ! grep -qi manylinux /tmp/auditwheel-repaired.txt; then
              echo "Repaired wheel still lacks a manylinux policy tag" >&2
              exit 1
            fi
            mv "$REPAIRED" "$WHEEL"
          fi

      - name: Record native wheel evidence
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import sys
          from pathlib import Path

          from pip._vendor.packaging.tags import sys_tags
          from pip._vendor.packaging.utils import parse_wheel_filename

          output_dir = Path("dist/${{ runner.os }}/${{ runner.arch }}/py${{ matrix.python-version }}")
          wheel_path = next(output_dir.glob("*.whl"))
          _, _, _, wheel_tags = parse_wheel_filename(wheel_path.name)
          compatible_tags = set(sys_tags())
          assert wheel_tags & compatible_tags, (
              f"Wheel tags {sorted(map(str, wheel_tags))} do not match "
              f"this interpreter: {sys.executable}"
          )
          artifact_name = "wheel-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}"
          evidence = {
              "runner_os": "${{ runner.os }}",
              "runner_arch": "${{ runner.arch }}",
              "machine": platform.machine(),
              "python_executable": sys.executable,
              "python_version": sys.version,
              "wheel_file": wheel_path.name,
              "wheel_tags": sorted(map(str, wheel_tags)),
              "compatible_tags": sorted(map(str, wheel_tags & compatible_tags)),
              "artifact_name": artifact_name,
          }
          evidence_path = output_dir / "build-evidence.json"
          evidence_path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(
                  f"\n### {artifact_name}\n"
                  f"- Runner: {evidence['runner_os']} / {evidence['runner_arch']} "
                  f"({evidence['machine']})\n"
                  f"- Python: `{evidence['python_version'].split()[0]}` "
                  f"(`{evidence['python_executable']}`)\n"
                  f"- Wheel: `{evidence['wheel_file']}`\n"
                  f"- Compatible tags: `{', '.join(evidence['compatible_tags'])}`\n"
              )
          PY

      - name: Smoke-test wheel import
        shell: bash
        run: |
          shopt -s nullglob
          WHEELS=(dist/${{ runner.os }}/${{ runner.arch }}/py${{ matrix.python-version }}/*.whl)
          if (( ${#WHEELS[@]} != 1 )); then
            printf 'Expected exactly one wheel, found %s\n' "${#WHEELS[@]}" >&2
            exit 1
          fi
          WHEEL="${WHEELS[0]}"
          pip install "$WHEEL"
          python -c "import ai_backend; print('ai_backend import OK:', dir(ai_backend))"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}
          path: dist/${{ runner.os }}/${{ runner.arch }}/py${{ matrix.python-version }}/*
          retention-days: 14

  linux-wheel-qualify:
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: Linux wheel qualify (Python ${{ matrix.python-version }})
    needs: build-wheels
    runs-on: d-sorg-fleet
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download wheel artifact
        uses: actions/download-artifact@v7
        with:
          name: wheel-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}
          path: wheel-only

      - name: Anchor Python floor to ai_backend crate
        working-directory: rust_core/ai_backend
        run: python -c "print('Qualifying ai_backend wheel for', __import__('sys').version)"

      - name: Clean-install wheel in fresh venv (oracle 2)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          WHEELS=(wheel-only/*.whl)
          if (( ${#WHEELS[@]} != 1 )); then
            printf 'Expected exactly one wheel artifact, found %s\n' "${#WHEELS[@]}" >&2
            exit 1
          fi
          VENV="${{ runner.temp }}/ai-backend-clean-venv"
          python -m venv "$VENV"
          # shellcheck source=/dev/null
          source "$VENV/bin/activate"
          python -m pip install --upgrade pip
          pip install --no-index --find-links wheel-only "${WHEELS[0]}"
          python - <<'PY'
          import ai_backend

          required = {"AIConfig", "AIEngine", "MemoryManager", "RagPipeline"}
          missing = required - set(dir(ai_backend))
          assert not missing, f"ai_backend missing exports: {missing}"
          print("clean-install import OK:", sorted(required))
          PY

      - name: Rust-path smoke (oracle 5)
        shell: bash
        env:
          AI_BACKEND_WHEEL_REQUIRED: "1"
          PYTHONPATH: .:src
        run: |
          set -euo pipefail
          VENV="${{ runner.temp }}/ai-backend-clean-venv"
          # shellcheck source=/dev/null
          source "$VENV/bin/activate"
          python - <<'PY'
          import importlib

          import ai_backend
          from src.shared.python.ai.adapters.rust_adapter import (
              RustAgentAdapter,
              ai_backend_available,
          )

          required = {"AIConfig", "AIEngine", "MemoryManager", "RagPipeline"}
          missing = required - set(dir(ai_backend))
          assert not missing, f"ai_backend missing exports: {missing}"
          assert ai_backend_available() is True
          assert RustAgentAdapter.is_available() is True
          adapter = RustAgentAdapter.try_create(
              api_key="smoke-key",
              base_url="https://api.example.com/v1",
              model="gpt-4",
          )
          assert isinstance(adapter, RustAgentAdapter)
          ok, message = adapter.validate_connection()
          assert ok is True
          assert "Rust backend" in message
          print("Rust-path smoke OK")
          PY

      - name: Set up Python 3.13 for mismatch probe
        if: matrix.python-version == '3.12'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reject cp312 wheel on Python 3.13 (oracle 7)
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          WHEELS=(wheel-only/*.whl)
          WHEEL="${WHEELS[0]}"
          if python3.13 -m pip install --no-deps "$WHEEL"; then
            echo "cp312 wheel installed on Python 3.13 — ABI tags are not enforced" >&2
            exit 1
          fi
          echo "Interpreter mismatch correctly rejected for ${WHEEL}"

  # ── Consumption gate: build + install the wheel and exercise the adapter ────
  # Without this, the wheel was only uploaded as an artifact and never installed,
  # so the RustAgentAdapter Rust path was never actually run in CI (issue #3521).
  adapter-rust-path:
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: ai_backend adapter Rust-path gate
    runs-on: d-sorg-fleet
    timeout-minutes: 30
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: "268435456"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Isolate Rust homes
        uses: ./.github/actions/isolate-rust-homes
      - name: Bootstrap rustup without editing shell profiles
        if: runner.os != 'Windows'
        uses: ./.github/actions/bootstrap-rustup-no-modify-path
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Install build + test deps
        run: python -m pip install --upgrade pip maturin pytest

      # Build with the `python` feature ONLY — local-embeddings needs a system
      # ONNX runtime (ORT_DYLIB_PATH) and is intentionally excluded here.
      - name: Build ai_backend wheel (python feature only)
        working-directory: rust_core/ai_backend
        run: maturin build --release --features python,extension-module --out ../../dist/adapter-gate

      - name: Install the built wheel
        shell: bash
        run: python -m pip install dist/adapter-gate/*.whl

      - name: Assert ai_backend imports (hard fail — no silent skip)
        run: |
          python - <<'PY'
          import ai_backend
          required = {"AIConfig", "AIEngine", "MemoryManager", "RagPipeline"}
          missing = required - set(dir(ai_backend))
          assert not missing, f"ai_backend missing exports: {missing}"
          print("ai_backend import OK:", sorted(required))
          PY

      - name: Exercise the RustAgentAdapter Rust path (wheel-installed smoke gate)
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/shared/python/ai/test_rust_adapter_wheel_smoke.py \
            -o addopts="" -p no:cacheprovider -v

  # ── Optional: build with local-embeddings feature (Linux only, heavy) ────────
  build-local-embeddings:
    name: Build wheel with local-embeddings (Linux)
    runs-on: d-sorg-fleet
    timeout-minutes: 45
    env:
      RUSTUP_HOME: ${{ github.workspace }}/.rustup-home
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: "268435456"
    # Only on workflow_dispatch to keep PR feedback fast
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'workflow_dispatch')

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Isolate Rust homes
        uses: ./.github/actions/isolate-rust-homes
      - name: Bootstrap rustup without editing shell profiles
        if: runner.os != 'Windows'
        uses: ./.github/actions/bootstrap-rustup-no-modify-path
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Install maturin
        run: pip install maturin

      - name: Install ONNX Runtime (sets ORT_DYLIB_PATH)
        run: |
          pip install onnxruntime
          ORT_LIB=$(python -c "import onnxruntime, pathlib; print(next(pathlib.Path(onnxruntime.__file__).parent.rglob('libonnxruntime*.so*'), ''))")
          echo "ORT_DYLIB_PATH=$ORT_LIB" >> "$GITHUB_ENV"
          echo "Located onnxruntime shared library: $ORT_LIB"

      - name: Build wheel (local-embeddings)
        working-directory: rust_core/ai_backend
        run: |
          maturin build \
            --release \
            --features "python,extension-module,local-embeddings" \
            --out ../../dist/local-embeddings/py${{ matrix.python-version }}

      - name: Upload wheel artifact (local-embeddings)
        uses: actions/upload-artifact@v7
        with:
          name: wheel-local-embeddings-ubuntu-py${{ matrix.python-version }}
          path: dist/local-embeddings/py${{ matrix.python-version }}/*.whl
          retention-days: 14

  # ── Summary ───────────────────────────────────────────────────────────────────
  summary:
    timeout-minutes: 60
    name: Wheel build summary
    needs: [build-wheels, linux-wheel-qualify]
    runs-on: d-sorg-fleet
    # Fork PRs never run on the self-hosted fleet (#4464).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (always())
    steps:
      - name: Report results
        run: |
          {
            echo "## Maturin ai_backend Wheel Build"
            echo ""
            echo "| Platform | Status |"
            echo "|----------|--------|"
            echo "| Native Linux Python matrix | ${{ needs.build-wheels.result }} |"
            echo "| Linux wheel qualification (clean install / smoke) | ${{ needs.linux-wheel-qualify.result }} |"
            echo ""
            echo "Python versions: 3.10, 3.11, 3.12, 3.13"
            echo "See each build-wheels matrix job summary for observed runner OS, architecture, interpreter, wheel tags, and artifact identity."
          } >> "$GITHUB_STEP_SUMMARY"
