# =============================================================================
# Tauri Desktop Application Build Workflow
# =============================================================================
# Builds Tools desktop apps (Function Generator, Data Processor, Rotation Converter) using Tauri 2
# Runs on: Pull requests (check only), Releases (build artifacts)
#
# Projects:
# - src/function_generator/web/src-tauri
# - src/data_processing/data_processor/web/src-tauri
# - src/rotation_converter/web/src-tauri
# =============================================================================

name: Tauri Build

on:
  push:
    branches: [main]
    paths:
      - "src/function_generator/web/**"
      - "src/data_processing/data_processor/web/**"
      - "src/rotation_converter/web/**"
      - ".github/workflows/tauri-build.yml"
      - "src-tauri/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
  pull_request:
    paths:
      - "src/function_generator/web/**"
      - "src/data_processing/data_processor/web/**"
      - "src/rotation_converter/web/**"
      - ".github/workflows/tauri-build.yml"
      - "src-tauri/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet-fast-io" >> "$GITHUB_OUTPUT"
              echo "Routing to fast-I/O self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet-fast-io")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet-fast-io" >> "$GITHUB_OUTPUT"
                echo "$AVAILABLE idle fast-I/O fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  # ===========================================================================
  # Check - Fast validation on PRs
  # ===========================================================================
  check:
    needs: pick-runner
    name: Check (${{ matrix.app }})
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - app: function-generator
            path: src/function_generator/web
          - app: data-processor
            path: src/data_processing/data_processor/web
          - app: rotation-converter
            path: src/rotation_converter/web
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      NPM_CONFIG_CACHE: .npm-cache
      RUST_MIN_STACK: "536870912"
      RUSTFLAGS: "-Cdebuginfo=0"
    steps:
      - uses: actions/checkout@v7

      - name: Use local Node.js 24 toolcache
        shell: bash
        run: |
          node_dir=""
          select_node_dir() {
            for candidate in "$@"; do
              if [ -x "$candidate/node" ] && [ -x "$candidate/npm" ]; then
                if "$candidate/node" --version >/dev/null 2>&1 && PATH="$candidate:$PATH" "$candidate/npm" --version >/dev/null 2>&1; then
                  node_dir="$candidate"
                  return 0
                fi
                echo "::warning::Skipping broken Node.js toolcache at $candidate"
              fi
            done
            return 1
          }
          if [ -n "${RUNNER_TEMP:-}" ]; then
            runner_root="$(dirname "$(dirname "$RUNNER_TEMP")")"
            select_node_dir \
              "$runner_root"/externals/node24/bin \
              "$runner_root"/externals/node20/bin || true
          fi
          select_node_dir \
            /opt/hostedtoolcache/node/24*/x64/bin \
            /opt/hostedtoolcache/node/22*/x64/bin \
            /opt/hostedtoolcache/node/20*/x64/bin || true
          if [ -z "$node_dir" ]; then
            path_node="$(command -v node || true)"
            path_npm="$(command -v npm || true)"
            if [ -n "$path_node" ] && [ -n "$path_npm" ]; then
              select_node_dir "$(dirname "$path_node")" "$(dirname "$path_npm")" || true
            fi
          fi
          if [ -z "$node_dir" ] || [ ! -x "$node_dir/node" ]; then
            echo "::error::Expected working local Node.js 20+ under runner externals, /opt/hostedtoolcache/node, or PATH"
            exit 1
          fi
          echo "$node_dir" >> "$GITHUB_PATH"
          "$node_dir/node" --version
          PATH="$node_dir:$PATH" "$node_dir/npm" --version

      - name: Expose preinstalled Rustup
        shell: bash
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Use isolated Rust homes
        shell: bash
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo/bin"
          echo "$RUNNER_TEMP/cargo/bin" >> "$GITHUB_PATH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      # Cache cargo registry/git only. Restored target/ fingerprints can point
      # at missing dep-info files on self-hosted runners after interrupted jobs.
      - name: Cache Rust dependencies (check)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ${{ matrix.path }}/src-tauri -> target
          key: ${{ matrix.app }}-check
          cache-targets: false

      - name: Install Linux dependencies
        run: |
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock
          sudo apt-get -o DPkg::Lock::Timeout=300 update || true
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock
          sudo apt-get -o DPkg::Lock::Timeout=300 update --fix-missing || true
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci --prefer-online

      - name: TypeScript check
        working-directory: ${{ matrix.path }}
        run: npm run type-check || echo "No type-check script, skipping"

      - name: Rust format check
        working-directory: ${{ matrix.path }}/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: ${{ matrix.path }}/src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo check
        working-directory: ${{ matrix.path }}/src-tauri
        run: cargo check

  # ===========================================================================
  # Build - Full build on main/release
  # ===========================================================================
  build:
    name: Build ${{ matrix.app.name }} (${{ matrix.platform.label }})
    needs: check
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app:
          - name: function-generator
            path: src/function_generator/web
          - name: data-processor
            path: src/data_processing/data_processor/web
          - name: rotation-converter
            path: src/rotation_converter/web
        platform:
          - label: linux-x64
            runs_on: d-sorg-fleet-fast-io
            target: x86_64-unknown-linux-gnu
          - label: windows-x64
            runs_on: [self-hosted, Windows]
            target: x86_64-pc-windows-msvc
          # macOS leg removed: org has no `[self-hosted, macOS]` runners. Jobs
          # with this label queued indefinitely. Re-add when macOS runner
          # capacity is provisioned and macOS becomes an active deliverable.

    runs-on: ${{ matrix.platform.runs_on }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      NPM_CONFIG_CACHE: .npm-cache
      RUST_MIN_STACK: "536870912"
      RUSTFLAGS: "-Cdebuginfo=0"
    steps:
      - uses: actions/checkout@v7

      - name: Use local Node.js 24 toolcache (Linux)
        if: matrix.platform.label == 'linux-x64'
        shell: bash
        run: |
          node_dir=""
          select_node_dir() {
            for candidate in "$@"; do
              if [ -x "$candidate/node" ] && [ -x "$candidate/npm" ]; then
                if "$candidate/node" --version >/dev/null 2>&1 && PATH="$candidate:$PATH" "$candidate/npm" --version >/dev/null 2>&1; then
                  node_dir="$candidate"
                  return 0
                fi
                echo "::warning::Skipping broken Node.js toolcache at $candidate"
              fi
            done
            return 1
          }
          if [ -n "${RUNNER_TEMP:-}" ]; then
            runner_root="$(dirname "$(dirname "$RUNNER_TEMP")")"
            select_node_dir \
              "$runner_root"/externals/node24/bin \
              "$runner_root"/externals/node20/bin || true
          fi
          select_node_dir \
            /opt/hostedtoolcache/node/24*/x64/bin \
            /opt/hostedtoolcache/node/22*/x64/bin \
            /opt/hostedtoolcache/node/20*/x64/bin || true
          if [ -z "$node_dir" ]; then
            path_node="$(command -v node || true)"
            path_npm="$(command -v npm || true)"
            if [ -n "$path_node" ] && [ -n "$path_npm" ]; then
              select_node_dir "$(dirname "$path_node")" "$(dirname "$path_npm")" || true
            fi
          fi
          if [ -z "$node_dir" ] || [ ! -x "$node_dir/node" ]; then
            echo "::error::Expected working local Node.js 20+ under runner externals, /opt/hostedtoolcache/node, or PATH"
            exit 1
          fi
          echo "$node_dir" >> "$GITHUB_PATH"
          "$node_dir/node" --version
          PATH="$node_dir:$PATH" "$node_dir/npm" --version

      - name: Setup Node.js (Windows)
        if: matrix.platform.label == 'windows-x64'
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Expose preinstalled Rustup (Linux)
        if: matrix.platform.label == 'linux-x64'
        shell: bash
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Expose preinstalled Rustup (Windows)
        if: matrix.platform.label == 'windows-x64'
        shell: pwsh
        run: |
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (Test-Path -LiteralPath $cargoBin) {
            Add-Content -Path $env:GITHUB_PATH -Value $cargoBin
          }

      - name: Use isolated Rust homes (Linux)
        if: matrix.platform.label == 'linux-x64'
        shell: bash
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/rustup" "$RUNNER_TEMP/cargo/bin"
          echo "$RUNNER_TEMP/cargo/bin" >> "$GITHUB_PATH"

      - name: Use isolated Rust homes (Windows)
        if: matrix.platform.label == 'windows-x64'
        shell: pwsh
        run: |
          $rustupHome = Join-Path $env:RUNNER_TEMP "rustup"
          $cargoHome = Join-Path $env:RUNNER_TEMP "cargo"
          $cargoBin = Join-Path $cargoHome "bin"
          New-Item -ItemType Directory -Force -Path $rustupHome, $cargoBin | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "RUSTUP_HOME=$rustupHome"
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_HOME=$cargoHome"
          Add-Content -Path $env:GITHUB_PATH -Value $cargoBin

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.platform.target }}

      # Cache cargo registry/git only. Build target/ caches are large and can
      # become inconsistent across interrupted self-hosted runner jobs.
      - name: Cache Rust dependencies (build)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ${{ matrix.app.path }}/src-tauri -> target
          key: ${{ matrix.app.name }}-${{ matrix.platform.target }}-release
          cache-targets: false

      - name: Install Linux dependencies
        if: matrix.platform.label == 'linux-x64'
        run: |
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock
          sudo apt-get -o DPkg::Lock::Timeout=300 update || true
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done
          sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock
          sudo apt-get -o DPkg::Lock::Timeout=300 update --fix-missing || true
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci --prefer-online

      - name: Build frontend
        working-directory: ${{ matrix.app.path }}
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        with:
          projectPath: ${{ matrix.app.path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app.name }}-${{ matrix.platform.label }}
          path: |
            ${{ matrix.app.path }}/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
