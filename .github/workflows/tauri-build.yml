# =============================================================================
# Tauri Desktop Application Build Workflow
# =============================================================================
# Builds Tools desktop apps (Function Generator, Data Processor, Rotation Converter) using Tauri 2
# Runs on: Pull requests (check only), Releases (build artifacts)
#
# Projects:
# - src/function_generator/web/src-tauri
# - src/data_processing/data_processor/web/src-tauri
# - src/rotation_converter/web/src-tauri
# =============================================================================

name: Tauri Build

on:
  push:
    branches: [main]
    paths:
      - "src/function_generator/web/**"
      - "src/data_processing/data_processor/web/**"
      - "src/rotation_converter/web/**"
      - ".github/workflows/tauri-build.yml"
      - "src-tauri/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
  pull_request:
    paths:
      - "src/function_generator/web/**"
      - "src/data_processing/data_processor/web/**"
      - "src/rotation_converter/web/**"
      - ".github/workflows/tauri-build.yml"
      - "src-tauri/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.LOCAL_RUNNER_MODE }}
        shell: bash
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  # ===========================================================================
  # Check - Fast validation on PRs
  # ===========================================================================
  check:
    needs: pick-runner
    name: Check (${{ matrix.app }})
    runs-on: d-sorg-fleet
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - app: function-generator
            path: src/function_generator/web
          - app: data-processor
            path: src/data_processing/data_processor/web
          - app: rotation-converter
            path: src/rotation_converter/web
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "134217728"
      RUSTFLAGS: "-Cdebuginfo=0"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Expose preinstalled Rustup
        shell: bash
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      # Cache cargo registry/git + matrix-app target/ dir. Per-app workspace
      # key prevents cross-contamination between the three Tauri sub-apps.
      - name: Cache Rust target (check)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ matrix.path }}/src-tauri -> target
          key: ${{ matrix.app }}-check

      - name: Install Linux dependencies
        run: |
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done; sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock && sudo apt-get -o DPkg::Lock::Timeout=300 update || true
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done; while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done; sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock && sudo apt-get -o DPkg::Lock::Timeout=300 update --fix-missing || true; sudo apt-get -o DPkg::Lock::Timeout=300 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: TypeScript check
        working-directory: ${{ matrix.path }}
        run: npm run type-check || echo "No type-check script, skipping"

      - name: Rust format check
        working-directory: ${{ matrix.path }}/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: ${{ matrix.path }}/src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo check
        working-directory: ${{ matrix.path }}/src-tauri
        run: cargo check

  # ===========================================================================
  # Build - Full build on main/release
  # ===========================================================================
  build:
    name: Build ${{ matrix.app.name }} (${{ matrix.platform.os }})
    needs: check
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app:
          - name: function-generator
            path: src/function_generator/web
          - name: data-processor
            path: src/data_processing/data_processor/web
          - name: rotation-converter
            path: src/rotation_converter/web
        platform:
          - os: d-sorg-fleet
            target: x86_64-unknown-linux-gnu
          - os: [self-hosted, Windows]
            target: x86_64-pc-windows-msvc
          # macOS leg removed: org has no `[self-hosted, macOS]` runners. Jobs
          # with this label queued indefinitely. Re-add when macOS runner
          # capacity is provisioned and macOS becomes an active deliverable.

    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      RUST_MIN_STACK: "134217728"
      RUSTFLAGS: "-Cdebuginfo=0"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Expose preinstalled Rustup
        shell: bash
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.platform.target }}

      # Per-(app, target) Rust cache. Tauri release builds compile ~400 crates;
      # warm cache typically reduces build time by 60-70%.
      - name: Cache Rust target (build)
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ${{ matrix.app.path }}/src-tauri -> target
          key: ${{ matrix.app.name }}-${{ matrix.platform.target }}-release

      - name: Install Linux dependencies
        if: matrix.platform.os == 'd-sorg-fleet'
        run: |
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done; sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock && sudo apt-get -o DPkg::Lock::Timeout=300 update || true
          while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done; while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done; sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock && sudo apt-get -o DPkg::Lock::Timeout=300 update --fix-missing || true; sudo apt-get -o DPkg::Lock::Timeout=300 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ matrix.app.path }}
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        with:
          projectPath: ${{ matrix.app.path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app.name }}-${{ matrix.platform.os }}
          path: |
            ${{ matrix.app.path }}/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
