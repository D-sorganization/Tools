# =============================================================================
# Tauri Desktop Application Build Workflow
# =============================================================================
# Builds Tools desktop apps (Function Generator, Data Processor, Rotation Converter) using Tauri 2
# Runs on: Pull requests (check only), Releases (build artifacts)
#
# Projects:
# - src/function_generator/web/src-tauri
# - src/data_processing/data_processor/web/src-tauri
# - src/rotation_converter/web/src-tauri
# =============================================================================

name: Tauri Build

on:
  push:
    branches: [main]
    paths:
      - "src/function_generator/web/**"
      - "src/data_processing/data_processor/web/**"
      - "src/rotation_converter/web/**"
      - ".github/workflows/tauri-build.yml"
  pull_request:
    paths:
      - "src/function_generator/web/**"
      - "src/data_processing/data_processor/web/**"
      - "src/rotation_converter/web/**"
      - ".github/workflows/tauri-build.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Check - Fast validation on PRs
  # ===========================================================================
  check:
    name: Check (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: function-generator
            path: src/function_generator/web
          - app: data-processor
            path: src/data_processing/data_processor/web
          - app: rotation-converter
            path: src/rotation_converter/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: TypeScript check
        working-directory: ${{ matrix.path }}
        run: npm run type-check || echo "No type-check script, skipping"

      - name: Rust format check
        working-directory: ${{ matrix.path }}/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: ${{ matrix.path }}/src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo check
        working-directory: ${{ matrix.path }}/src-tauri
        run: cargo check

  # ===========================================================================
  # Build - Full build on main/release
  # ===========================================================================
  build:
    name: Build ${{ matrix.app.name }} (${{ matrix.platform.os }})
    needs: check
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: function-generator
            path: src/function_generator/web
          - name: data-processor
            path: src/data_processing/data_processor/web
          - name: rotation-converter
            path: src/rotation_converter/web
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ${{ matrix.app.path }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ matrix.app.path }}
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ${{ matrix.app.path }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.name }}-${{ matrix.platform.os }}
          path: |
            ${{ matrix.app.path }}/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
