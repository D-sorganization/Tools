name: Jules Completist (Incomplete Implementation Auditor)

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ BLAST RADIUS DOCUMENTATION — Jules Completist                              │
# │                                                                             │
# │ WHAT THIS WORKFLOW CAN DO:                                                  │
# │  • Scan for TODO/FIXME, stub functions, and incomplete implementations     │
# │  • Create GitHub issues for each incomplete item found                     │
# │  • Optionally push completion commits to a jules/completist-* branch       │
# │                                                                             │
# │ WHAT THIS WORKFLOW CANNOT DO:                                               │
# │  • Push directly to main or any protected branch                           │
# │  • Auto-merge any PR — human review required                               │
# │  • Delete branches or trigger other workflows                              │
# │                                                                             │
# │ APPROVAL GATES:                                                             │
# │  • Scheduled (0 8 * * 0,4) or dispatched via Control Tower                │
# │  • Issues are created for review before any code changes are merged        │
# └─────────────────────────────────────────────────────────────────────────────┘

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 0,4" # Daily at 4 AM UTC

# Least-privilege top level: no write access by default.
permissions:
  contents: read

jobs:
  audit:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    # Grant write only at this job level.
    permissions:
      contents: write # push completist fixes to jules/completist-* branch
      pull-requests: write # open PR for completist fixes
      issues: write # create tracking issues for incomplete items
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install
        run: npm install -g @google/jules

      - name: Scan
        run: |
          mkdir -p .jules/completist_data
          grep -rn "TODO\|FIXME\|XXX" --include="*.py" --include="*.md" . \
            --exclude-dir=".git" > .jules/completist_data/todo_markers.txt 2>/dev/null || true

      - name: Collect verification-failed issue numbers (skip-list)
        # Build a list of closed issue numbers that are linked to PRs flagged
        # jules-verification-failed. The Completist must NOT recreate / reopen
        # these issues — doing so produces the close-and-reopen notification spam
        # loop the user explicitly asked us to break.
        id: skip_list
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          set -euo pipefail
          SKIP_LIST=""
          PRS=$(gh pr list --state all --label jules-verification-failed \
            --json number,title,body --limit 200 2>/dev/null || echo "[]")
          while IFS= read -r pr_json; do
            [ -z "$pr_json" ] && continue
            BODY=$(echo "$pr_json" | jq -r '.body // ""')
            TITLE=$(echo "$pr_json" | jq -r '.title // ""')
            ISSUES=$(printf '%s\n%s\n' "$TITLE" "$BODY" \
              | grep -oiE '(fixes|closes|resolves)[[:space:]]*#[0-9]+' \
              | grep -oE '[0-9]+' || true)
            for issue_num in $ISSUES; do
              SKIP_LIST="$SKIP_LIST $issue_num"
            done
          done < <(echo "$PRS" | jq -c '.[]')
          SKIP_LIST=$(echo "$SKIP_LIST" | tr ' ' '\n' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "skip_list=$SKIP_LIST" >> "$GITHUB_OUTPUT"
          echo "Completist will skip these issues: ${SKIP_LIST:-<none>}"
          mkdir -p .jules/completist_data
          echo "$SKIP_LIST" > .jules/completist_data/skip_list.txt

      - name: Analyze
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          # Authentication handled via API Key
          set -e
          REPO="${{ github.repository }}"
          API_BASE="https://jules.googleapis.com/v1alpha"

          if [ -z "$JULES_API_KEY" ]; then
          echo "::warning::JULES_API_KEY not configured. Skipping."
          exit 0
          fi

          # Lookup source
          SOURCES=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/sources" || echo '{"sources":[]}')
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)
          SOURCE_ID=$(echo "$SOURCES" | jq -r ".sources[] | select(.githubRepo.owner == \"$OWNER\" and .githubRepo.repo == \"$REPO_NAME\") | .name" | head -1)

          if [ -z "$SOURCE_ID" ] || [ "$SOURCE_ID" = "null" ]; then
          echo "::warning::Repo not found in Jules sources: $REPO"
          exit 0
          fi

          SKIP_LIST="${{ steps.skip_list.outputs.skip_list }}"
          PROMPT="Audit .jules/completist_data/ for incomplete work. Create docs/assessments/completist/ report. DO NOT modify code. DO NOT recreate or reopen any of these issue numbers (they are flagged jules-verification-failed and must remain in their current state for human investigation): ${SKIP_LIST:-<none>}. If you find work matching one of these skipped issues, post a single summary comment on the linked PR instead of reopening the issue."

          echo "Creating Jules session..."
          REQUEST_JSON=$(jq -n \
          --arg prompt "$PROMPT" \
          --arg source "$SOURCE_ID" \
          '{
          prompt: $prompt,
          sourceContext: {
          source: $source,
          githubRepoContext: {
          startingBranch: "main"
          }
          },
          automationMode: "AUTO_CREATE_PR"
          }')

          echo "Request: $REQUEST_JSON"

          HTTP_CODE=$(curl -s -o /tmp/session_response.json -w "%{http_code}" -X POST \
          -H "X-Goog-Api-Key: $JULES_API_KEY" \
          -H "Content-Type: application/json" \
          -d "$REQUEST_JSON" \
          "$API_BASE/sessions")

          SESSION_RESPONSE=$(cat /tmp/session_response.json)
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
          echo "::error::API Failure: $SESSION_RESPONSE"
          exit 1
          fi

          SESSION_ID=$(echo "$SESSION_RESPONSE" | jq -r '.name')
          echo "Created session: $SESSION_ID"

          MAX_WAIT=1800
          POLL_INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
          SESSION_STATUS=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/$SESSION_ID")
          STATE=$(echo "$SESSION_STATUS" | jq -r '.state')
          echo "Session state: $STATE (elapsed: ${ELAPSED}s)"

          case "$STATE" in
          "COMPLETED"|"SUBMITTED")
          echo "Session completed!"
          break
          ;;
          "FAILED"|"CANCELLED")
          echo "::error::Session $STATE"
          exit 1
          ;;
          esac
          sleep $POLL_INTERVAL
          ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs(completist): audit"
          file_pattern: "docs/assessments/completist/*.md"
