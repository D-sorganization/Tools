name: Workflow Lint

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/**"
      - "scripts/actionlint_shellcheck.sh"
      - "scripts/validate_workflows.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/actionlint_shellcheck.sh"
      - "scripts/validate_workflows.py"
  workflow_dispatch:

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using GitHub-hosted"
          fi
  lint-workflows:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install workflow validation dependencies
        run: |
          pip install --upgrade pip
          pip install PyYAML

      - name: Validate workflow YAML structure
        run: python3 scripts/validate_workflows.py

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.11
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run actionlint
        run: actionlint -color -shellcheck ./scripts/actionlint_shellcheck.sh -pyflakes=
