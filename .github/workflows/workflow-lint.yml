name: Workflow Lint

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/**"
      - "scripts/actionlint_shellcheck.sh"
      - "scripts/validate_workflows.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/actionlint_shellcheck.sh"
      - "scripts/validate_workflows.py"
  workflow_dispatch:

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.LOCAL_RUNNER_MODE }}
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  lint-workflows:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clean up broken editable pth files
        run: |
          python3 -S -c "
          import glob, os
          patterns = [
              '/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth',
              '/home/dieterolson/actions-runners/.shared-tool-cache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth'
          ]
          for pat in patterns:
              for p in glob.glob(pat):
                  print('Found:', p)
                  try:
                      os.remove(p)
                      print('Deleted successfully:', p)
                  except Exception as e:
                      print('Error deleting:', p, e)
          "

      - name: Force-clean stale Python tool cache
        run: |
          for cache_root in /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Checking $cache_root/Python for stale 3.12 installations..."
              for version_dir in "$cache_root/Python"/3.12.*; do
                if [ -d "$version_dir" ]; then
                  for arch_dir in "$version_dir"/*; do
                    if [ -d "$arch_dir" ]; then
                      if [ ! -x "$arch_dir/bin/python" ] && [ ! -x "$arch_dir/bin/python3" ]; then
                        echo "Directory $arch_dir is incomplete or broken. Cleaning..."
                        sudo rm -rf "$arch_dir" || rm -rf "$arch_dir" || true
                      elif ! "$arch_dir/bin/python" -c "import zlib" >/dev/null 2>&1; then
                        echo "Directory $arch_dir is corrupt (zlib import failed). Cleaning..."
                        sudo rm -rf "$arch_dir" || rm -rf "$arch_dir" || true
                      else
                        echo "Directory $arch_dir is healthy."
                      fi
                    fi
                  done
                fi
              done
            fi
          done

      - name: Set up Python
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Install workflow validation dependencies
        run: |
          python -m ensurepip --upgrade
          python -m pip install --ignore-installed --upgrade pip setuptools
          python -m pip install --ignore-installed --no-deps wheel
          python -m pip install --ignore-installed PyYAML

      - name: Validate workflow YAML structure
        run: python3 scripts/validate_workflows.py

      - name: Enforce third-party action SHA pinning
        run: python3 scripts/check_action_pinning.py

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.11
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Install shellcheck
        run: while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done; sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock && sudo apt-get -o DPkg::Lock::Timeout=300 update || true && while sudo fuser /var/lib/dpkg/lock >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || sudo fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done; sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock && sudo apt-get -o DPkg::Lock::Timeout=300 update --fix-missing || true; sudo apt-get -o DPkg::Lock::Timeout=300 install -y shellcheck

      - name: Run actionlint
        run: actionlint -color -shellcheck ./scripts/actionlint_shellcheck.sh -pyflakes=
