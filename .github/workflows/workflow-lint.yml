name: Workflow Lint

on:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/**"
      - "scripts/actionlint_shellcheck.sh"
      - "scripts/validate_workflows.py"
      - "scripts/check_workflow_pinning.py"
      - "scripts/check_blocking_quality_gates.py"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/actionlint_shellcheck.sh"
      - "scripts/validate_workflows.py"
      - "scripts/check_workflow_pinning.py"
      - "scripts/check_blocking_quality_gates.py"
  workflow_dispatch:

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  lint-workflows:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Clean up broken editable pth files
        run: |
          python3 -S -c "
          import glob, os
          patterns = [
              '/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth',
              '/home/dieterolson/actions-runners/.shared-tool-cache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth'
          ]
          for pat in patterns:
              for p in glob.glob(pat):
                  print('Found:', p)
                  try:
                      os.remove(p)
                      print('Deleted successfully:', p)
                  except Exception as e:
                      print('Error deleting:', p, e)
          "

      - name: Force-clean stale Python tool cache
        run: |
          for cache_root in /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Checking $cache_root/Python for stale 3.12 installations..."
              for version_dir in "$cache_root/Python"/3.12.*; do
                if [ -d "$version_dir" ]; then
                  for arch_dir in "$version_dir"/*; do
                    if [ -d "$arch_dir" ]; then
                      if [ ! -x "$arch_dir/bin/python" ] && [ ! -x "$arch_dir/bin/python3" ]; then
                        echo "Directory $arch_dir is incomplete or broken. Cleaning..."
                        sudo rm -rf "$arch_dir" || rm -rf "$arch_dir" || true
                      elif ! "$arch_dir/bin/python" -c "import zlib" >/dev/null 2>&1; then
                        echo "Directory $arch_dir is corrupt (zlib import failed). Cleaning..."
                        sudo rm -rf "$arch_dir" || rm -rf "$arch_dir" || true
                      else
                        echo "Directory $arch_dir is healthy."
                      fi
                    fi
                  done
                fi
              done
            fi
          done

      - name: Set up Python
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Install workflow validation dependencies
        run: |
          python -m ensurepip --upgrade
          python -m pip install --ignore-installed --upgrade pip setuptools
          python -m pip install --ignore-installed --no-deps wheel
          python -m pip install --ignore-installed PyYAML || echo "PyYAML unavailable; validation scripts will use stdlib fallback"

      - name: Validate workflow YAML structure
        run: python3 scripts/validate_workflows.py

      - name: Validate workflow pinning policy
        run: python3 scripts/check_workflow_pinning.py

      - name: Validate blocking quality gates
        run: python3 scripts/check_blocking_quality_gates.py

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.11
          ACTIONLINT_BIN="${RUNNER_TEMP:-/tmp}/actionlint-bin"
          mkdir -p "$ACTIONLINT_BIN"
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | tar -xz -C "$ACTIONLINT_BIN" actionlint
          chmod +x "$ACTIONLINT_BIN/actionlint"
          echo "$ACTIONLINT_BIN" >> "$GITHUB_PATH"

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            SHELLCHECK_VERSION=0.10.0
            curl -sSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJ
            echo "$PWD/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
          fi

      - name: Run actionlint
        run: actionlint -color -shellcheck ./scripts/actionlint_shellcheck.sh -pyflakes=
