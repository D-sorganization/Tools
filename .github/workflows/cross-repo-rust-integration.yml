# Cross-Repo Rust Integration
# Builds tools-core together with all downstream Rust crates to catch
# version conflicts (e.g., PyO3 mismatches) before they reach downstream repos.
#
# Triggered on: push/PR to main that touches Rust files, plus weekly schedule.

name: Cross-Repo Rust Integration

on:
  push:
    branches: [main]
    paths:
      - "rust_core/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - "rust_core/**"
      - "Cargo.toml"
      - "rust-toolchain.toml"

concurrency:
  group: cross-repo-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          FLEET_MODE: ${{ vars.FLEET_RUNNER_MODE }}
        run: |
          MODE="${FLEET_MODE:-hybrid}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            cloud)
              echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
              echo "Routing to GitHub-hosted (mode=cloud)"
              ;;
            hybrid|*)
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "No idle fleet runners - falling back to GitHub-hosted"
              fi
              ;;
          esac
  cross-repo-build:
    needs: pick-runner
    runs-on: self-hosted
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        downstream:
          - repo: D-sorganization/Gasification_Model
            crate: thermo-solver
            sparse: |
              rust_core
              Cargo.toml
          - repo: D-sorganization/Golf_Modeling_Suite
            crate: upstream-physics
            sparse: |
              rust_core
              Cargo.toml

    steps:
      - name: Checkout Tools (tools-core hub)
        uses: actions/checkout@v6

      - name: Checkout ${{ matrix.downstream.repo }}
        id: checkout_downstream
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.downstream.repo }}
          path: _downstream
          sparse-checkout: ${{ matrix.downstream.sparse }}
          token: ${{ secrets.RUNNER_CHECK_TOKEN }}

      - name: Install Rust toolchain
        if: steps.checkout_downstream.outcome == 'success'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Symlink for Cargo path resolution
        if: steps.checkout_downstream.outcome == 'success'
        run: |
          # Downstream Cargo.toml references ../../Tools/rust_core/tools-core
          ln -sfn "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/../Tools"
          # Map repo names to expected paths
          REPO_NAME="${{ matrix.downstream.repo }}"
          REPO_SHORT="${REPO_NAME#*/}"
          ln -sfn "$GITHUB_WORKSPACE/_downstream" "$GITHUB_WORKSPACE/../$REPO_SHORT"

      - name: Cache Cargo
        if: steps.checkout_downstream.outcome == 'success'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            _downstream/target
          key: cross-repo-${{ matrix.downstream.crate }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cross-repo-${{ matrix.downstream.crate }}-

      - name: Build downstream crate
        if: steps.checkout_downstream.outcome == 'success'
        working-directory: _downstream/rust_core
        run: cargo build -p ${{ matrix.downstream.crate }}

      - name: Test downstream crate
        if: steps.checkout_downstream.outcome == 'success'
        working-directory: _downstream/rust_core
        run: cargo test -p ${{ matrix.downstream.crate }}

      - name: Clippy downstream crate
        if: steps.checkout_downstream.outcome == 'success'
        working-directory: _downstream/rust_core
        run: cargo clippy -p ${{ matrix.downstream.crate }} -- -D warnings

      - name: Summary
        if: steps.checkout_downstream.outcome == 'success'
        run: |
          echo "## Cross-Repo Integration: ${{ matrix.downstream.crate }}" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Build: success" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests: pass" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Clippy: clean" >> $GITHUB_STEP_SUMMARY

      - name: Summary (skipped)
        if: steps.checkout_downstream.outcome != 'success'
        run: |
          echo "## Cross-Repo Integration: ${{ matrix.downstream.crate }}" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ Skipped: unable to checkout ${{ matrix.downstream.repo }} with the workflow token" >> $GITHUB_STEP_SUMMARY
