name: CI Standard
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi
          pip install ruff==0.14.10 black==26.1.0 mypy==1.13.0 bandit==1.7.7 pip-audit types-PyYAML types-requests

      - name: Lint (Ruff)
        run: ruff check .

      - name: Normalize Line Endings
        run: |
          # Convert CRLF to LF for consistent Black formatting
          find . -name "*.py" -type f -exec sed -i 's/\r$//' {} \;

      - name: Collect Changed Python Files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- '*.py' > changed_python_files.txt
          elif [ -n "${{ github.event.before }}" ]; then
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- '*.py' > changed_python_files.txt
          else
            git diff --name-only HEAD~1 HEAD -- '*.py' > changed_python_files.txt
          fi
          grep -v '^tests/' changed_python_files.txt > changed_mypy_files.txt || true
          cat changed_python_files.txt

      - name: Format Check (Black)
        run: |
          if [ -s changed_python_files.txt ]; then
            black --check $(cat changed_python_files.txt)
          else
            echo "No changed Python files to format-check."
          fi

      - name: Type Check (Mypy)
        run: |
          if [ -s changed_mypy_files.txt ]; then
            mypy $(cat changed_mypy_files.txt) --ignore-missing-imports --install-types --non-interactive
          else
            echo "No changed source Python files to type-check."
          fi

      # CodeQL is explicitly disabled via codeql-analysis.yml to reduce costs.
      # Security scanning is performed by pip-audit and bandit.
      - name: Security Scan (pip-audit)
        run: pip-audit -r requirements.txt

  tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests (Python ${{ matrix.python-version }})
        # Run tests from testpaths defined in pytest.ini (tests/ directory)
        run: pytest
