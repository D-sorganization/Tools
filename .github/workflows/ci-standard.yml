name: CI Standard
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy bandit pip-audit types-PyYAML types-requests

      - name: Lint (Ruff)
        run: ruff check .

      - name: Normalize Line Endings
        run: |
          # Convert CRLF to LF for consistent Black formatting
          find . -name "*.py" -type f -exec sed -i 's/\r$//' {} \;

      - name: Format Check (Black)
        run: black --check .

      - name: Type Check (Mypy)
        run: mypy . --ignore-missing-imports --install-types --non-interactive || echo "::warning::Type checking has issues"

      - name: Security Scan (pip-audit)
        run: pip-audit -r requirements.txt || echo "::warning::Security scan found issues"

  tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests (Python ${{ matrix.python-version }})
        # Run all tests discovered in the repo
        run: pytest .
