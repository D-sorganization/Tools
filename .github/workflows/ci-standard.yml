name: CI Standard
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2-dev libxi6 libxtst6

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi
          pip install httpx
          pip install ruff==0.14.10 black==26.1.0 mypy==1.13.0 bandit==1.7.7 pip-audit types-PyYAML types-requests

      - name: Collect Changed Python Files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            git diff --diff-filter=ACMRT --name-only "$BASE_SHA" HEAD -- '*.py' > changed_python_files.txt
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --diff-filter=ACMRT --name-only "${{ github.event.before }}" HEAD -- '*.py' > changed_python_files.txt
          else
            git diff --diff-filter=ACMRT --name-only HEAD~1 HEAD -- '*.py' > changed_python_files.txt
          fi
          grep -v '^tests/' changed_python_files.txt > changed_mypy_files.txt || true
          cat changed_python_files.txt

      - name: Lint (Ruff)
        run: |
          if [ -s changed_python_files.txt ]; then
            echo "Linting changed files..."
            xargs -r -d '\n' ruff check < changed_python_files.txt
          else
            echo "No changed files found or not in PR/push context, linting all..."
            ruff check . --exclude "**/*.ipynb"
          fi

      - name: Normalize Line Endings
        run: |
          # Convert CRLF to LF for consistent Black formatting
          find . -name "*.py" -type f -exec sed -i 's/\r$//' {} \;

      - name: Format Check (Black)
        run: |
          if [ -s changed_python_files.txt ]; then
            xargs -r -d '\n' black --check < changed_python_files.txt
          else
            echo "No changed Python files to format-check."
          fi

      - name: Type Check (Mypy)
        run: |
          if [ -s changed_mypy_files.txt ]; then
            export MYPYPATH=src/shared/python:src:src/python/src
            echo "Linting changed files with Mypy..."
            xargs -r -d '\n' mypy --explicit-package-bases --ignore-missing-imports --install-types --non-interactive < changed_mypy_files.txt
          else
            echo "No changed source Python files to type-check."
          fi

      - name: Minimum Test Contract Check
        run: python3 scripts/check_minimum_test_contract.py

      - name: Security Scan (bandit)
        run: |
          if [ -s changed_mypy_files.txt ]; then
            grep '^src/.*\.py$' changed_mypy_files.txt > changed_bandit_files.txt || true
            if [ -s changed_bandit_files.txt ]; then
              xargs -r -d '\n' bandit -ll -ii < changed_bandit_files.txt
            else
              echo "No changed src Python files to security-scan."
            fi
          else
            echo "No changed source Python files to security-scan."
          fi

      - name: Security Scan (pip-audit)
        run: pip-audit -r requirements.txt

      # - name: Secrets Scan (gitleaks)
      #   if: secrets.GITLEAKS_LICENSE != ''
      #   uses: gitleaks/gitleaks-action@v2
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #     GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      #
      # - name: Skip Secrets Scan (missing license)
      #   if: secrets.GITLEAKS_LICENSE == ''
      #   run: echo "::warning::Skipping gitleaks because GITLEAKS_LICENSE is not configured."

      - name: Module Size Budget
        run: python3 scripts/check_module_size_budget.py --max-lines 1500 --include src

  tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi
          pip install httpx

      - name: Collect Changed Test Files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            git diff --name-only "$BASE_SHA" HEAD -- 'tests/test_*.py' 'tests/**/*test.py' 'src/**/tests/test_*.py' 'src/**/tests/**/*test.py' > changed_test_files.txt
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" HEAD -- 'tests/test_*.py' 'tests/**/*test.py' 'src/**/tests/test_*.py' 'src/**/tests/**/*test.py' > changed_test_files.txt
          else
            git diff --name-only HEAD~1 HEAD -- 'tests/test_*.py' 'tests/**/*test.py' 'src/**/tests/test_*.py' 'src/**/tests/**/*test.py' > changed_test_files.txt
          fi
          cat changed_test_files.txt

      - name: Run Tests with Coverage (Python ${{ matrix.python-version }})
        run: |
          SMOKE_TESTS="tests/test_path_helpers.py tests/test_error_handling.py tests/shared/python/notes/test_storage.py"
          if [ -s changed_test_files.txt ]; then
            pytest $(cat changed_test_files.txt) $SMOKE_TESTS --cov=. --cov-report=xml:coverage.xml --cov-fail-under=0
          else
            pytest $SMOKE_TESTS --cov=. --cov-report=xml:coverage.xml --cov-fail-under=0
          fi

      - name: Coverage Policy Gate
        run: python3 scripts/check_coverage_policy.py --coverage-file coverage.xml --policy-file config/coverage_policy.json --baseline-file config/coverage_baseline.json --output-json coverage_trend_${{ matrix.python-version }}.json

      - name: Upload Coverage Trend
        uses: actions/upload-artifact@v4
        with:
          name: coverage-trend-${{ matrix.python-version }}
          path: coverage_trend_${{ matrix.python-version }}.json

      - name: Coverage Summary
        if: always()
        run: |
          echo "## Coverage Report (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "Coverage policy gate enforced via scripts/check_coverage_policy.py (minimum + non-regression)." >> $GITHUB_STEP_SUMMARY
