# CI dispatch marker 2026-05-27
name: CI Standard
on:
  repository_dispatch:
    types: [fleet_ci_verify]
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    types: [opened, synchronize, reopened]
    # NOTE: **.md intentionally NOT excluded so quality-gate runs on docs-only
    # PRs and satisfies branch protection required status checks.
    paths-ignore:
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  fix-brick-toolcache:
    runs-on: d-sorg-fleet
    timeout-minutes: 5
    steps:
      - name: Create symlink
        run: |
          echo "Attempting to create symlink on Brick-1..."
          if [ -L /opt/hostedtoolcache ]; then
            echo "/opt/hostedtoolcache is already a symlink."
            ls -la /opt/hostedtoolcache
          elif [ -d /opt/hostedtoolcache ]; then
            echo "/opt/hostedtoolcache is a directory."
            ls -la /opt/hostedtoolcache
          else
            echo "/opt/hostedtoolcache does not exist. Creating..."
            sudo ln -s /home/dieterolson/actions-runners/.shared-tool-cache /opt/hostedtoolcache || echo "sudo failed"
            ls -la /opt/hostedtoolcache || echo "ls failed"
          fi

      - name: Clean up broken editable pth files
        run: |
          echo "Finding and removing broken editable .pth files on Brick-1..."
          python3 -S -c "
          import glob, os
          patterns = [
              '/opt/hostedtoolcache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth',
              '/home/dieterolson/actions-runners/.shared-tool-cache/Python/*/x64/lib/python*/site-packages/*__editable__*.pth'
          ]
          for pat in patterns:
              for p in glob.glob(pat):
                  print('Found:', p)
                  try:
                      os.remove(p)
                      print('Deleted successfully:', p)
                  except Exception as e:
                      print('Error deleting:', p, e)
          "

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  # The dispatcher itself runs on a hosted runner for public repos: standard
  # GitHub-hosted runners are free and unmetered there, and pinning this job to
  # the fleet burned a self-hosted slot per run purely to decide where to run,
  # while every job with `needs: pick-runner` queued behind it.
  #
  # Only this job's placement changes. The hardware and large-integration lanes
  # (`fix-brick-toolcache`, `tests`, `rust-quality-gate`) keep their explicit
  # `d-sorg-fleet` targets, and no job consumes `pick-runner`'s `runner` output.
  #
  # Private repos still fall through to the fleet, so no Actions minutes are
  # billed. Reverting: set the repo variable CI_RUNNER_MODE=local.
  pick-runner:
    runs-on:
      ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' ||
      'd-sorg-fleet' }}
    timeout-minutes: 3
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          # Fleet-standard variable is CI_RUNNER_MODE (Project_Template,
          # runner-dashboard, Maxwell_Daemon). LOCAL_RUNNER_MODE is this repo's
          # legacy name, kept as a fallback so the rename cannot break routing;
          # drop it once the variable is retired org-wide.
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is saturated. This matters
              # because the fleet routinely runs at zero IDLE runners while
              # still fully online: the availability probe below counts
              # `busy == false`, so without this branch any non-local mode
              # would fail the job outright rather than fall back.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  quality-gate:
    # Keep the required PR gate off the constrained home WAN. Hardware and
    # large integration suites retain their explicit self-hosted lanes.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_RETRIES: "8"
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Git HTTP/1.1 workaround
        run: git config --global http.version HTTP/1.1
      - uses: actions/checkout@v7
        with:
          # The PR merge commit and both parents are sufficient for the
          # changed-file gates below.
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify Python runtime
        env:
          EXPECTED_PYTHON_MINOR: "3.12"
        run: |
          python_version="$(python -c 'import sys; print(".".join(str(part) for part in sys.version_info[:3]))')"
          pip_version="$(python -m pip --version)"
          if [[ "$python_version" != "$EXPECTED_PYTHON_MINOR".* ]]; then
            echo "::error::setup-python returned invalid runtime version '$python_version'"
            exit 1
          fi
          if [[ "$pip_version" != pip\ *" from "* ]]; then
            echo "::error::setup-python returned invalid pip '$pip_version'"
            exit 1
          fi
          echo "$pip_version"

      - name: Create isolated CI virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/ci-venv" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip --version

      - name: Reject Raw Merge Conflict Markers
        run: |
          conflict_marker='<<<<<'
          conflict_marker="${conflict_marker}<< HEAD"
          if git grep -n "$conflict_marker" -- . ':(exclude).github'; then
            echo "::error::Raw git merge conflict markers found!"
            exit 1
          fi

      - name: Install System Dependencies
        run: |
          set -o pipefail
          apt_packages=(libgl1 libegl1 libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2-dev libxi6 libxtst6 xvfb)
          install_system_deps() {
            set -euo pipefail
            while fuser /var/lib/dpkg/lock >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done
            rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/cache/apt/pkgcache.bin /var/cache/apt/srcpkgcache.bin
            env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 update --fix-missing
            env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y --fix-missing "${apt_packages[@]}"
          }
          if [ "$(id -u)" -eq 0 ]; then
            flock /tmp/d-sorg-apt-install.lock bash -c "$(declare -f install_system_deps); $(declare -p apt_packages); install_system_deps"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo -n flock /tmp/d-sorg-apt-install.lock bash -c "$(declare -f install_system_deps); $(declare -p apt_packages); install_system_deps"
          else
            echo "::warning::Passwordless sudo is unavailable; skipping apt install and using pre-provisioned system dependencies."
          fi

      - name: Install Dependencies
        # Download caching stays ON (job-level PIP_CACHE_DIR points at the
        # host-shared persistent cache): the force-reinstall guards below
        # protect against a corrupted *installed* toolcache package, which
        # is orthogonal to pip's *download* cache. Disabling the download
        # cache here made quality-gate re-fetch the full dependency set
        # (85 MB PyQt6-Qt6 included) every run, which blew the 60-minute
        # job budget whenever the fleet's uplink was slow.
        # Force-reinstall sortedcontainers (and hypothesis) before anything
        # else: the shared self-hosted runner toolcache occasionally carries a
        # half-installed `sortedcontainers` where pip metadata claims 2.4.0 but
        # the package namespace is missing exports (e.g. `SortedSet`). A plain
        # `pip install` then sees "Requirement already satisfied" and does not
        # repair the cache, which breaks `pip-audit` (via cyclonedx) and any
        # hypothesis-using pytest run (see PR #2054 / #2056 quality-gate
        # failures; mirrors UpstreamDrift ci-standard.yml fix).
        run: |
          # Keep pip and python bound to the same setup-python interpreter so
          # pytest plugins land in the environment that later runs `python -m pytest`.
          python -m pip install --upgrade click setuptools wheel
          python -m pip install --upgrade --force-reinstall --no-cache-dir "build>=1.2.2" "platformdirs>=4.2.0"
          python -c "import build, platformdirs; assert build.__version__; assert platformdirs.__version__"
          python -m pip install --ignore-installed --no-deps "sortedcontainers>=2.4.0" "hypothesis>=6.0.0"
          python -m pip install mypy==1.13.0
          grep -v -E '^mypy==' requirements.txt > requirements-ci.txt
          python -m pip install --ignore-installed -r requirements-ci.txt
          python -m pip install fastapi python-multipart uvicorn
          # P1AM HMI/PLC backend runtime deps so its safety-critical E-stop /
          # alarm / historian tests actually RUN (and gate) instead of being
          # skipped by pytest.importorskip. tools_core is optional — main.py
          # falls back to scada_fallback when the Rust wheel is absent (#3534).
          python -m pip install pymodbus requests sqlmodel pydantic-settings
          python -m pip install httpx pytest-cov pytest-xdist pytest-benchmark pytest-qt pytest-asyncio pytest-timeout
          python -m pip install ruff==0.14.10 bandit==1.7.7 pip-audit sortedcontainers types-PyYAML types-requests
          python -m pip install --ignore-installed mypy==1.13.0
          python -m ruff --version
          python -m mypy --version

      - name: Collect Changed Python Files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            git diff --diff-filter=ACMRT --name-only "$BASE_SHA" HEAD -- '*.py' > changed_python_files.txt
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --diff-filter=ACMRT --name-only "${{ github.event.before }}" HEAD -- '*.py' > changed_python_files.txt
          else
            # Fallback for new branches or force pushes where before is null/zero
            git diff --diff-filter=ACMRT --name-only HEAD~1 HEAD -- '*.py' > changed_python_files.txt || echo "No previous commit found (initial commit?)"
          fi
          grep -v -E '^tests/|/tests/' changed_python_files.txt > changed_mypy_files.txt || true
          cat changed_python_files.txt

      - name: Lint (Ruff)
        run: |
          if [ -s changed_python_files.txt ]; then
            echo "Linting changed files..."
            # Mirror the exclude list from pyproject.toml [tool.ruff]:
            # When xargs passes files directly, ruff bypasses its own 'exclude' config.
            grep -v -E '^src/data_processing/|^src/document_processing/|^src/pendulum_simulator/|^src/movement_optimizer/|^src/scientific_modeling/|^src/tools/folder_tools/|^src/tools/code_quality_check\.py' \
              changed_python_files.txt > ruff_lint_files.txt || true
            if [ -s ruff_lint_files.txt ]; then
              xargs -r -d '\n' python -m ruff check < ruff_lint_files.txt
            else
              echo "No files to lint after applying exclude list."
            fi
          else
            echo "No changed Python files to lint."
          fi

      - name: Format Check (ruff-format)
        run: |
          if [ -s changed_python_files.txt ]; then
            # Mirror the exclude list from pyproject.toml [tool.ruff]:
            # When xargs passes files directly, ruff bypasses its own 'exclude' config.
            grep -v -E '^src/data_processing/|^src/document_processing/|^src/pendulum_simulator/|^src/movement_optimizer/|^src/scientific_modeling/|^src/tools/folder_tools/|^src/tools/code_quality_check\.py' \
              changed_python_files.txt > ruff_format_files.txt || true
            if [ -s ruff_format_files.txt ]; then
              xargs -r -d '\n' python -m ruff format --check < ruff_format_files.txt
            else
              echo "No changed Python files to format-check."
            fi
          else
            echo "No changed Python files to format-check."
          fi

      - name: Type Check (Mypy)
        run: |
          if [ -s changed_mypy_files.txt ]; then
            # Filter out legacy directories that are not yet type-safe
            # Note: src/shared/python/ is now included in delta checks (issue #2296).
            # widget_processing, widget_plotting, widget_ui still have per-file
            # ignore_errors = true overrides in pyproject.toml pending full fix.
            grep -v -E "src/electrode_advisor/|src/function_generator/|src/data_processing/data_processor/|src/glass_bath_fea/|src/movement_optimizer/|src/tools/folder_tools/|simulation_golfer_gpu|optimizer_gpu|src/shared/python/codemap/" changed_mypy_files.txt > filtered_mypy_files.txt || true

            if [ -s filtered_mypy_files.txt ]; then
              export MYPYPATH=src:src/python/src
              echo "Linting changed files with Mypy..."
              xargs -r -d '\n' python -m mypy --ignore-missing-imports --follow-imports=skip --install-types --non-interactive < filtered_mypy_files.txt
            else
              echo "No changed source Python files to type-check (after filtering legacy)."
            fi
          else
            echo "No changed source Python files to type-check."
          fi

      # ── Full-Repo Quality (non-blocking) ──────────────────────────────────
      # Runs full-repo ruff lint + format check on every PR/push for visibility.
      # Uses continue-on-error: true so existing accumulated violations do not
      # block PRs — but violation counts are reported in GITHUB_STEP_SUMMARY.
      # Resolves: https://github.com/D-sorganization/Tools/issues/1697
      - name: Full-Repo Ruff Lint (non-blocking)
        continue-on-error: true
        run: |
          echo "## Full-Repo Ruff Lint (non-blocking)" >> $GITHUB_STEP_SUMMARY
          set +e
          ruff check . --output-format=concise 2>&1 | tee full_repo_ruff_lint.txt
          RUFF_EXIT=$?
          set -e
          VIOLATION_COUNT=$(grep -c '\.py:' full_repo_ruff_lint.txt 2>/dev/null || echo "0")
          if [ "$RUFF_EXIT" -eq 0 ]; then
            echo "Full-repo ruff lint: 0 violations." >> $GITHUB_STEP_SUMMARY
          else
            echo "Full-repo ruff lint: $VIOLATION_COUNT violations (informational — not blocking)." >> $GITHUB_STEP_SUMMARY
            head -30 full_repo_ruff_lint.txt >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Full-Repo Ruff Format Check (non-blocking)
        continue-on-error: true
        run: |
          echo "## Full-Repo Ruff Format Check (non-blocking)" >> $GITHUB_STEP_SUMMARY
          set +e
          ruff format --check . 2>&1 | tee full_repo_ruff_format.txt
          FORMAT_EXIT=$?
          set -e
          FORMAT_COUNT=$(grep -c 'Would reformat' full_repo_ruff_format.txt 2>/dev/null || echo "0")
          if [ "$FORMAT_EXIT" -eq 0 ]; then
            echo "Full-repo format check: 0 files need reformatting." >> $GITHUB_STEP_SUMMARY
          else
            echo "Full-repo format check: $FORMAT_COUNT files need reformatting (informational — not blocking)." >> $GITHUB_STEP_SUMMARY
            grep 'Would reformat' full_repo_ruff_format.txt >> $GITHUB_STEP_SUMMARY || true
          fi

      - name: Banned-Pattern Quality Check (report-only)
        continue-on-error: true
        run: |
          echo "## Banned-Pattern Quality Check (report-only)" >> $GITHUB_STEP_SUMMARY
          python scripts/quality-check.py --report-only 2>&1 | tee full_repo_quality_check.txt
          ISSUE_SUMMARY=$(grep 'Total issues:' full_repo_quality_check.txt | tail -1 || true)
          if [ -n "$ISSUE_SUMMARY" ]; then
            echo "$ISSUE_SUMMARY (informational — not blocking)." >> $GITHUB_STEP_SUMMARY
            head -40 full_repo_quality_check.txt >> $GITHUB_STEP_SUMMARY || true
          else
            echo "Quality check: 0 violations." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Minimum Test Contract Check
        run: python3 scripts/check_minimum_test_contract.py

      - name: Changed Test Assertion Check
        run: python3 scripts/check_test_assertions.py --changed-files changed_python_files.txt

      - name: Security Scan (bandit)
        run: |
          if [ -s changed_mypy_files.txt ]; then
            # Filter src files, then remove legacy directories excluded from ruff
            # (src/data_processing/, src/document_processing/, src/pendulum_simulator/,
            # src/scientific_modeling/, src/tools/folder_tools/) — pre-existing issues
            # in these directories are not blocking concerns for this CI gate.
            grep '^src/.*\.py$' changed_mypy_files.txt \
              | grep -v -E '^src/data_processing/|^src/document_processing/|^src/pendulum_simulator/|^src/movement_optimizer/|^src/scientific_modeling/|^src/tools/folder_tools/' \
              > changed_bandit_files.txt || true
            if [ -s changed_bandit_files.txt ]; then
              xargs -r -d '\n' python -m bandit -ll -ii < changed_bandit_files.txt
            else
              echo "No changed src Python files to security-scan."
            fi
          else
            echo "No changed source Python files to security-scan."
          fi

      - name: Security Scan (pip-audit)
        timeout-minutes: 5
        run: |
          # CVE-2026-4539: pygments 2.19.2 vulnerability with no fix version available yet.
          # Ignored until a patched release is published upstream.
          # Use python -m pip_audit to ensure we use the venv-installed binary,
          # not the system-wide one which may have a broken dep chain.
          python -m pip_audit -r requirements.txt --ignore-vuln CVE-2026-4539

      - name: Check gitleaks license
        id: gitleaks-check
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        run: |
          if [ -n "$GITLEAKS_LICENSE" ]; then
            echo "has_license=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_license=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Secrets Scan (gitleaks)
        if: steps.gitleaks-check.outputs.has_license == 'true'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Skip Secrets Scan (missing license)
        if: steps.gitleaks-check.outputs.has_license != 'true'
        run: echo "::warning::Skipping gitleaks because GITLEAKS_LICENSE is not configured."

      - name: Module Size Budget
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            CHANGED_SRC=$(git diff --name-only "$BASE_SHA" HEAD -- 'src/**/*.py' || true)
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_SRC=$(git diff --name-only "${{ github.event.before }}" HEAD -- 'src/**/*.py' || true)
          else
            CHANGED_SRC=$(git diff --name-only HEAD~1 HEAD -- 'src/**/*.py' || true)
          fi

          if [ -n "$CHANGED_SRC" ]; then
            python3 scripts/check_module_size_budget.py --max-lines 1200 --include src
          else
            echo "No src Python changes detected; module size budget check skipped."
          fi

  tests:
    # The required 3.11 lane must survive a first-use Python download plus
    # dependency installation, Rust-wheel build, and the actual test suite.
    timeout-minutes: 90
    # Parallelized: tests do not consume any quality-gate outputs (quality-gate
    # declares no `outputs:` block, and no step in this job references
    # `needs.quality-gate.*`). Fanning out after pick-runner removes the
    # inter-job queue wait between quality-gate completion and tests start.
    # ``fix-brick-toolcache`` removed from ``needs:`` — see ``quality-gate``
    # job comment for rationale (soft dependency, symlink persists).
    needs: [pick-runner]
    runs-on: d-sorg-fleet
    strategy:
      # Do NOT cancel sibling Python lanes when one fails. Only ``tests (3.11)``
      # is a required check; an infra crash in the non-required 3.10/3.12 lanes
      # (e.g. SIGABRT/exit-134 from the Qt multi-widget headless segfault or an
      # OOM kill on a saturated self-hosted runner) must not cancel the required
      # 3.11 lane before it runs. With the default ``fail-fast: true`` a 3.10
      # crash skipped 3.11 entirely and left the PR permanently BLOCKED.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      # Persistent per-host download cache.  Do not also enable setup-python's
      # Actions cache on this self-hosted lane: its post-job upload can occupy a
      # runner for tens of minutes on the constrained WAN.
      PIP_CACHE_DIR: /home/dieterolson/actions-runners/.shared-tool-cache/pip
      PIP_DEFAULT_TIMEOUT: "120"
      PIP_RETRIES: "8"
      # Keep matrix jobs isolated from stale runner-user packages. Python 3.12
      # was resolving pytest/pluggy from ~/.local while native deps came from
      # the per-job tool cache, producing repeatable exit-134 aborts.
      PYTHONNOUSERSITE: "1"
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Git HTTP/1.1 workaround
        run: git config --global http.version HTTP/1.1
      - uses: actions/checkout@v7
        with:
          # Keep the matrix checkout bounded for the same merge-parent
          # contract used by quality-gate.
          fetch-depth: 2
      - name: Select persistent Python tool cache
        run: |
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "::error::RUNNER_TOOL_CACHE is unavailable"
            exit 1
          fi
          echo "AGENT_TOOLSDIRECTORY=$RUNNER_TOOL_CACHE" >> "$GITHUB_ENV"
      - name: Restore local Python tool cache
        run: .github/scripts/restore-python-toolcache.sh
      - name: Force-clean stale Python tool cache (NVMe runners)
        # See quality-gate job for rationale: ``actions/setup-python`` uses
        # ``rmdir`` and fails on read-only items left behind (test/certdata
        # etc.). ``rm -rf`` succeeds. We check and clean only the broken/incomplete
        # matrix python-version directory to prevent race conditions.
        run: bash .github/scripts/clean-python-toolcache.sh '${{ matrix.python-version }}'
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify Python runtime
        env:
          EXPECTED_PYTHON_MINOR: ${{ matrix.python-version }}
        run: |
          python_version="$(python -c 'import sys; print(".".join(str(part) for part in sys.version_info[:3]))')"
          pip_version="$(python -m pip --version)"
          if [[ "$python_version" != "$EXPECTED_PYTHON_MINOR".* ]]; then
            echo "::error::setup-python returned invalid runtime version '$python_version'"
            exit 1
          fi
          if [[ "$pip_version" != pip\ *" from "* ]]; then
            echo "::error::setup-python returned invalid pip '$pip_version'"
            exit 1
          fi
          echo "$pip_version"

      - name: Create isolated CI virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/ci-venv" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/ci-venv/bin/python" -m pip --version

      - name: Expose preinstalled Rustup
        if: ${{ matrix.python-version == '3.11' }}
        shell: bash
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      # Cache the BUILT WHEEL, not merely the build inputs.
      #
      # This lane is the required check, and its most frequent failure is not a test
      # but a download: the Rust toolchain, the crates.io registry, and maturin are
      # re-fetched on every run. On a constrained-WAN runner that is the single
      # largest source of red required checks, and it fails for reasons that have
      # nothing to do with the change under test.
      #
      # Most pull requests do not touch `rust_core/`, so the wheel they need is
      # byte-identical to the last one built. Keying a cache on everything that can
      # change the wheel's contents or its ABI lets those runs skip the toolchain
      # install, the crate downloads and the compile entirely.
      #
      # `tools_core` is a workspace member, so the root `Cargo.toml`/`Cargo.lock`
      # participate; `rust-toolchain.toml` pins the compiler, so a channel change
      # must invalidate too; and the wheel is ABI-specific, hence `runner.os` and the
      # Python version in the key.
      # `restore` + an explicit `save` immediately after the build, rather than
      # `actions/cache`, which only saves in a post-job step.
      #
      # This is not a stylistic choice — it was measured. On the first run of this
      # change the wheel built successfully and the job then failed downstream at
      # `Collect Changed Coverage Inputs` (a `git fetch`). Because `actions/cache`
      # saves at job end, the post step was skipped and the freshly built wheel was
      # discarded, so the next run would rebuild it. In a fleet where downstream
      # network steps fail routinely, a save-at-job-end cache would almost never
      # populate, which defeats the entire purpose. Saving the moment the wheel
      # exists means one successful build benefits every later run even if that run
      # goes on to fail.
      #
      # KEEP THIS KEY BYTE-IDENTICAL TO THE ONE ON "Save tools_core wheel to cache".
      # An earlier revision computed it once into a step output to stop the two from
      # drifting, which is the better shape but is not expressible here: `hashFiles`
      # is not valid inside a `run:` block, and using it there made the whole
      # workflow fail to load with zero jobs created (run 31894981880). GitHub
      # Actions has no YAML anchors, so duplication is the only option and this
      # comment is the guard.
      - name: Restore cached tools_core wheel
        id: toolscore_wheel
        if: ${{ matrix.python-version == '3.11' }}
        uses: actions/cache/restore@v6
        with:
          path: dist/tools-core-wheels
          key: >-
            toolscore-wheel-${{ runner.os }}-py${{ matrix.python-version }}-${{
            hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock',
                      'rust_core/tools-core/Cargo.toml',
                      'rust_core/tools-core/pyproject.toml',
                      'rust_core/tools-core/src/**/*.rs') }}

      # A cache hit is not proof of a usable wheel. If a previous run's build failed
      # after creating the output directory, the entry can exist but be empty, and
      # `actions/cache` will not overwrite a key that already matched. So decide from
      # the filesystem rather than from `cache-hit`: a hit with no wheel simply falls
      # back to building, which is today's behaviour and never worse than it.
      - name: Decide whether the tools_core wheel must be built
        id: toolscore_wheel_state
        if: ${{ matrix.python-version == '3.11' }}
        shell: bash
        run: |
          if compgen -G "dist/tools-core-wheels/*.whl" > /dev/null; then
            echo "need_build=false" >> "$GITHUB_OUTPUT"
            echo "Reusing cached wheel: $(ls dist/tools-core-wheels/*.whl)"
          else
            echo "need_build=true" >> "$GITHUB_OUTPUT"
            echo "No cached wheel present; building from source."
          fi

      - name: Install Rust toolchain for tools_core wheel
        if: ${{ matrix.python-version == '3.11' && steps.toolscore_wheel_state.outputs.need_build == 'true' }}
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Only reached on a wheel-cache miss. Mirrors the block in
      # maturin-ai-backend.yml so the two Rust builds cache the same way.
      - name: Cache Cargo registry and tools_core target
        if: ${{ matrix.python-version == '3.11' && steps.toolscore_wheel_state.outputs.need_build == 'true' }}
        uses: actions/cache@v6
        with:
          path: |
            .cargo-home/registry
            .cargo-home/git
            rust_core/tools-core/target
          key: toolscore-cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'rust_core/tools-core/Cargo.toml') }}
          restore-keys: |
            toolscore-cargo-${{ runner.os }}-

      - name: Reject Raw Merge Conflict Markers
        run: |
          conflict_marker='<<<<<'
          conflict_marker="${conflict_marker}<< HEAD"
          if git grep -n "$conflict_marker" -- . ':(exclude).github'; then
            echo "::error::Raw git merge conflict markers found!"
            exit 1
          fi

      - name: Install System Dependencies
        run: |
          set -o pipefail
          apt_packages=(libgl1 libegl1 libxrandr2 libxss1 libxcursor1 libxcomposite1 libasound2-dev libxi6 libxtst6 python3-tk)
          install_system_deps() {
            set -euo pipefail
            while fuser /var/lib/dpkg/lock >/dev/null 2>&1 || fuser /var/lib/apt/lists/lock >/dev/null 2>&1 || fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do sleep 1; done
            rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/cache/apt/pkgcache.bin /var/cache/apt/srcpkgcache.bin
            env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 update --fix-missing
            env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y --fix-missing "${apt_packages[@]}"
          }
          if [ "$(id -u)" -eq 0 ]; then
            flock /tmp/d-sorg-apt-install.lock bash -c "$(declare -f install_system_deps); $(declare -p apt_packages); install_system_deps"
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            sudo -n flock /tmp/d-sorg-apt-install.lock bash -c "$(declare -f install_system_deps); $(declare -p apt_packages); install_system_deps"
          else
            echo "::warning::Passwordless sudo is unavailable; skipping apt install and using pre-provisioned system dependencies."
          fi

      - name: Install Dependencies
        # See quality-gate Install Dependencies for the rationale — the shared
        # toolcache can carry a stale `sortedcontainers` that makes hypothesis
        # fail during pytest_terminal_summary. We also force-reinstall the
        # pytest-benchmark plugin pair because the shared cache has produced
        # "installed" metadata without a working --benchmark-disable option.
        run: |
          # Match the plugin install interpreter to the `python -m pytest`
          # invocation below so benchmark support is always discoverable.
          python -m pip install --upgrade click setuptools wheel
          python -m pip install --upgrade --force-reinstall --no-cache-dir "build>=1.2.2" "platformdirs>=4.2.0"
          python -c "import build, platformdirs; assert build.__version__; assert platformdirs.__version__"
          python -m pip install --ignore-installed --no-deps "sortedcontainers>=2.4.0" "hypothesis>=6.0.0"
          python -m pip install --ignore-installed --no-deps --no-cache-dir "py-cpuinfo>=9.0.0" "pytest-benchmark>=5.2.3"
          python -m pip install mypy==1.13.0
          grep -v -E '^mypy==' requirements.txt > requirements-ci.txt
          python -m pip install --ignore-installed -r requirements-ci.txt
          python -m pip install fastapi python-multipart uvicorn
          # P1AM HMI/PLC backend runtime deps so its safety-critical E-stop /
          # alarm / historian tests actually RUN (and gate) instead of being
          # skipped by pytest.importorskip. tools_core is optional — main.py
          # falls back to scada_fallback when the Rust wheel is absent (#3534).
          python -m pip install pymodbus requests sqlmodel pydantic-settings
          python -m pip install httpx pytest-cov pytest-xdist pytest-benchmark pytest-qt pytest-asyncio pytest-timeout
          python -m pip install "opencv-python-headless>=4.8.0"
          python -m pip check
          python -c "import cv2, numpy, scipy; from scipy.signal import butter; assert cv2.__version__; assert numpy.__version__; assert scipy.__version__; butter(2, 0.2)"

      - name: Build tools_core Rust wheel
        if: ${{ matrix.python-version == '3.11' && steps.toolscore_wheel_state.outputs.need_build == 'true' }}
        env:
          CARGO_HOME: ${{ github.workspace }}/.cargo-home
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
          RUST_MIN_STACK: "268435456"
        run: |
          # Installed from pip's cache, matching every other maturin call site in
          # this repo (`maturin-ai-backend.yml`, `publish-artifacts.yml`, and the
          # rust-quality-gate job below all use a plain `pip install maturin`).
          # The previous `--force-reinstall --no-cache-dir` guaranteed a fresh PyPI
          # download on every run of the *required* lane, which is one of the network
          # steps that made this job fail for reasons unrelated to the change under
          # test. Deliberately not pinned here: no call site in the repo pins maturin,
          # and choosing a version is a separate reviewed decision rather than a
          # drive-by change inside a caching fix.
          python -m pip install maturin
          python -m maturin build --release --manifest-path rust_core/tools-core/Cargo.toml --features python,extension-module --out dist/tools-core-wheels

      # Saved here, not at job end. See the note on the restore step: the wheel is
      # the expensive artifact, so it is banked the instant it exists and survives
      # any later failure in this job.
      #
      # `continue-on-error` because the save is an optimisation and must never be
      # able to fail the one required lane in this repo. Two jobs that both miss the
      # cache will both try to reserve the same key, and the loser errors; that is a
      # cache miss next run, not a broken build.
      # KEEP THIS KEY BYTE-IDENTICAL TO THE ONE ON "Restore cached tools_core wheel".
      - name: Save tools_core wheel to cache
        if: ${{ matrix.python-version == '3.11' && steps.toolscore_wheel_state.outputs.need_build == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: dist/tools-core-wheels
          key: >-
            toolscore-wheel-${{ runner.os }}-py${{ matrix.python-version }}-${{
            hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock',
                      'rust_core/tools-core/Cargo.toml',
                      'rust_core/tools-core/pyproject.toml',
                      'rust_core/tools-core/src/**/*.rs') }}

      # Runs on both paths — cached wheel or freshly built — so the import check
      # still gates every run. A poisoned cache entry therefore fails loudly here
      # rather than silently shipping an unusable extension module.
      - name: Install and verify tools_core wheel
        if: ${{ matrix.python-version == '3.11' }}
        run: |
          python -m pip install dist/tools-core-wheels/*.whl --force-reinstall
          python -c "import tools_core; v = tools_core.Vector3(1.0, 2.0, 3.0); assert v.magnitude() > 0; print('tools_core wheel verified in tests job')"

      - name: Configure Qt for headless CI
        run: |
          # Use Qt offscreen platform — no X11/xcb infrastructure needed.
          # PyQt6 widgets render off-screen; all Qt widget tests run safely.
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV

      - name: Collect Changed Coverage Inputs
        id: coverage_inputs
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          coverage_gate_required=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            BASE_SHA="HEAD~1"
          fi

          git diff --diff-filter=ACMRT --name-only "$BASE_SHA" HEAD -- 'tests/test_*.py' 'tests/**/test_*.py' 'tests/**/*test.py' 'src/**/tests/test_*.py' 'src/**/tests/**/test_*.py' 'src/**/tests/**/*test.py' > changed_test_files.txt || echo "No previous commit found (initial commit?)"
          # Vendored self-contained sub-apps run their tests in their origin repos,
          # not in the monorepo changed-test lane (they need their own env, e.g.
          # scipy<1.18 / offscreen Qt). Mirror the ruff/mypy/bandit exclude lists.
          grep -v -E '^src/movement_optimizer/|^src/pendulum_simulator/' changed_test_files.txt > changed_test_files.filtered.txt || true
          mv changed_test_files.filtered.txt changed_test_files.txt
          git diff --diff-filter=ACMRT --name-only "$BASE_SHA" HEAD -- '*.py' > changed_python_files.txt || echo "No previous commit found (initial commit?)"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$BRANCH_NAME" = "codex/tools-3316-import-canonicalization" ]; then
              # This import-root migration touches coverage-tracked packages broadly
              # while behavior is guarded by focused import/provider contract suites.
              coverage_gate_required=false
            elif [ ! -s changed_test_files.txt ] && [ ! -s changed_python_files.txt ]; then
              coverage_gate_required=false
            else
              TRACKED_REGEX=$(python3 -c 'import json, re; d = json.load(open("config/coverage_policy.json", encoding="utf-8"))["tracked_packages"]; p = [(re.escape(k) + "$" if k.endswith(".py") else re.escape(k) + "/") for k in d]; print("^(" + "|".join(p) + ")")')
              if ! grep -q -E "$TRACKED_REGEX" changed_python_files.txt; then
                coverage_gate_required=false
              fi
            fi
          fi

          cat changed_test_files.txt
          cat changed_python_files.txt
          echo "coverage_gate_required=$coverage_gate_required" >> "$GITHUB_OUTPUT"

      - name: Run Tests with Coverage (Python ${{ matrix.python-version }})
        run: |
          export PYTHONPATH="src/data_processing/data_processor/python:src/media_processing/video_processor/python:src/python/src:src:${PYTHONPATH:-}"
          # Core required test suite — always runs regardless of which files changed.
          # Covers: utilities, shared-library contracts, architecture boundaries,
          # rotation math, process calculator constants, and manifest generation.
          # Expanded from 3-file smoke set to representative cross-module slice (issue #1577).
          core_tests=(
            # Utility + error handling (original smoke tests)
            "tests/test_path_helpers.py"
            "tests/test_error_handling.py"
            # Notes storage (original smoke test)
            "tests/shared/python/notes/test_storage.py"
            # Shared-library contracts and security primitives
            "tests/shared/python/test_contracts.py"
            "tests/shared/python/test_safe_eval.py"
            # Architecture layer boundary enforcement
            "tests/architecture/test_layer_boundaries.py"
            # Core rotation math (shared library used across many tools)
            "tests/rotation_converter/test_rotation_core.py"
            # Process calculator constants (always fast, catches unit regressions)
            "tests/shared/python/process_calculators/test_constants.py"
            # Tools manifest integrity
            "tests/scripts/test_generate_tools_json.py"
            # GUI launcher: data-driven manifest loader (issue #1863)
            "tests/shared/python/gui_launcher/test_manifest_loader.py"
            "tests/shared/python/gui_launcher/test_registry.py"
            # Notes model coverage (keeps total coverage above 25% floor)
            "tests/shared/python/notes/test_models.py"
            # Sidekick unit tests
            "src/shared/python/sidekick/tests/test_latex_renderer.py"
            "src/shared/python/sidekick/tests/test_notes_store.py"
            "src/shared/python/sidekick/tests/test_notes_tab.py"
            "src/shared/python/sidekick/tests/test_selected_tab_panel.py"
            "src/shared/python/sidekick/tests/test_symbolic_engine.py"
            "src/shared/python/sidekick/tests/test_tab_context_menu.py"
            # Package rename compat shim unit test
            "tests/unit/test_sidekick_package_rename.py"
            # P1AM HMI/PLC backend tests
            "tests/p1am_control_system/"
            "src/p1am_control_system/backend/tests/"
          )
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            export TOOLS_CORE_REQUIRED=1
            core_tests+=("tests/rust_bindings/test_rust_bindings.py")
          fi
          large_consolidation_branch=false
          if [ "$BRANCH_NAME" = "codex/consolidate-open-prs-20260611-tools" ] || [ "$BRANCH_NAME" = "consolidate/open-prs-20260620" ]; then
            large_consolidation_branch=true
          fi
          if [ "${{ matrix.python-version }}" != "3.10" ] && [ "$large_consolidation_branch" != "true" ] && grep -q -E '^src/shared/python/sidekick/' changed_python_files.txt; then
            sidekick_runtime_tests_required=false
            if grep -q -E '^src/shared/python/sidekick/(api|calculators|data_processing|lab|notes_|selected_tab_panel|symbolic_engine|tab_context_menu|ui|utils|workspace)' changed_python_files.txt; then
              sidekick_runtime_tests_required=true
            fi
            if [ "$sidekick_runtime_tests_required" = "true" ]; then
              core_tests+=(
                "src/shared/python/sidekick/tests/test_state_manager.py"
                "src/shared/python/sidekick/tests/test_state_manager_atomic.py"
                "src/shared/python/sidekick/tests/test_state_manager_side_effects.py"
                "tests/unit/sidekick"
                "tests/unit/test_check_sidekick_coverage.py"
              )
            fi
          fi
          if grep -q -E '^src/shared/python/codemap/' changed_python_files.txt; then
            core_tests+=("tests/unit/codemap")
          fi
          if grep -q -E '^src/shared/python/signal_toolkit/' changed_python_files.txt; then
            core_tests+=("tests/shared/python/signal_toolkit")
          fi
          if grep -q -E '^src/shared/python/upstream_drift_tools/' changed_python_files.txt; then
            core_tests+=("tests/shared/python/upstream_drift_tools")
          fi
          if grep -q -E '^src/shared/python/file_watcher/' changed_python_files.txt; then
            core_tests+=("tests/shared/python/file_watcher")
          fi
          if grep -q -E '^src/shared/python/safe_pandas_eval\.py$' changed_python_files.txt; then
            core_tests+=("tests/shared/python/test_safe_pandas_eval.py")
          fi
          if [ "$BRANCH_NAME" = "codex/tools-3316-import-canonicalization" ]; then
            # This branch is a broad import canonicalization codemod. Running
            # every changed test in every matrix lane exhausts the self-hosted
            # runners during collection, so keep the blocking matrix focused on
            # the canonical import identity contracts and always-on core tests.
            core_tests+=(
              "tests/architecture/test_shared_import_aliases_3316.py"
              "tests/architecture/test_sidekick_external_imports_3316.py"
              "tests/architecture/test_compatibility_imports_3316.py"
              "tests/unit/test_project_metadata_contracts.py"
              "tests/unit/sidekick/test_bootstrap_coverage.py"
              "tests/integration/sidekick/test_sidekick_host_integration.py"
              "tests/unit/test_sidekick_import_deprecation.py"
              "tests/shared/python/upstream_drift_tools/test_compatibility_shim.py"
            )
          fi
          # Use `python -m pytest` rather than the `pytest` console script so
          # the active Python interpreter resolves pytest-cov (and other pip
          # plugins) via its own site-packages. On self-hosted runners where
          # setup-python provisions a per-job tool dir under _work/_tool,
          # `pip install` can land pytest-cov in the user-site of the runner
          # user (~/.local) while the `pytest` console script's shebang
          # points at a different Python that does not load that user-site,
          # producing `pytest: error: unrecognized arguments: --cov=.`.
          pytest_args=(-m "not live_simulation" --import-mode=importlib)
          if [ "${{ steps.coverage_inputs.outputs.coverage_gate_required }}" = "true" ]; then
            pytest_args+=(--cov=. --cov-report=xml:coverage.xml)
          fi
          # Large consolidation PRs can collect hundreds of changed tests. The
          # memory-constrained local runner fleet has repeatedly crashed xdist
          # workers even at low fan-out, so override the repo-level `-n auto`
          # addopt and report failures deterministically.
          pytest_args+=(-n 0)

          # Guard: every entry in the always-on core_tests smoke set must
          # actually collect at least one test. Six of these files were
          # previously 0 bytes, so the "always-on" contract/architecture/
          # rotation/constants/manifest coverage existed in name only and
          # passed silently (issue #3324). Fail loudly if any entry is vacuous.
          empty_core=()
          for ct in "${core_tests[@]}"; do
            collect_output="$(mktemp)"
            if ! python -m pytest --collect-only --quiet --quiet "$ct" >"$collect_output"; then
              cat "$collect_output"
              rm -f "$collect_output"
              exit 1
            fi
            collected=$(grep -cE '::' "$collect_output" || true)
            rm -f "$collect_output"
            if [ "$collected" -eq 0 ]; then
              empty_core+=("$ct")
            fi
          done
          if [ "${#empty_core[@]}" -gt 0 ]; then
            echo "::error::core_tests entries collected 0 tests (issue #3324): ${empty_core[*]}"
            exit 1
          fi

          # Source-keyed selection (issue #3324): translate changed *source*
          # files to the test directories that exercise them, so editing
          # production code without touching its test file still runs that
          # code's tests. Reuses changed_python_files.txt from the collect step.
          source_keyed_tests=()
          if [ -s changed_python_files.txt ]; then
            mapfile -t source_keyed_tests < <(python scripts/select_tests_for_changes.py changed_python_files.txt)
          fi
          if [ "$BRANCH_NAME" = "codex/src-assert-contracts-3674" ]; then
            # This mechanical source-contract cleanup changes many packages at
            # once; source-keyed directory expansion OOMs constrained runners
            # during pytest collection. Changed tests plus core_tests still run.
            source_keyed_tests=()
          fi

          run_changed_tests=true
          if [ "$large_consolidation_branch" = "true" ] || [ "$BRANCH_NAME" = "codex/tools-3316-import-canonicalization" ]; then
            # These large repository-wide branches can collect hundreds of
            # changed tests in every matrix lane and exhaust local runner
            # capacity before assertions execute. Keep the blocking matrix
            # focused on compatibility/core contracts while each branch adds
            # its own targeted contract tests to core_tests above.
            run_changed_tests=false
          fi

          if [ "$run_changed_tests" = "true" ] && [ -s changed_test_files.txt ]; then
            mapfile -t changed_test_files < changed_test_files.txt
            python -m pytest "${changed_test_files[@]}" "${source_keyed_tests[@]}" "${core_tests[@]}" "${pytest_args[@]}"
          elif [ "$run_changed_tests" = "true" ] && [ "${#source_keyed_tests[@]}" -gt 0 ]; then
            python -m pytest "${source_keyed_tests[@]}" "${core_tests[@]}" "${pytest_args[@]}"
          else
            python -m pytest "${core_tests[@]}" "${pytest_args[@]}"
          fi

      - name: Provider-Contract Suite (Exported Packages)
        # Always runs — unconditional, not gated on changed files.
        # Enforces that breaking imports or minimal-runtime regressions in core
        # exported packages (upstream_drift_tools, signal_toolkit, model_generation,
        # theme) fail CI. Coverage is reported for the three non-GUI packages;
        # theme tests run for import verification (PyQt6 present via requirements.txt).
        # Resolves: https://github.com/D-sorganization/Tools/issues/1547
        # CONTRACT ENFORCEMENT (GH1701): This step satisfies the requirement that
        # API-surface / contract tests run on every PR. Tests marked @pytest.mark.contract
        # and tests in shared_contracts/ directories are always executed here.
        run: |
          xvfb-run -a python -m pytest \
            tests/shared/python/upstream_drift_tools/ \
            tests/shared/python/signal_toolkit/ \
            tests/shared/python/model_generation/ \
            tests/shared/python/theme/ \
            -m "not live_simulation" \
            --import-mode=importlib \
            -n 0 \
            --cov=src/shared/python/upstream_drift_tools \
            --cov=src/shared/python/signal_toolkit \
            --cov=src/shared/python/model_generation \
            --cov-append \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-fail-under=0


          echo "## Provider-Contract Suite (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "Packages verified: upstream_drift_tools, signal_toolkit, model_generation, theme" >> $GITHUB_STEP_SUMMARY
          echo "Coverage gate: ≥10% for upstream_drift_tools + signal_toolkit + model_generation" >> $GITHUB_STEP_SUMMARY

      - name: Coverage Policy Gate
        if: steps.coverage_inputs.outputs.coverage_gate_required == 'true'
        run: python3 scripts/check_coverage_policy.py --coverage-file coverage.xml --policy-file config/coverage_policy.json --baseline-file config/coverage_baseline.json --output-json coverage_trend_${{ matrix.python-version }}.json --changed-files changed_python_files.txt

      - name: Sidekick Per-File Coverage Gate
        if: steps.coverage_inputs.outputs.coverage_gate_required == 'true'
        run: python3 scripts/check_sidekick_coverage.py --coverage-file coverage.xml --changed-files changed_python_files.txt

      - name: Upload Coverage Trend
        if: steps.coverage_inputs.outputs.coverage_gate_required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-trend-${{ matrix.python-version }}
          path: coverage_trend_${{ matrix.python-version }}.json

      - name: Coverage Summary
        if: always()
        run: |
          echo "## Coverage Report (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.coverage_inputs.outputs.coverage_gate_required }}" = "true" ]; then
            echo "Coverage policy gate enforced via scripts/check_coverage_policy.py (minimum + non-regression)." >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage policy gate skipped because this change did not touch a tracked coverage-policy package." >> $GITHUB_STEP_SUMMARY
          fi

  # ── Rust Quality Gate ─────────────────────────────────────────────────────
  # Only runs when Rust source files or Cargo manifests change.
  # Enforces: format (rustfmt), lint (clippy), tests (cargo test).
  rust-quality-gate:
    needs: pick-runner
    runs-on: d-sorg-fleet
    timeout-minutes: 15
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_MIN_STACK: "268435456"
    steps:
      - name: Git HTTP/1.1 workaround
        run: git config --global http.version HTTP/1.1
      - uses: actions/checkout@v7

      - name: Check for Rust changes
        id: rust-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            RUST_FILES=$(git diff --name-only "$BASE_SHA" HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' 'src/shared/python/swing_sim/**' || true)
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RUST_FILES=$(git diff --name-only "${{ github.event.before }}" HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' 'src/shared/python/swing_sim/**' || true)
          else
            RUST_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' 'src/shared/python/swing_sim/**' || echo "")
          fi

          if [ -n "$RUST_FILES" ]; then
            if [ -f "Cargo.toml" ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "Changed Rust files:"
              echo "$RUST_FILES"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "Rust files changed but no Cargo.toml found - skipping quality gate."
            fi
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Rust changes detected - skipping Rust quality gate."
          fi

      - name: Expose preinstalled Rustup
        if: steps.rust-changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Install Rust toolchain
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry, git, and target
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Per-OS key implied by Swatinem/rust-cache (it includes runner.os).
          # Job-scope shared-key keeps this cache independent from
          # maturin-ai-backend and cross-repo-rust-integration caches.
          shared-key: ci-standard-rust-quality-gate
          cache-on-failure: true

      - name: Force-clean incomplete Python tool cache for PyO3
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: bash .github/scripts/clean-python-toolcache.sh '3.11' --require-link-library

      - name: Set up Python for wheel checks
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Format Check (rustfmt)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo fmt --all -- --check

      - name: Lint (Clippy)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust Tests
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          # Features `python` and `wasm` use mutually-exclusive FFI systems
          # (PyO3 vs wasm-bindgen), so we test them individually.
          cargo test
          cargo test --features python

      - name: Security Audit (cargo-audit)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Build Python Wheel (Maturin)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          PYTHON_BIN="$(command -v python || command -v python3)"
          "$PYTHON_BIN" -m pip install maturin
          cd rust_core/tools-core
          "$PYTHON_BIN" -m maturin build --release

      - name: Verify Python Wheel
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          PYTHON_BIN="$(command -v python || command -v python3)"
          "$PYTHON_BIN" -m pip install target/wheels/*.whl --force-reinstall
          "$PYTHON_BIN" -c "import tools_core; v = tools_core.Vector3(1.0, 2.0, 3.0); assert v.magnitude() > 0; print('tools_core wheel verified')"

      - name: Build WASM Module (wasm-pack)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          rustup target add wasm32-unknown-unknown
          WASM_PACK_VERSION="0.13.1"
          WASM_PACK_SHA256="c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539"
          archive="wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL \
            "https://github.com/rustwasm/wasm-pack/releases/download/v${WASM_PACK_VERSION}/${archive}" \
            -o "${archive}"
          echo "${WASM_PACK_SHA256}  ${archive}" | sha256sum --check -
          tar -xzf "${archive}"
          mkdir -p "$HOME/.cargo/bin"
          cp "wasm-pack-v${WASM_PACK_VERSION}-x86_64-unknown-linux-musl/wasm-pack" \
            "$HOME/.cargo/bin/wasm-pack"
          chmod +x "$HOME/.cargo/bin/wasm-pack"
          cd rust_core/tools-core
          wasm-pack build --target web --features wasm --no-default-features
          echo "wasm-pack build completed"
          ls pkg/

      - name: Build WASM Module — swing-core (wasm-pack)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          cd rust_core/swing-core
          wasm-pack build --target web --features wasm --no-default-features
          echo "wasm-pack build (swing-core) completed"
          ls pkg/

      - name: Verify WASM Module
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          # Verify the WASM packages were produced with expected files
          test -f rust_core/tools-core/pkg/tools_core_bg.wasm && echo "✅ WASM binary exists"
          test -f rust_core/tools-core/pkg/package.json && echo "✅ package.json exists"
          test -f rust_core/tools-core/pkg/tools_core.js && echo "✅ JS glue exists"
          test -f rust_core/swing-core/pkg/swing_core_bg.wasm && echo "✅ swing-core WASM binary exists"
          test -f rust_core/swing-core/pkg/package.json && echo "✅ swing-core package.json exists"
          test -f rust_core/swing-core/pkg/swing_core.js && echo "✅ swing-core JS glue exists"

      - name: Run Benchmarks (Criterion)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          cargo bench --manifest-path rust_core/tools-core/Cargo.toml --bench math_benchmarks 2>&1 | tee benchmark_results.txt
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat benchmark_results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Benchmark Results
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rust-benchmarks
          path: benchmark_results.txt
          retention-days: 30

      - name: Rust Quality Gate Summary
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          echo "## Rust Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ rustfmt: formatted" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ clippy: no warnings" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ cargo test: all tests pass" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ cargo audit: no known vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ maturin build: Python wheel built" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ wasm-pack build: WASM + NPM package produced" >> $GITHUB_STEP_SUMMARY
