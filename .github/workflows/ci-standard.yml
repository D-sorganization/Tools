name: CI Standard
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi
          pip install httpx
          pip install ruff==0.14.10 black==26.1.0 mypy==1.13.0 bandit==1.7.7 pip-audit types-PyYAML types-requests

      - name: Lint (Ruff)
        run: ruff check . --exclude "**/*.ipynb"

      - name: Normalize Line Endings
        run: |
          # Convert CRLF to LF for consistent Black formatting
          find . -name "*.py" -type f -exec sed -i 's/\r$//' {} \;

      - name: Collect Changed Python Files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            git diff --diff-filter=ACMRT --name-only "$BASE_SHA" HEAD -- '*.py' > changed_python_files.txt
          elif [ -n "${{ github.event.before }}" ]; then
            git diff --diff-filter=ACMRT --name-only "${{ github.event.before }}" HEAD -- '*.py' > changed_python_files.txt
          else
            git diff --diff-filter=ACMRT --name-only HEAD~1 HEAD -- '*.py' > changed_python_files.txt
          fi
          grep -v '^tests/' changed_python_files.txt > changed_mypy_files.txt || true
          cat changed_python_files.txt

      - name: Format Check (Black)
        run: |
          if [ -s changed_python_files.txt ]; then
            xargs -r -d '\n' black --check < changed_python_files.txt
          else
            echo "No changed Python files to format-check."
          fi

      - name: Type Check (Mypy)
        run: |
          if [ -s changed_mypy_files.txt ]; then
            xargs -r -d '\n' mypy --ignore-missing-imports --install-types --non-interactive < changed_mypy_files.txt
          else
            echo "No changed source Python files to type-check."
          fi

      - name: Security Scan (bandit)
        run: bandit -r src -ll -ii -x tests/,archive/,legacy/,experimental/

      - name: Security Scan (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Secrets Scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Module Size Budget
        run: python3 scripts/check_module_size_budget.py --max-lines 1500 --include src

  tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install fastapi
          pip install httpx

      - name: Collect Changed Test Files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            git diff --name-only "$BASE_SHA" HEAD -- 'tests/test_*.py' 'tests/**/*test.py' > changed_test_files.txt
          elif [ -n "${{ github.event.before }}" ]; then
            git diff --name-only "${{ github.event.before }}" HEAD -- 'tests/test_*.py' 'tests/**/*test.py' > changed_test_files.txt
          else
            git diff --name-only HEAD~1 HEAD -- 'tests/test_*.py' 'tests/**/*test.py' > changed_test_files.txt
          fi
          cat changed_test_files.txt

      - name: Run Tests with Coverage (Python ${{ matrix.python-version }})
        run: |
          if [ -s changed_test_files.txt ]; then
            pytest $(cat changed_test_files.txt) --cov-fail-under=0
          else
            pytest tests/shared/python/notes/test_storage.py --cov-fail-under=0
          fi

      - name: Coverage Summary
        if: always()
        run: |
          echo "## Coverage Report (Python ${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
          echo "Coverage data collected from changed tests. Full threshold enforcement (10%) applies when running the complete test suite." >> $GITHUB_STEP_SUMMARY
