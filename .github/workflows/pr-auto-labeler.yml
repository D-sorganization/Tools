name: PR Auto-Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-auto-labeler-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  label:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v7

      - name: Auto-Label PR
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;

            // Get list of changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const changedFiles = files.map(f => f.filename);
            const labels = new Set();

            // Language/Component labels
            if (changedFiles.some(f => f.startsWith('python/'))) {
              labels.add('python');
            }
            if (changedFiles.some(f => f.startsWith('javascript/'))) {
              labels.add('javascript');
            }
            if (changedFiles.some(f => f.startsWith('matlab/'))) {
              labels.add('matlab');
            }
            if (changedFiles.some(f => f.startsWith('arduino/'))) {
              labels.add('arduino');
            }

            // Infrastructure labels
            if (changedFiles.some(f => f.startsWith('.github/workflows/'))) {
              labels.add('ci/cd');
            }
            if (changedFiles.some(f => f.match(/\.(ya?ml|json)$/))) {
              labels.add('config');
            }

            // Documentation labels
            if (changedFiles.some(f => f.match(/\.(md|rst|txt)$/i))) {
              labels.add('documentation');
            }

            // Test labels
            if (changedFiles.some(f => f.includes('/test'))) {
              labels.add('tests');
            }

            // Quality/Tooling labels
            if (changedFiles.some(f => f.startsWith('tools/'))) {
              labels.add('tooling');
            }
            if (changedFiles.some(f => f.match(/^(ruff\.toml|mypy\.ini|\.pre-commit-config\.yaml|pytest\.ini)$/))) {
              labels.add('quality-control');
            }

            // Dependencies
            if (changedFiles.some(f => f.match(/(requirements\.txt|package\.json|environment\.yml)/))) {
              labels.add('dependencies');
            }

            // Size labels
            const totalChanges = files.reduce((sum, f) => sum + f.changes, 0);
            if (totalChanges > 1000) {
              labels.add('size/XL');
            } else if (totalChanges > 500) {
              labels.add('size/L');
            } else if (totalChanges > 100) {
              labels.add('size/M');
            } else if (totalChanges > 10) {
              labels.add('size/S');
            } else {
              labels.add('size/XS');
            }

            // Apply labels
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: Array.from(labels)
              });

              console.log(`Applied labels: ${Array.from(labels).join(', ')}`);
            } else {
              console.log('No labels to apply');
            }
