name: Jules Archivist

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ BLAST RADIUS DOCUMENTATION — Jules Archivist                               │
# │                                                                             │
# │ WHAT THIS WORKFLOW CAN DO:                                                  │
# │  • Delete remote branches prefixed with "jules/" after they are merged     │
# │    (git push origin --delete <branch>)                                     │
# │                                                                             │
# │ WHAT THIS WORKFLOW CANNOT DO:                                               │
# │  • Delete main, master, or any non-jules/* branch                          │
# │  • Close or merge pull requests                                             │
# │  • Commit new code or modify file contents                                 │
# │                                                                             │
# │ APPROVAL GATES:                                                             │
# │  • Only triggered on pull_request.closed+merged (via Control Tower)        │
# │  • Only targets branches matching "jules/" prefix — other branches ignored │
# │  • Gracefully skips on API rate-limit errors                               │
# └─────────────────────────────────────────────────────────────────────────────┘
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:

# Least-privilege top level: no write access by default.
permissions:
  contents: read

jobs:
  # Dispatcher: route to self-hosted if available.
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  archive-tasks:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    # Grant write only at this job level — branch deletion requires contents: write.
    # pick-runner needs no write access.
    permissions:
      contents: write # delete merged jules/* branches
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup Merged Branches
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          # Fetch list of merged PR branches starting with 'jules/'
          # Note: We filter by the branch prefix used by your agent
          if ! BRANCHES=$(gh pr list --state merged --limit 100 --json headRefName --jq '.[] | select(.headRefName | startswith("jules/")) | .headRefName' 2>gh-pr-list.err); then
            cat gh-pr-list.err
            if grep -qi "rate limit" gh-pr-list.err; then
              echo "::notice::Skipping merged-branch cleanup because the GitHub API rate limit is exhausted."
              exit 0
            fi
            exit 1
          fi

          if [ -z "$BRANCHES" ]; then
            echo "No branches to cleanup."
            exit 0
          fi

          for BRANCH in $BRANCHES; do
            echo "Deleting merged branch: $BRANCH"
            # Delete remote branch
            git push origin --delete "$BRANCH" || true
          done
