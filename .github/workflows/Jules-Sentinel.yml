name: Jules Sentinel (Security Audit)

# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ BLAST RADIUS DOCUMENTATION — Jules Sentinel                                │
# │                                                                             │
# │ WHAT THIS WORKFLOW CAN DO:                                                  │
# │  • Run pip-audit, bandit, and semgrep scanners (read-only analysis)        │
# │  • Invoke Jules AI to interpret findings (READ-ONLY audit mode)            │
# │  • Commit updated .jules/sentinel.md journal to main                      │
# │  • Upload SARIF results to GitHub security-events (code scanning)         │
# │  • Create GitHub issues for HIGH/MEDIUM severity findings                 │
# │                                                                             │
# │ WHAT THIS WORKFLOW CANNOT DO:                                               │
# │  • Modify application source code — audit and document only               │
# │  • Create PRs (automationMode: AUTO_CREATE_PR is explicitly disabled)      │
# │  • Auto-merge or delete branches                                           │
# │                                                                             │
# │ APPROVAL GATES:                                                             │
# │  • Scheduled/dispatched only via Control Tower                             │
# │  • Concurrency lock prevents simultaneous sentinel runs per repo           │
# │  • Jules session created without AUTO_CREATE_PR to prevent PR cascade     │
# └─────────────────────────────────────────────────────────────────────────────┘

on:
  workflow_call:
  workflow_dispatch:
  # Schedule disabled - orchestrated by Jules-Control-Tower.yml
  # schedule:
  #   - cron: "0 8 * * 0,4"  # Weekly on Mondays at 1:30 AM UTC (overnight window)

# Least-privilege top level: no write access by default.
permissions:
  contents: read

# HARDENING: Prevent concurrent runs
concurrency:
  group: jules-sentinel-${{ github.repository }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  security-audit:
    timeout-minutes: 20
    needs: pick-runner
    runs-on: d-sorg-fleet
    # Grant write only at this job level.
    # Note: pull-requests: write intentionally omitted — Sentinel is read-only audit.
    permissions:
      contents: write # commit .jules/sentinel.md journal to main
      issues: write # open tracking issues for HIGH/MEDIUM findings
      security-events: write # upload SARIF to GitHub code-scanning
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        with:
          python-version: "3.11"

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Dependencies
        run: |
          pip install safety bandit pip-audit semgrep
          npm install -g @google/jules@0.1.42

      - name: Run Security Scanners
        run: |
          mkdir -p reports

          echo "Running pip-audit..."
          pip-audit --format json -o reports/pip_audit.json || true

          echo "Running bandit..."
          bandit -r . -f json -o reports/bandit.json --exclude './.venv,./venv,./env,./.git' || true

          echo "Running semgrep..."
          semgrep --config=auto --json -o reports/semgrep.json . || true

      - name: Jules Sentinel Analysis
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -e
          REPO="${{ github.repository }}"
          API_BASE="https://jules.googleapis.com/v1alpha"

          # Check if API key is configured
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::JULES_API_KEY not configured. Skipping Jules task."
            exit 0
          fi

          echo "Looking up repository source..."
          SOURCES=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/sources" || echo '{"sources":[]}')

          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)

          SOURCE_ID=$(echo "$SOURCES" | jq -r ".sources[] | select(.githubRepo.owner == \"$OWNER\" and .githubRepo.repo == \"$REPO_NAME\") | .name" | head -1)

          if [ -z "$SOURCE_ID" ] || [ "$SOURCE_ID" = "null" ]; then
            echo "::warning::Repository $REPO not found in Jules sources."
            exit 0
          fi

          echo "Found source: $SOURCE_ID"

          # Create session prompt
          PROMPT=$(cat <<PROMPT_EOF
          You are the SENTINEL security agent.

          Analyze the security audit reports in ./reports/ and document findings.

          ## DO NOT MODIFY CODE directly. Instead:

          ### For HIGH severity: Create GitHub Issue with labels: security, high-priority, jules:sentinel
          ### For MEDIUM severity: Add to .jules/sentinel.md and create Issue
          ### For LOW severity: Document in .jules/sentinel.md only

          Update .jules/sentinel.md with scan results summary.

          CRITICAL: This is a READ-ONLY audit. Do not fix code - only document and create issues.
          PROMPT_EOF
          )

          echo "Creating Jules session..."
          # HARDENING: Do NOT use automationMode: AUTO_CREATE_PR
          # Sentinel is read-only - it documents findings but doesn't create PRs autonomously
          # This prevents cascade issues where Jules creates PRs that trigger more workflows
          REQUEST_JSON=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "$SOURCE_ID" \
            '{
              prompt: $prompt,
              sourceContext: {
                source: $source,
                githubRepoContext: {
                  startingBranch: "main"
                }
              }
            }')

          echo "Request: $REQUEST_JSON"

          HTTP_CODE=$(curl -s -o /tmp/session_response.json -w "%{http_code}" -X POST \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_JSON" \
            "$API_BASE/sessions")

          SESSION_RESPONSE=$(cat /tmp/session_response.json)
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Jules API returned HTTP $HTTP_CODE"
            exit 1
          fi

          SESSION_ID=$(echo "$SESSION_RESPONSE" | jq -r '.name')
          echo "Created session: $SESSION_ID"

          # Poll for completion
          MAX_WAIT=1800
          POLL_INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            SESSION_STATUS=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/$SESSION_ID")
            STATE=$(echo "$SESSION_STATUS" | jq -r '.state')
            echo "Session state: $STATE (elapsed: ${ELAPSED}s)"

            case "$STATE" in
              "COMPLETED"|"SUBMITTED")
                echo "Session completed successfully!"
                break
                ;;
              "FAILED"|"CANCELLED")
                echo "::error::Session $STATE"
                exit 1
                ;;
            esac
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

      - name: Commit Journal
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "docs(sentinel): weekly security audit"
          file_pattern: ".jules/sentinel.md"
