name: Security SAST

# Blocking SAST gate added as CodeQL replacement (issue #2473).
# CodeQL remains disabled per maintainer direction.
# Runs Bandit full-repo scan (medium+ severity) and verifies the
# detect-secrets baseline has not drifted.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit-sast:
    name: Bandit SAST (medium+ severity)
    runs-on: d-sorg-fleet
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install "bandit==1.7.7"

      - name: Run Bandit full-repo scan
        # -r src/   — recursive scan of all source code
        # -ll       — report medium severity and above (LOW skipped)
        # -ii       — report medium confidence and above
        # Exit code 1 when issues found — this step is blocking.
        run: |
          python -m bandit -r src/ -ll -ii \
            --exclude src/data_processing,src/document_processing,src/pendulum_simulator,src/scientific_modeling,src/tools/folder_tools \
            -f txt

  detect-secrets-baseline:
    name: detect-secrets baseline check
    runs-on: d-sorg-fleet
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: python -m pip install detect-secrets

      - name: Verify baseline is present
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo "::error::.secrets.baseline is missing. Run: detect-secrets scan > .secrets.baseline"
            exit 1
          fi

      - name: Scan against baseline
        run: |
          cp .secrets.baseline .secrets.baseline.before
          detect-secrets scan --baseline .secrets.baseline \
            --exclude-files '(^|/)(\.secrets\.baseline(\..*)?|src/document_processing/pdf_renamer/(API_KEY_SETUP|QUICK_START|README)\.md)$'

      - name: Fail if new secrets introduced
        run: |
          python - <<'PY'
          import json
          import pathlib
          import sys
          from collections import Counter

          def result_fingerprints(path: str) -> Counter:
              data = json.loads(pathlib.Path(path).read_text())
              fingerprints = []
              for filename, findings in data.get("results", {}).items():
                  normalized_name = filename.replace("\\", "/")
                  for finding in findings:
                      fingerprints.append(
                          (
                              normalized_name,
                              finding.get("type", ""),
                              finding.get("hashed_secret", ""),
                          )
                      )
              return Counter(fingerprints)

          before = result_fingerprints(".secrets.baseline.before")
          after = result_fingerprints(".secrets.baseline")
          added = after - before
          removed = before - after
          if added:
              print("::error::detect-secrets baseline changed — new secret(s) detected")
              for label, delta in (("added", added), ("removed", removed)):
                  summary = Counter((f, k) for f, k, _ in delta.elements())
                  for (filename, kind), count in sorted(summary.items()):
                      print(f"{label}: {count} finding(s) in {filename} ({kind})")
              sys.exit(1)
          print("No new secrets detected.")
          PY
