name: Benchmark Suite

on:
  # Run nightly instead of per-PR to reduce CI load.
  # Benchmark suite is advisory (continue-on-error everywhere) and historically
  # ran ~50min per PR — much of that time was pip install. Moving to a nightly
  # cadence + on-demand dispatch retains the data without blocking developers.
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
  # Keep main-branch push trigger (path-filtered) so benchmark trendlines
  # update immediately when benchmarked code lands in main.
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "tests/benchmarks/**"
      - ".github/workflows/benchmark-suite.yml"
      - "pyproject.toml"
      - ".benchmarks/**"
      - "src/**/*.py"
      - "rust_core/**"
      - "benchmarks/**"

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  benchmark-foundation:
    name: Benchmark Suite (pytest-benchmark)
    runs-on: d-sorg-fleet
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for comparison

      - name: Set up Python
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify Python runtime
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 11), sys.version'

      # Never repair or install into the setup-python interpreter in place.
      # A stale self-hosted pip package can contain metadata from one version
      # and modules from another. venv bootstraps a job-local pip and keeps all
      # benchmark mutations under RUNNER_TEMP.
      - name: Create isolated benchmark virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/benchmark-venv"
          echo "$RUNNER_TEMP/benchmark-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/benchmark-venv" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/benchmark-venv/bin/python" -m pip --version

      # Cache pip downloads — typical install in this workflow is ~17min cold,
      # drops to <60s on a warm cache. Key includes both pyproject.toml and
      # requirements*.txt so any dependency change invalidates the cache.
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-benchmark-${{ runner.os }}-py3.11-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            pip-benchmark-${{ runner.os }}-py3.11-
            pip-benchmark-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --ignore-installed "pip<26.1" "setuptools>=61.0,<82" wheel
          python -m pip install --ignore-installed --no-deps "sortedcontainers>=2.4.0" "hypothesis>=6.0.0"
          python -m pip install --ignore-installed --no-deps "py-cpuinfo>=9.0.0" "pytest-benchmark>=5.2.3"
          python -m pip install --ignore-installed --no-deps mypy==1.13.0
          python -m pip install --ignore-installed --no-deps ruff==0.14.10
          grep -v -E '^mypy==' requirements.txt > requirements-ci.txt
          python -m pip install -r requirements-ci.txt
          python -m pip install "numpy>=2.0.1"
          python -m pip install fastapi httpx pytest-cov pytest-xdist pytest-benchmark bandit==1.7.7 pip-audit types-PyYAML types-requests
          python -m pip install --ignore-installed mypy==1.13.0
          python -m pip install -e ".[dev]"

      - name: Run benchmark suite
        run: |
          python -m pytest tests/benchmarks/ \
            --override-ini="addopts=" \
            --benchmark-enable --benchmark-only \
            --benchmark-json=.benchmarks/results.json \
            --benchmark-columns=min,max,mean,stddev,median \
            -v --tb=short
        continue-on-error: true

      - name: Compare against baseline
        if: github.event_name == 'pull_request'
        run: |
          timeout 8m python -m pytest tests/benchmarks/ \
            --override-ini="addopts=" \
            --benchmark-enable --benchmark-only \
            --benchmark-max-time=0.5 \
            --benchmark-min-rounds=1 \
            --benchmark-compare=.benchmarks/baseline.json \
            --benchmark-compare-fail=min:10% \
            --benchmark-columns=min,max,mean,stddev,median,ops \
            -v --tb=short
        continue-on-error: true

      - name: Generate benchmark report
        if: always()
        run: |
          python3 << 'EOF'
          import json
          import sys

          try:
              with open('.benchmarks/results.json') as f:
                  data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              print("No benchmark results found")
              sys.exit(0)

          # Generate markdown summary
          md = "## Benchmark Results\n\n"
          md += "| Test | Min (μs) | Mean (μs) | Max (μs) | StdDev |\n"
          md += "|------|----------|-----------|----------|--------|\n"

          for b in data.get('benchmarks', []):
              name = b['name'].split('::')[-1]
              stats = b['stats']
              md += f"| {name} | "
              md += f"{stats['min']*1e6:.1f} | "
              md += f"{stats['mean']*1e6:.1f} | "
              md += f"{stats['max']*1e6:.1f} | "
              md += f"{stats['stddev']*1e6:.1f} |\n"

          with open('benchmark_report.md', 'w') as f:
              f.write(md)
          print(md)
          EOF

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            .benchmarks/results.json
            benchmark_report.md

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');

            let body = '';

            // Try to read markdown report
            if (fs.existsSync('benchmark_report.md')) {
              body += fs.readFileSync('benchmark_report.md', 'utf8');
            }

            // Add SLA summary
            body += '\n\n### SLA Status\n\n';
            body += '**Note:** Full SLA validation available in `.benchmarks/PERFORMANCE_SLA.md`\n\n';
            body += '- **Rotation Converter:** Target < 50ms per conversion\n';
            body += '- **Pressure Drop:** Target < 100ms per calculation\n';
            body += '- **Data Processor:** Target < 500ms for 10K-row filtering\n';

            // Add diagnostic info
            body += '\n\n### Diagnostics\n\n';
            body += `- **Run ID:** ${context.runId}\n`;
            body += `- **Commit:** ${context.sha.substring(0, 7)}\n`;
            body += `- **See also:** [Artifacts](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Set benchmark status check
        if: always()
        run: |
          # This allows the benchmark suite to be gated in branch protection
          # without blocking merges if benchmarks can't run
          echo "Benchmark suite completed with status: ${{ job.status }}"

  benchmark-validation:
    name: Benchmark SLA Validation
    runs-on: d-sorg-fleet
    timeout-minutes: 10
    if: ${{ always() && needs.benchmark-foundation.result != 'failure' && needs.benchmark-foundation.result != 'cancelled' }}
    needs: [benchmark-foundation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download benchmark results
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results-${{ github.run_id }}
          path: .benchmarks

      - name: Validate SLAs
        run: |
          python3 << 'EOF'
          import json
          import sys

          # SLA targets in seconds
          SLAS = {
              "pressure_drop": 0.1,  # 100ms
              "rotation_converter": 0.05,  # 50ms
              "data_processor": 0.5,  # 500ms for 10K rows
          }

          results_file = '.benchmarks/results.json'
          try:
              with open(results_file) as f:
                  data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              print("No results file found; skipping validation")
              sys.exit(0)

          violations = []
          for bench in data.get('benchmarks', []):
              name = bench['name']
              mean_time = bench['stats']['mean']

              # Map benchmark to SLA category
              sla_key = None
              if 'pressure_drop' in name:
                  sla_key = 'pressure_drop'
              elif 'rotation' in name:
                  sla_key = 'rotation_converter'
              elif 'data_processor' in name or 'fft' in name:
                  sla_key = 'data_processor'

              if sla_key and sla_key in SLAS:
                  sla = SLAS[sla_key]
                  if mean_time > sla:
                      violations.append(f"{name}: {mean_time*1e6:.1f}μs (SLA: {sla*1e6:.0f}μs)")

          if violations:
              print("⚠ SLA Violations Detected:")
              for v in violations:
                  print(f"  - {v}")
              sys.exit(1)
          else:
              print("✓ All benchmarks within SLA")
              sys.exit(0)
          EOF
        continue-on-error: true

      - name: Report validation status
        if: always()
        run: |
          echo "SLA validation completed"
          # In branch protection, this job can optionally be required
          # Set continue-on-error: true to make it advisory only
