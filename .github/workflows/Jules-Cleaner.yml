name: Jules Cleaner (Supersede & Close)

on:
  pull_request:
    types: [closed]

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          FLEET_MODE: ${{ vars.FLEET_RUNNER_MODE }}
        run: |
          MODE="${FLEET_MODE:-hybrid}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            cloud)
              echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
              echo "Routing to GitHub-hosted (mode=cloud)"
              ;;
            hybrid|*)
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "No idle fleet runners - falling back to GitHub-hosted"
              fi
              ;;
          esac
  cleanup:
    needs: pick-runner
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'jules:consolidation')
    runs-on: self-hosted
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Supersede and Close PRs
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CONSOLIDATED_PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          # Extract PR numbers. Expecting "Consolidated PRs: #123 #124" or similar
          # We use regex to find #\d+ patterns in the body

          echo "Analyzing Consolidated PR #$CONSOLIDATED_PR_NUM..."

          # Extract all numbers prefixed with # from the body
          prs=$(echo "$PR_BODY" | grep -o '#[0-9]\+' | tr -d '#')

          for pr_num in $prs; do
            # Skip self-reference if present
            if [ "$pr_num" == "$CONSOLIDATED_PR_NUM" ]; then
              continue
            fi
            
            echo "Processing original PR #$pr_num..."
            
            # Check if PR is still open
            state=$(gh pr view "$pr_num" --json state -q .state)
            
            if [ "$state" == "OPEN" ]; then
              echo "  Closing PR #$pr_num as superseded..."
              
              # Add comment
              gh pr comment "$pr_num" --body "Superseded by Consolidated PR #$CONSOLIDATED_PR_NUM. This branch will be deleted."
              
              # Close PR
              gh pr close "$pr_num" --comment "Auto-closing: consolidated into #$CONSOLIDATED_PR_NUM"
              
              # Delete branch (gh pr close --delete-branch doesn't always work if not merged, do it explicitly)
              gh pr close "$pr_num" --delete-branch || echo "  Could not delete branch for #$pr_num (maybe already deleted)"
            else
              echo "  PR #$pr_num is already $state. skipping."
            fi
          done

