name: Jules Test Generator (Worker)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_call:

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          LOCAL_MODE: ${{ vars.CI_RUNNER_MODE || vars.LOCAL_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        shell: bash
        run: |
          MODE="${LOCAL_MODE:-local}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            disabled)
              echo "::error::No local self-hosted runner available; failing closed"
              exit 1
              ;;
            *)
              # Public repos get free unmetered hosted runners, so there is no
              # reason to fail closed when the fleet is merely saturated: the
              # probe below counts `busy == false`, and the fleet routinely runs
              # fully online with ZERO idle runners.
              if [ "$REPOSITORY_PRIVATE" != "true" ]; then
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "Public repo - routing to free hosted runner (mode=$MODE)"
                exit 0
              fi
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "::error::No local self-hosted runner available; failing closed"
                exit 1
              fi
              ;;
          esac
  generate-tests:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: d-sorg-fleet
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 2 }

      - name: Identify New/Modified Files
        id: files
        run: |
          # FIX: Ensure we catch files in src/ or python/ that are NOT tests
          # Using git diff with explicit path filters is safer than grep
          CHANGED_FILES=$(git diff --name-only HEAD^ HEAD -- 'src/**/*.py' 'python/**/*.py' ':!tests/*' ':!*test_*.py' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant source files changed."
            exit 0
          fi

          # Flatten newlines to commas for the prompt
          FILES_FLAT=$(echo "$CHANGED_FILES" | tr '\n' ', ')
          echo "files=$FILES_FLAT" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm install -g @google/jules@0.1.42

      - name: Generate Tests
        if: steps.files.outputs.files != ''
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          # Request 3 parallel sessions. Jules will try 3 different testing strategies.
          jules remote new \
            --repo ${{ github.repository }} \
            --session "Generate comprehensive pytest unit tests for: [ $FILES ]. Focus on edge cases." \
            --branch ${{ github.ref_name }} \
            --parallel 3
