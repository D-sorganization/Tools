[mypy]
files = .
exclude = (config/project_template/|data_processing/data_processor/tools/|data_processing/data_processor/python/data_processor/|media_processing/video_processor/tools/|media_processing/video_processor/python/src/|tools/folder_tools/folder_tool/|tools/folder_tools/folder_packer_pro/|.*/tests/)
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
ignore_missing_imports = True
explicit_package_bases = True

# Relax strictness for legacy modules if needed
[mypy-scientific_modeling.solar_system_model.solar_system.data.historical_events]
disallow_untyped_defs = False
