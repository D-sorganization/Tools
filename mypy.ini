[mypy]
files = .
exclude = (config/project_template/|data_processing/data_processor/tools/|data_processing/data_processor/python/data_processor/|electrode_advisor/python/electrode_advisor/|media_processing/video_processor/tools/|media_processing/video_processor/python/src/|tools/folder_tools/folder_tool/|tools/folder_tools/folder_packer_pro/|.*/tests/|src/shared/python/upstream_drift_tools/|src/shared/python/signal_toolkit/|src/shared/python/model_generation/|src/shared/python/humanoid_character_builder/|src/python/src/utils/plotting\.py|src/solar_system_model/solar_system/visualization/textures\.py|src/web_applications/calculator/webapp\.py)
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
ignore_missing_imports = True
explicit_package_bases = True

# Relax strictness for legacy modules if needed
[mypy-scientific_modeling.solar_system_model.solar_system.data.historical_events]
disallow_untyped_defs = False

# solar_system_model uses mixin pattern where attributes come from the composed
# class — mypy cannot resolve these without full Protocol typing. Suppress
# attr-defined and other errors from the visualization layer.
[mypy-solar_system_model.solar_system.visualization]
ignore_errors = True

[mypy-solar_system_model.solar_system.visualization.*]
ignore_errors = True

[mypy-solar_system_model.solar_system.setup]
ignore_errors = True

[mypy-rrt_path_planner]
ignore_errors = True

[mypy-rrt_path_planner.*]
ignore_errors = True

# Skip type-following for shared bootstrap/launcher modules.
# MYPYPATH includes both "src/shared/python" (so they resolve as "_bootstrap",
# "gui_launcher") and "src" (so shared.python.* also resolves the same files).
# Mypy marks any file reachable under two module names as a fatal error
# ("Source file found twice").  Using follow_imports=skip stops mypy from
# physically reading these modules, so no physical file is ever double-named.
[mypy-_bootstrap]
follow_imports = skip

[mypy-gui_launcher]
follow_imports = skip

[mypy-gui_launcher.*]
follow_imports = skip

# programmatic_pid resolves under both "programmatic_pid" and
# "src.shared.python.programmatic_pid" due to MYPYPATH overlap.
[mypy-programmatic_pid]
follow_imports = skip

[mypy-programmatic_pid.*]
follow_imports = skip

# Relax mypy strictness for the DWSIM Gasification Model package.
# This module was migrated from a standalone repo and has not yet been fully
# annotated.  Disable type-annotation requirements and return-type warnings
# until a follow-up annotation PR is merged.
[mypy-dwsim_model]
ignore_errors = True

[mypy-dwsim_model.*]
ignore_errors = True

# signal_toolkit is excluded from CI mypy scan but gets pulled in
# transitively by files that import it.  Suppress all errors from it.
[mypy-signal_toolkit]
ignore_errors = True

[mypy-signal_toolkit.*]
ignore_errors = True

[mypy-polynomial_generator]
ignore_errors = True

[mypy-polynomial_generator.*]
ignore_errors = True

# Controls widgets use try/except ImportError for UnitAwareInput fallback.
# This creates dead-code branches that confuse mypy's unused-ignore analysis.
# Multiple module paths to cover different MYPYPATH / explicit-package-bases resolutions.
[mypy-double_pendulum_golf.gui.controls_widget_golfer]
warn_unused_ignores = False

[mypy-double_pendulum_golf.gui.controls_widget_triple]
warn_unused_ignores = False

[mypy-pendulum_simulator.src.double_pendulum_golf.gui.controls_widget_golfer]
warn_unused_ignores = False

[mypy-pendulum_simulator.src.double_pendulum_golf.gui.controls_widget_triple]
warn_unused_ignores = False

# analysis_tab uses matplotlib 3D axes (Axes3D) whose attributes (zaxis, pane,
# plot_surface, set_zlabel) are not visible to mypy when stubs are absent (CI).
# Local environments with matplotlib-stubs SEE these errors; CI does NOT.
[mypy-double_pendulum_golf.gui.analysis_tab]
warn_unused_ignores = False

[mypy-pendulum_simulator.src.double_pendulum_golf.gui.analysis_tab]
warn_unused_ignores = False

# panel_builders and hub_options have type: ignore comments for protocol
# structural typing that differs between local and CI environments.
[mypy-double_pendulum_golf.gui.panel_builders]
warn_unused_ignores = False

[mypy-pendulum_simulator.src.double_pendulum_golf.gui.panel_builders]
warn_unused_ignores = False

# controls_widget.py and controls_widget_base.py have pre-existing no-any-return
# and unused-ignore patterns due to complex PyQt6 / QDoubleSpinBox type interactions.
[mypy-double_pendulum_golf.gui.controls_widget]
warn_unused_ignores = False
warn_return_any = False

[mypy-pendulum_simulator.src.double_pendulum_golf.gui.controls_widget]
warn_unused_ignores = False
warn_return_any = False

[mypy-double_pendulum_golf.gui.controls_widget_base]
warn_return_any = False

[mypy-pendulum_simulator.src.double_pendulum_golf.gui.controls_widget_base]
warn_return_any = False

# folder_packer_pro uses a mixin composition pattern where attributes are
# defined across mixed-in classes. Mypy cannot resolve cross-mixin attr-defined
# references without full Protocol typing, and the `# type: ignore` comments
# from the PyQt6-free CI environment generate unused-ignore warnings when Qt
# stubs are absent. Suppress until a follow-up Protocol annotation PR lands.
[mypy-folder_packer_pro]
ignore_errors = True

[mypy-folder_packer_pro.*]
ignore_errors = True

# folder_tool and scripting_env have pre-existing typing issues unrelated to our changes.
[mypy-folder_tool.Folders_Tool_r0]
ignore_errors = True

[mypy-shared.python.scripting.scripting_env]
ignore_errors = True

[mypy-scripting.scripting_env]
ignore_errors = True
