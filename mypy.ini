[mypy]
files = .
exclude = (config/project_template/|data_processing/data_processor/tools/|data_processing/data_processor/python/data_processor/|electrode_advisor/python/electrode_advisor/|media_processing/video_processor/tools/|media_processing/video_processor/python/src/|tools/folder_tools/folder_tool/|tools/folder_tools/folder_packer_pro/|.*/tests/|src/shared/python/upstream_drift_tools/|src/shared/python/signal_toolkit/|src/shared/python/model_generation/|src/shared/python/humanoid_character_builder/|src/python/src/utils/plotting\.py|src/scientific_modeling/solar_system_model/solar_system/visualization/textures\.py|src/web_applications/calculator/webapp\.py)
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = False
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
ignore_missing_imports = True
explicit_package_bases = True

# Relax strictness for legacy modules if needed
[mypy-scientific_modeling.solar_system_model.solar_system.data.historical_events]
disallow_untyped_defs = False

# Skip type-following for shared bootstrap/launcher modules.
# MYPYPATH includes both "src/shared/python" (so they resolve as "_bootstrap",
# "gui_launcher") and "src" (so shared.python.* also resolves the same files).
# Mypy marks any file reachable under two module names as a fatal error
# ("Source file found twice").  Using follow_imports=skip stops mypy from
# physically reading these modules, so no physical file is ever double-named.
[mypy-_bootstrap]
follow_imports = skip

[mypy-gui_launcher]
follow_imports = skip

[mypy-gui_launcher.*]
follow_imports = skip

# Relax mypy strictness for the DWSIM Gasification Model package.
# This module was migrated from a standalone repo and has not yet been fully
# annotated.  Disable type-annotation requirements and return-type warnings
# until a follow-up annotation PR is merged.
[mypy-dwsim_model]
ignore_errors = True

[mypy-dwsim_model.*]
ignore_errors = True

# Controls widgets use try/except ImportError for UnitAwareInput fallback.
# This creates dead-code branches that confuse mypy's unused-ignore analysis.
[mypy-double_pendulum_golf.gui.controls_widget_golfer]
warn_unused_ignores = False

[mypy-double_pendulum_golf.gui.controls_widget_triple]
warn_unused_ignores = False
