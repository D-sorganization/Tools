[mypy]
python_version = 3.11
strict = True
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_any_unimported = False
no_implicit_optional = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True

# Require type hints for all functions
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True

# Don't allow Any types
disallow_any_explicit = False
disallow_any_generics = True
disallow_subclassing_any = True

# Error on missing imports
ignore_missing_imports = True
follow_imports = normal

# Exclude MATLAB, MATLAB-optimized, scripts, template and JavaScript/TypeScript directories
exclude = ^(matlab/|matlab_optimized/|javascript/|config/project_template/|.*build_exe\.py|.*/archive/|.*/legacy/|replicants/|data_processing/data_processor/tools/|web_applications/unit_converter/tools/|media_processing/video_processor/tools/|fix_.*\.py|document_processing/pdf_renamer_backup/|development_tools/folder_tools/|media_processing/video_processor/python/|document_processing/pdf_renamer/tests/)

# Plugins for better checking
# plugins = numpy.typing.mypy_plugin

# External libraries without stubs
[mypy-scipy.*]
ignore_missing_imports = True

[mypy-matplotlib.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-torch.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True

# Legacy/experimental code to ignore
[mypy-archive.*]
ignore_errors = True

[mypy-legacy.*]
ignore_errors = True

[mypy-experimental.*]
ignore_errors = True

# Common libraries without stubs
[mypy-moderngl.*]
ignore_missing_imports = True

[mypy-numba.*]
ignore_missing_imports = True

[mypy-psutil.*]
ignore_missing_imports = True

# Qt stacks
[mypy-PyQt5.*]
ignore_missing_imports = True

[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-PySide6.*]
ignore_missing_imports = True

[mypy-customtkinter.*]
ignore_missing_imports = True

[mypy-flask.*]
ignore_missing_imports = True

[mypy-sympy.*]
ignore_missing_imports = True

[mypy-web_applications.calculator.*]
disallow_untyped_decorators = False

[mypy-data_processing.data_processor.python.tests.*]
disallow_any_unimported = False
disallow_untyped_defs = False

[mypy-data_processing.*]
disallow_any_unimported = False
warn_return_any = False

[mypy-tests.*]
disallow_untyped_decorators = False

[mypy-project_packer.tests.*]
disallow_untyped_decorators = False
