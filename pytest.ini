[pytest]
# =============================================================================
# Test Discovery Configuration
# =============================================================================

# Only collect tests from the root tests/ directory
# Sub-project tests in src/ have path dependencies and should be run separately
testpaths = tests

# Python path configuration - removes need for sys.path hacks in test files
# These directories are added to sys.path before test collection
pythonpath =
    src
    src/python/src
    src/shared/python
    src/tools
    src/web_applications
    src/data_processing/data_processor/python
    src/scientific_modeling/solar_system_model
    src/scientific_modeling/rrt_path_planner/python/src
    src/media_processing/video_processor/python

# Test file patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Core exclusions for test discovery
# Note: Directory names (not paths) are matched anywhere in the tree
norecursedirs =
    replicants
    archive
    legacy
    experimental
    .git
    .tox
    .nox
    .eggs
    __pycache__
    build
    dist
    *.egg-info
    .pytest_cache
    htmlcov
    # Directories with optional dependencies (prevents collection errors)
    pdf_renamer
    pdf_renamer_backup
    project_packer
    folder_packer_pro
    rrt_path_planner
    calculator

# =============================================================================
# Test Markers
# =============================================================================

markers =
    unit: mark test as unit test (fast, isolated, no external dependencies)
    integration: mark test as integration test (may use external resources)
    e2e: mark test as end-to-end test (full system test)
    slow: mark test as slow running (> 5 seconds)
    performance: mark test for performance benchmarking
    requires_network: mark test as requiring network connectivity
    requires_database: mark test as requiring database connection
    requires_gpu: mark test as requiring GPU/CUDA
    smoke: mark test as smoke test (basic sanity check)
    regression: mark test for regression testing
    asyncio: mark test as async test

# =============================================================================
# Output and Reporting
# =============================================================================

# Default command line options
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    -ra

# Show slowest 10 tests
# Uncomment to enable: --durations=10

# Console output formatting
console_output_style = progress

# =============================================================================
# Warnings Configuration
# =============================================================================

filterwarnings =
    # Ignore deprecation warnings from external packages
    ignore::DeprecationWarning:pkg_resources
    ignore::UserWarning:pygame.pkgdata
    ignore::DeprecationWarning:setuptools
    # Show our own deprecation warnings
    default::DeprecationWarning:utils
    default::DeprecationWarning:tools
    # Ignore specific known warnings
    ignore:.*unclosed file.*:ResourceWarning

# =============================================================================
# Logging Configuration
# =============================================================================

# Capture logging at DEBUG level during tests
log_cli = false
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Log file configuration (when enabled)
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s (%(filename)s:%(lineno)d): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# =============================================================================
# Coverage Configuration (pytest-cov)
# =============================================================================

# Coverage is enabled via addopts above (--cov=src --cov-report=term-missing)
# Minimum coverage threshold: 10% (enforced via --cov-fail-under=10)

# =============================================================================
# Timeout Configuration (when using pytest-timeout)
# =============================================================================

# Default timeout for tests in seconds (requires pytest-timeout)
# timeout = 300

# =============================================================================
# Parallel Execution (when using pytest-xdist)
# =============================================================================

# Number of parallel workers (requires pytest-xdist)
# Uncomment to enable: -n auto

# =============================================================================
# Test Execution Order
# =============================================================================

# Random order seed for reproducibility (requires pytest-randomly)
# Uncomment to enable: --randomly-seed=42

# =============================================================================
# Fixture Configuration
# =============================================================================

# Use function-scoped fixtures by default
usefixtures =

# =============================================================================
# Environment Variables
# =============================================================================

# Note: Environment variables can be set using pytest-env plugin
# Install with: pip install pytest-env
# Then uncomment the following:
# env =
#     TESTING=1
#     LOG_LEVEL=WARNING
