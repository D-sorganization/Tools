[pytest]
# Only collect tests from the root tests/ directory
# Sub-project tests in src/ have path dependencies and should be run separately
testpaths = tests

# Core exclusions for test discovery
# Note: Directory names (not paths) are matched anywhere in the tree
norecursedirs =
    replicants
    archive
    legacy
    experimental
    .git
    # Directories with optional dependencies (prevents collection errors)
    pdf_renamer
    pdf_renamer_backup
    project_packer
    folder_packer_pro
    rrt_path_planner
    calculator

python_files = test_*.py

# Filter pkg_resources warnings from setuptools deprecation
filterwarnings =
    ignore::DeprecationWarning:pkg_resources
    ignore::UserWarning:pygame.pkgdata
