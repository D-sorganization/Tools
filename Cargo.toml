# Root Cargo workspace for the Tools shared simulation kernel.
#
# This workspace houses all Rust crates that compile to:
#   - Python wheels (via PyO3 / Maturin)
#   - WebAssembly modules (via wasm-bindgen / wasm-pack)
#
# Usage:
#   cargo build          — build all crates
#   cargo test           — run all tests
#   cargo clippy         — lint all crates
#   cargo fmt --check    — format check all crates

[workspace]
resolver = "2"
members = [
    "rust_core/tools-core",
    "rust_core/math-primitives",
    "rust_core/ai_backend",
    "rust_core/file_watcher",
    "rust_core/data-processor-core",
]
# `src/pendulum_simulator/pendulum-core` is intentionally NOT a workspace member
# (issue #3294). Its `pyo3` dependency enables `extension-module` unconditionally,
# which breaks plain `cargo build`/`cargo test` linkage at the workspace level
# (the symbols are only resolved when built as a Python extension via maturin).
# It is built/tested on its own via:
#   maturin build --release -m src/pendulum_simulator/pendulum-core/Cargo.toml
# Listing it under `exclude` documents the decision and prevents the resolver
# from accidentally absorbing it via path globbing.
exclude = [
    "src/pendulum_simulator/pendulum-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["D-sorganization Contributors"]
license = "MIT"
repository = "https://github.com/D-sorganization/Tools"

[workspace.dependencies]
# Shared dependencies pinned at workspace level (DRY)
pyo3 = { version = "0.24" }
numpy = "0.24"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Testing
proptest = "1"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }
