[package]
name = "math-primitives"
description = "SE3/SO3 math primitives: quaternions, rotations, transforms, geometric collision (Hub library)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nalgebra = "0.33"
serde = { workspace = true }

[dependencies.pyo3]
version = "0.24"
optional = true

[dependencies.numpy]
workspace = true
optional = true

[dependencies.wasm-bindgen]
workspace = true
optional = true

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]
extension-module = ["pyo3/extension-module"]
wasm = ["wasm-bindgen"]

[lib]
name = "math_primitives"
crate-type = ["lib"]

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "math_bench"
harness = false
