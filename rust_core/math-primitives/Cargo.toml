[package]
name = "math-primitives"
description = "SE3/SO3 math primitives: quaternions, rotations, transforms, geometric collision (Hub library)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nalgebra = "0.33"

[dependencies.pyo3]
version = "0.24"
features = ["extension-module"]
optional = true

[features]
default = []
python = ["pyo3"]

[lib]
name = "math_primitives"
crate-type = ["lib"]
