[package]
name = "data-processor-core"
description = "Native streaming data-plane engine for the Data Processor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "data-processor-core"
path = "src/main.rs"

[features]
default = []
# Enables PyO3 bindings for cargo checks and local Rust tests.
python = ["dep:pyo3"]
# Enables Python extension-module linkage only for maturin wheel builds.
extension-module = ["pyo3/extension-module"]

[dependencies]
clap = { version = "4", features = ["derive"] }
csv = "1"
pyo3 = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = "2"
