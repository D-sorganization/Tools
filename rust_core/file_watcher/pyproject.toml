[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "file-watcher"
version = "0.1.0"
description = "Rust-compiled cross-platform file watcher with debouncing and gitignore filtering"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.maturin]
features = ["python", "extension-module"]
# Compiled module name MUST differ from the wrapper package
# `shared.python.file_watcher` to avoid a self-import (issue #3520).
module-name = "file_watcher_rs"
manifest-path = "Cargo.toml"
