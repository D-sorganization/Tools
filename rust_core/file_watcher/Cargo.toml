[package]
name = "file_watcher"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "file_watcher"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enables PyO3 bindings for cargo checks and local Rust tests.
python = ["dep:pyo3"]
# Enables Python extension-module linkage only for maturin wheel builds.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { workspace = true, optional = true }
notify = "6"
ignore = "0.4"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3"
