[package]
name = "tools-core"
description = "Shared simulation kernel: math primitives, physics solvers, and thermodynamic calculators"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# cdylib is required for PyO3 shared library output
# rlib is required for Rust-to-Rust dependencies and tests
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Enable PyO3 bindings for Python wheel builds (maturin)
# Enable PyO3 bindings for Python wheel builds (maturin)
python = ["dep:pyo3", "math-primitives/python"]
# Enable wasm-bindgen for WASM/NPM builds (wasm-pack)
wasm = ["dep:wasm-bindgen", "math-primitives/wasm"]

[dependencies]
pyo3 = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
serde = { workspace = true }
math-primitives = { path = "../math-primitives" }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }

[[bench]]
name = "math_benchmarks"
harness = false
