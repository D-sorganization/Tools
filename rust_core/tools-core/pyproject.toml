[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "tools-core"
version = "0.1.0"
description = "Rust-compiled simulation kernel: math primitives, physics solvers, and thermodynamic calculators"
readme = "../../docs/development/rust-setup.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.24",
]

[tool.maturin]
# Build with the 'python' feature gate to enable PyO3 bindings
features = ["python"]
# Module name matches the #[pymodule] name in lib.rs
module-name = "tools_core"
# Use the Cargo manifest relative to this pyproject.toml
manifest-path = "Cargo.toml"
