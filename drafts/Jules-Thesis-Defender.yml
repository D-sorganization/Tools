# DRAFT - Jules Thesis Defender Workflow
# DO NOT IMPLEMENT YET - Awaiting user approval
#
# Purpose: Analyze critiques and generate defensive arguments for AffineDrift theory
# Trigger: Manual or when new critique documents are added
# Based on: Repository_Management/assessments/thesis_defender_prompt.md
# Target Repo: AffineDrift

name: Jules Thesis Defender (Worker)

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      critique_path:
        description: 'Path to critique document(s) to analyze'
        required: false
        default: 'docs/critiques/'
        type: string
      output_mode:
        description: 'Output mode: full (detailed), summary (brief), table (structured)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - summary
          - table
  push:
    paths:
      - 'docs/critiques/**'
      - 'docs/reviews/**'
      - 'docs/objections/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  defend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Jules
        run: npm install -g @google/jules

      - name: Find Critique Documents
        id: find
        env:
          CRITIQUE_PATH: ${{ inputs.critique_path || 'docs/critiques/' }}
        run: |
          mkdir -p docs/critiques docs/defenses

          # Find all critique-related documents
          CRITIQUES=""
          for dir in docs/critiques docs/reviews docs/objections; do
            if [ -d "$dir" ]; then
              for file in "$dir"/*.md; do
                if [ -f "$file" ]; then
                  CRITIQUES="$CRITIQUES $file"
                fi
              done
            fi
          done

          if [ -z "$CRITIQUES" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::notice::No critique documents found"
          else
            echo "found=true" >> $GITHUB_OUTPUT
            echo "critiques=$CRITIQUES" >> $GITHUB_OUTPUT
            echo "Found critique documents:$CRITIQUES"
          fi

      - name: Jules Thesis Defender Analysis
        if: steps.find.outputs.found == 'true'
        env:
          JULES_TOKEN: ${{ secrets.JULES_API_KEY }}
          OUTPUT_MODE: ${{ inputs.output_mode || 'full' }}
        run: |
          jules auth --token $JULES_TOKEN

          DATE=$(date +%Y-%m-%d)

          jules task fix --prompt "$(cat << 'PROMPT_EOF'
          You are the THESIS DEFENDER agent for AffineDrift.

          ## Core Mandate
          Act like a skeptical, intelligent critic, then help preemptively defend against those critiques with precise counterarguments.

          ## Input Documents
          You will analyze critique documents in:
          - docs/critiques/
          - docs/reviews/
          - docs/objections/

          ## Analysis Process

          ### 1. ANALYZE
          For each critique, classify it as:
          - **Conceptual**: Challenges to core concepts or definitions
          - **Mathematical**: Issues with equations, derivations, or proofs
          - **Empirical**: Questions about evidence or experimental support
          - **Methodological**: Concerns about approach or methodology
          - **Philosophical**: Fundamental philosophical objections

          ### 2. IDENTIFY
          For each critique, identify:
          - Legitimate weaknesses (valid points that need addressing)
          - Misunderstandings (critic didn't understand the theory)
          - Category errors (applying wrong standards)
          - Unstated assumptions (implicit assumptions by critic)

          ### 3. PROPOSE DEFENSE
          For each valid concern, propose:
          - Clarifications (clearer explanations)
          - Added derivations (additional mathematical support)
          - Explicit assumptions (make implicit assumptions clear)
          - Boundary conditions (where theory does/doesn't apply)
          - Preemptive counterarguments (address before critic asks)

          ## Output Format

          ### Critique-Response Table
          Create docs/defenses/critique_response_table_$DATE.md:

          | Critique | Type | Validity | Response Summary | Injection Point |
          |----------|------|----------|------------------|-----------------|
          | [summary] | [type] | Valid/Partial/Invalid | [brief response] | [where to add defense] |

          ### Defense Paragraphs
          Create docs/defenses/defense_paragraphs_$DATE.md:
          - Paste-ready paragraphs for each defense
          - Organized by where they should be injected in the original work
          - Maintain scientific tone and rigor

          ### Summary Report
          Create docs/defenses/defense_report_$DATE.md:
          - Executive summary
          - Strongest critiques identified
          - Areas where theory could be strengthened
          - Recommendations for future work

          ## Critical Constraints
          - DO NOT become argumentative or dismissive
          - DO NOT over-defend weak points - acknowledge limits honestly
          - Preserve scientific tone and rigor
          - Be fair to critics - some points may be valid
          - Make the work resilient under expert scrutiny, NOT defensive or bloated

          ## Issue Creation
          For critiques that reveal genuine weaknesses:
          - Create GitHub Issue with label 'thesis-defense,needs-work'
          - Include specific recommendations

          PROMPT_EOF
          )"

      - name: Create Summary Issue
        if: steps.find.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)

          # Check if defense report was created
          if [ -f "docs/defenses/defense_report_$DATE.md" ]; then
            gh issue create \
              --title "Thesis Defense Analysis - $DATE" \
              --body "## Thesis Defense Analysis Complete

          The Thesis Defender has analyzed available critiques and generated defensive materials.

          ### Generated Documents
          - [Critique-Response Table](docs/defenses/critique_response_table_$DATE.md)
          - [Defense Paragraphs](docs/defenses/defense_paragraphs_$DATE.md)
          - [Full Report](docs/defenses/defense_report_$DATE.md)

          ### Next Steps
          1. Review the defense analysis
          2. Incorporate relevant defenses into main documents
          3. Address any legitimate weaknesses identified

          ---
          *Generated by Jules Thesis Defender*" \
              --label "jules:thesis-defender,tracking"
          fi

      - name: Update Defense Journal
        run: |
          mkdir -p .jules
          DATE=$(date +%Y-%m-%d)

          echo "## $DATE - Thesis Defense Run" >> .jules/thesis_defender.md
          echo "" >> .jules/thesis_defender.md

          if [ "${{ steps.find.outputs.found }}" == "true" ]; then
            echo "**Status**: ✅ Analysis complete" >> .jules/thesis_defender.md
            echo "**Critiques Processed**: See docs/defenses/" >> .jules/thesis_defender.md
          else
            echo "**Status**: ⏭️ Skipped - No critique documents found" >> .jules/thesis_defender.md
          fi

          echo "" >> .jules/thesis_defender.md

      - name: Commit Defense Materials
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(defense): thesis defense analysis $(date +%Y-%m-%d)"
          file_pattern: |
            docs/defenses/*.md
            .jules/*.md
