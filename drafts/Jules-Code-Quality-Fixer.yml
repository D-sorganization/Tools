# DRAFT - Jules Code Quality Fixer Workflow
# DO NOT IMPLEMENT YET - Awaiting user approval
#
# Purpose: Fix issues identified in code quality reviews, ensure CI/CD passes
# Trigger: Manual or after Code Quality Reviewer finds issues
# Based on: Repository_Management/assessments/fix_code_quality.md

name: Jules Code Quality Fixer (Worker)

on:
  workflow_call:
    inputs:
      assessment_file:
        description: 'Path to assessment file with issues to fix'
        required: false
        type: string
        default: 'docs/assessments/Code_Quality_Review_Latest.md'
  workflow_dispatch:
    inputs:
      assessment_file:
        description: 'Path to assessment file with issues to fix'
        required: false
        default: 'docs/assessments/Code_Quality_Review_Latest.md'
        type: string
      dry_run:
        description: 'Dry run - analyze only, do not make fixes'
        required: false
        default: 'false'
        type: boolean
      priority_only:
        description: 'Fix only Critical and High priority issues'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

# Only one fixer at a time per repo
concurrency:
  group: jules-code-quality-fixer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  fix-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt || echo "No requirements.txt found"
          pip install ruff black mypy || echo "Linters install failed"
          npm install -g @google/jules

      - name: Check Assessment File Exists
        id: check
        env:
          ASSESSMENT_FILE: ${{ inputs.assessment_file || 'docs/assessments/Code_Quality_Review_Latest.md' }}
        run: |
          if [ -f "$ASSESSMENT_FILE" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Assessment file found: $ASSESSMENT_FILE"
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "::warning::Assessment file not found: $ASSESSMENT_FILE"
          fi

      - name: Create Fix Branch
        if: steps.check.outputs.found == 'true' && inputs.dry_run != 'true'
        run: |
          BRANCH_NAME="jules/code-quality-fixes-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Jules Code Quality Fixer
        if: steps.check.outputs.found == 'true'
        env:
          JULES_TOKEN: ${{ secrets.JULES_API_KEY }}
          ASSESSMENT_FILE: ${{ inputs.assessment_file || 'docs/assessments/Code_Quality_Review_Latest.md' }}
          PRIORITY_ONLY: ${{ inputs.priority_only || 'true' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          jules auth --token $JULES_TOKEN

          DATE=$(date +%Y-%m-%d)

          jules task fix --prompt "$(cat << 'PROMPT_EOF'
          You are the CODE QUALITY FIXER agent.

          ## Your Mission
          Fix all issues identified in the code quality review located at: $ASSESSMENT_FILE

          ## Priority Order
          1. CRITICAL issues - Fix immediately
          2. HIGH priority issues - Fix next
          3. MEDIUM priority issues - Fix if time permits (skip if $PRIORITY_ONLY is true)
          4. LOW priority issues - Document for future (skip if $PRIORITY_ONLY is true)

          ## Fixing Guidelines
          - Fix the most critical issues first
          - Ensure ALL code passes CI/CD checks: ruff, black, mypy, codeql
          - DO NOT modify test assertions to make tests pass (that's CI/CD gaming)
          - DO NOT disable linting rules unless absolutely necessary
          - If disabling a rule, add inline comment explaining why

          ## CI/CD Verification
          After making fixes, run:
          ```bash
          ruff check . --fix
          black .
          mypy . --ignore-missing-imports || true
          ```

          ## Documentation Requirements
          For each fix:
          1. Document what was fixed
          2. Document why it was fixed
          3. Link to the original issue in the assessment

          For issues that CANNOT be fixed or are IGNORED:
          1. Provide detailed justification
          2. Document in docs/assessments/issues/ignored_issues.md
          3. Create GitHub Issue if it's a known limitation

          ## Output Files
          1. Update docs/assessments/issues/summary.md with fix status
          2. Create docs/assessments/issues/fix_report_$DATE.md with detailed changes

          ## Dry Run Mode
          If $DRY_RUN is 'true':
          - Analyze issues and propose fixes
          - DO NOT make any actual code changes
          - Document proposed fixes in fix_report_$DATE.md

          IMPORTANT: Quality over quantity. It's better to fix 3 issues correctly than 10 issues poorly.
          PROMPT_EOF
          )"

      - name: Run Linters
        if: steps.check.outputs.found == 'true' && inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          echo "Running ruff..."
          ruff check . --fix || true

          echo "Running black..."
          black . || true

          echo "Running mypy..."
          mypy . --ignore-missing-imports || true

      - name: Commit Fixes
        if: steps.check.outputs.found == 'true' && inputs.dry_run != 'true'
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "fix: code quality improvements from assessment review

          Fixes identified in: ${{ inputs.assessment_file }}

          Co-Authored-By: Jules <jules-bot@users.noreply.github.com>"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Push and Create PR
        if: env.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "$BRANCH_NAME"

          DATE=$(date +%Y-%m-%d)

          gh pr create \
            --title "Code Quality Fixes - $DATE" \
            --body "$(cat << 'EOF'
          ## Code Quality Fixes

          This PR addresses issues identified in the code quality review.

          ### Assessment Source
          - ${{ inputs.assessment_file }}

          ### Changes Made
          See commit messages for detailed changes.

          ### Verification
          - [ ] All CI/CD checks pass
          - [ ] No test assertions were modified
          - [ ] No linting rules were disabled without justification

          ### Documentation
          - See `docs/assessments/issues/fix_report_$DATE.md` for details

          ---
          *Generated by Jules Code Quality Fixer*
          EOF
          )" \
            --label "jules:code-quality,automated-fix"

      - name: Update Issues Tracking
        if: always() && steps.check.outputs.found == 'true'
        run: |
          mkdir -p docs/assessments/issues
          DATE=$(date +%Y-%m-%d)

          echo "## $DATE - Code Quality Fix Run" >> docs/assessments/issues/fix_history.md
          echo "" >> docs/assessments/issues/fix_history.md

          if [ "${{ env.HAS_CHANGES }}" == "true" ]; then
            echo "**Status**: ✅ Fixes applied" >> docs/assessments/issues/fix_history.md
            echo "**Branch**: ${{ env.BRANCH_NAME }}" >> docs/assessments/issues/fix_history.md
          else
            echo "**Status**: No changes needed or dry run" >> docs/assessments/issues/fix_history.md
          fi

          echo "" >> docs/assessments/issues/fix_history.md

      - name: Commit Tracking Updates
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(issues): update fix history"
          file_pattern: "docs/assessments/issues/*.md"
          branch: main
