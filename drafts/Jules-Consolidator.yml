# DRAFT - Jules Consolidator Workflow
# DO NOT IMPLEMENT YET - Awaiting user approval
#
# Purpose: Automate daily PR consolidation task
# Schedule: Every morning at 6 AM UTC (before user's workday)
# Trigger: Can also be manually triggered via workflow_dispatch

name: Jules Consolidator (Daily PR Merge)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - analyze only, do not create consolidated PR'
        required: false
        default: 'false'
        type: boolean
      exclude_prs:
        description: 'Comma-separated PR numbers to exclude'
        required: false
        default: ''
        type: string
  schedule:
    - cron: "0 6 * * 1-5"  # 6 AM UTC, Monday-Friday

# Prevent multiple consolidation runs
concurrency:
  group: jules-consolidator
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      pr_count: ${{ steps.list.outputs.count }}
      pr_list: ${{ steps.list.outputs.prs }}
      should_consolidate: ${{ steps.list.outputs.should_consolidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List Consolidatable PRs
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXCLUDE_PRS: ${{ inputs.exclude_prs }}
        run: |
          # Get open PRs targeting main, excluding WIP and blocked
          prs=$(gh pr list --base main --state open --json number,title,author,labels,reviewDecision,mergeable \
            --jq '[.[] | select(
              (.labels | map(.name) | contains(["wip"]) | not) and
              (.labels | map(.name) | contains(["do-not-consolidate"]) | not) and
              (.labels | map(.name) | contains(["blocked"]) | not) and
              (.mergeable != "CONFLICTING")
            )]')

          # Filter out manually excluded PRs
          if [ -n "$EXCLUDE_PRS" ]; then
            for num in $(echo $EXCLUDE_PRS | tr ',' ' '); do
              prs=$(echo "$prs" | jq --arg n "$num" '[.[] | select(.number != ($n | tonumber))]')
            done
          fi

          count=$(echo "$prs" | jq 'length')
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "prs=$(echo "$prs" | jq -c '.')" >> $GITHUB_OUTPUT

          if [ "$count" -gt 1 ]; then
            echo "should_consolidate=true" >> $GITHUB_OUTPUT
          else
            echo "should_consolidate=false" >> $GITHUB_OUTPUT
          fi

          echo "### PR Discovery Results" >> $GITHUB_STEP_SUMMARY
          echo "Found **$count** PRs eligible for consolidation" >> $GITHUB_STEP_SUMMARY
          echo "$prs" | jq -r '.[] | "- #\(.number): \(.title) (@\(.author.login))"' >> $GITHUB_STEP_SUMMARY

  consolidate:
    needs: discover
    if: needs.discover.outputs.should_consolidate == 'true' && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    outputs:
      consolidated_pr: ${{ steps.create_pr.outputs.pr_number }}
      excluded_prs: ${{ steps.merge.outputs.excluded }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "jules-bot"
          git config user.email "jules-bot@users.noreply.github.com"

      - name: Create Consolidation Branch
        run: |
          BRANCH_NAME="consolidated-prs-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH_NAME" origin/main
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Merge PRs
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LIST: ${{ needs.discover.outputs.pr_list }}
        run: |
          included=""
          excluded=""

          for row in $(echo "$PR_LIST" | jq -r '.[] | @base64'); do
            _jq() {
              echo ${row} | base64 --decode | jq -r ${1}
            }

            pr_num=$(_jq '.number')
            pr_title=$(_jq '.title')

            echo "Attempting to merge PR #$pr_num: $pr_title"

            # Fetch the PR branch
            if gh pr checkout "$pr_num" --detach 2>/dev/null; then
              git checkout "$BRANCH_NAME"

              # Try to merge
              if git merge FETCH_HEAD --no-edit -m "Merge PR #$pr_num: $pr_title"; then
                echo "✅ Successfully merged PR #$pr_num"
                included="$included $pr_num"
              else
                echo "❌ Conflict merging PR #$pr_num - excluding"
                git merge --abort
                excluded="$excluded $pr_num"
              fi
            else
              echo "❌ Could not fetch PR #$pr_num - excluding"
              excluded="$excluded $pr_num"
            fi
          done

          echo "included=$included" >> $GITHUB_OUTPUT
          echo "excluded=$excluded" >> $GITHUB_OUTPUT

      - name: Push Consolidation Branch
        run: |
          git push origin "$BRANCH_NAME"

      - name: Create Consolidated PR
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_LIST: ${{ needs.discover.outputs.pr_list }}
          INCLUDED: ${{ steps.merge.outputs.included }}
          EXCLUDED: ${{ steps.merge.outputs.excluded }}
        run: |
          DATE=$(date +%Y-%m-%d)

          # Build PR body
          BODY="## Daily Consolidation - $DATE

          ### Included PRs
          | PR | Title | Author |
          |----|-------|--------|"

          for num in $INCLUDED; do
            pr_info=$(echo "$PR_LIST" | jq -r ".[] | select(.number == $num)")
            title=$(echo "$pr_info" | jq -r '.title')
            author=$(echo "$pr_info" | jq -r '.author.login')
            BODY="$BODY
          | #$num | $title | @$author |"
          done

          if [ -n "$EXCLUDED" ]; then
            BODY="$BODY

          ### Excluded PRs (conflicts/errors)
          | PR | Reason |
          |----|--------|"
            for num in $EXCLUDED; do
              BODY="$BODY
          | #$num | Merge conflict |"
            done
          fi

          BODY="$BODY

          ---
          *Automated by Jules Consolidator*"

          # Create the PR
          pr_url=$(gh pr create \
            --title "Daily Consolidation - $DATE" \
            --body "$BODY" \
            --label "jules:consolidation" \
            --base main \
            --head "$BRANCH_NAME")

          pr_number=$(echo "$pr_url" | grep -oP '\d+$')
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT
          echo "Created consolidated PR: $pr_url"

  create-tracking-issue:
    needs: [discover, consolidate]
    if: always() && needs.discover.outputs.should_consolidate == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Create Tracking Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONSOLIDATED_PR: ${{ needs.consolidate.outputs.consolidated_pr }}
          PR_COUNT: ${{ needs.discover.outputs.pr_count }}
          EXCLUDED: ${{ needs.consolidate.outputs.excluded_prs }}
        run: |
          DATE=$(date +%Y-%m-%d)

          if [ -n "$CONSOLIDATED_PR" ]; then
            STATUS="✅ Complete"
            BODY="## Daily Consolidation Tracking - $DATE

          **Status**: $STATUS

          ### Consolidated PR
          - #$CONSOLIDATED_PR

          ### Summary
          - **PRs Processed**: $PR_COUNT
          - **Excluded**: $EXCLUDED

          This issue will be automatically closed when the consolidated PR is merged."
          else
            STATUS="❌ Failed"
            BODY="## Daily Consolidation Tracking - $DATE

          **Status**: $STATUS

          ### Summary
          - **PRs Found**: $PR_COUNT
          - **Result**: Consolidation failed - manual intervention required

          Please review the workflow logs for details."
          fi

          gh issue create \
            --title "Daily Consolidation - $DATE" \
            --body "$BODY" \
            --label "jules:consolidation,tracking"

  journal-entry:
    needs: [discover, consolidate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Consolidator Journal
        env:
          PR_COUNT: ${{ needs.discover.outputs.pr_count }}
          CONSOLIDATED_PR: ${{ needs.consolidate.outputs.consolidated_pr }}
        run: |
          mkdir -p .jules
          DATE=$(date +%Y-%m-%d)

          echo "## $DATE - Daily Consolidation" >> .jules/consolidator.md
          echo "" >> .jules/consolidator.md

          if [ "$PR_COUNT" -le 1 ]; then
            echo "**Status**: Skipped (only $PR_COUNT PR found)" >> .jules/consolidator.md
          elif [ -n "$CONSOLIDATED_PR" ]; then
            echo "**Status**: ✅ Success" >> .jules/consolidator.md
            echo "**Consolidated PR**: #$CONSOLIDATED_PR" >> .jules/consolidator.md
            echo "**PRs Processed**: $PR_COUNT" >> .jules/consolidator.md
          else
            echo "**Status**: ❌ Failed" >> .jules/consolidator.md
            echo "**PRs Found**: $PR_COUNT" >> .jules/consolidator.md
          fi

          echo "" >> .jules/consolidator.md

      - name: Commit Journal
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(consolidator): daily consolidation log"
          file_pattern: ".jules/consolidator.md"
