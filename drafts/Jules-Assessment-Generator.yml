# DRAFT - Jules Assessment Generator Workflow
# DO NOT IMPLEMENT YET - Awaiting user approval
#
# Purpose: Generate comprehensive assessments A-O based on assessment prompts, grade repo
# Schedule: Weekly on Sundays at 2 AM UTC
# Based on: Repository_Management/assessments/assessment_generation_tracking_prompt.md

name: Jules Assessment Generator (Worker)

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      full_regenerate:
        description: 'Force full regeneration of all assessments'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: "0 2 * * 0"  # Weekly on Sundays at 2 AM UTC

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  generate-assessments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt || echo "No requirements.txt found"
          npm install -g @google/jules

      - name: Archive Existing Assessments
        run: |
          mkdir -p docs/assessments/archive
          DATE=$(date +%Y-%m-%d)

          # Archive existing assessments (if any)
          for file in docs/assessments/Assessment_*.md; do
            if [ -f "$file" ]; then
              mv "$file" "docs/assessments/archive/$(basename "$file" .md)_archived_$DATE.md"
            fi
          done

          # Archive comprehensive assessment
          if [ -f "docs/assessments/Comprehensive_Assessment.md" ]; then
            mv "docs/assessments/Comprehensive_Assessment.md" \
               "docs/assessments/archive/Comprehensive_Assessment_archived_$DATE.md"
          fi

      - name: Jules Assessment Generation
        env:
          JULES_TOKEN: ${{ secrets.JULES_API_KEY }}
        run: |
          jules auth --token $JULES_TOKEN

          DATE=$(date +%Y-%m-%d)

          jules task fix --prompt "$(cat << 'PROMPT_EOF'
          You are the ASSESSMENT GENERATOR agent.

          ## Your Mission
          Review the repository against all assessment prompts in docs/assessments/prompts/ (or docs/assessments/).
          Generate comprehensive assessments and grade the repository.

          ## Assessment Categories (A-O)
          Generate individual assessments for each category found in the assessment prompts:
          - A: Code Structure & Organization
          - B: Documentation Quality
          - C: Test Coverage
          - D: Error Handling
          - E: Performance
          - F: Security
          - G: Dependencies Management
          - H: CI/CD Pipeline
          - I: Code Style & Consistency
          - J: API Design
          - K: Database/Data Handling
          - L: Logging & Monitoring
          - M: Configuration Management
          - N: Scalability
          - O: Maintainability

          ## Output Requirements

          ### Individual Assessments
          For each assessment category (A-O), create a file:
          `docs/assessments/Assessment_X_Category_Name_$DATE.md`

          Each assessment must include:
          1. **Grade**: 0-10 score
          2. **Summary**: Brief overview of findings
          3. **Strengths**: What the repo does well
          4. **Weaknesses**: Areas needing improvement
          5. **Recommendations**: Specific actionable items
          6. **Evidence**: Links to specific files/lines

          ### Comprehensive Assessment
          Create `docs/assessments/Comprehensive_Assessment_$DATE.md` with:
          1. Executive Summary
          2. Individual Assessment Summaries (grade table)
          3. Weighted Average Grade (calculate using these weights):
             - Code Quality (A, I, O): 25%
             - Testing (C): 15%
             - Documentation (B): 10%
             - Security (F): 15%
             - Performance (E, N): 15%
             - Operations (H, L, M): 10%
             - Design (J, K): 10%
          4. Priority Recommendations (top 5)
          5. Grade Trend (if historical data available)

          ## Quick Fixes
          If you encounter easy, non-breaking, safe fixes with HIGH confidence:
          - Make the fix
          - Document explicitly in the assessment
          - Mark as "AUTO-FIXED" in recommendations

          ## Issue Creation
          - For grades below 5: Create GitHub Issue with label 'jules:assessment,needs-attention'
          - Include specific recommendations in the issue

          IMPORTANT: Be objective and fair. Use evidence-based grading.
          PROMPT_EOF
          )"

      - name: Generate Grade Summary
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "## Repository Grade Card - $DATE" > docs/assessments/GRADE_CARD.md
          echo "" >> docs/assessments/GRADE_CARD.md
          echo "| Category | Grade | Status |" >> docs/assessments/GRADE_CARD.md
          echo "|----------|-------|--------|" >> docs/assessments/GRADE_CARD.md

          # This will be populated by Jules in the assessment files
          echo "*Grade card updated by assessment generator*" >> docs/assessments/GRADE_CARD.md

      - name: Commit Assessment Results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(assessment): weekly assessment generation $(date +%Y-%m-%d)"
          file_pattern: |
            docs/assessments/*.md
            docs/assessments/archive/*.md

      - name: Create Summary Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)

          gh issue create \
            --title "Weekly Assessment Report - $DATE" \
            --body "## Weekly Assessment Complete

          The automated assessment generator has completed its weekly review.

          ### View Results
          - [Comprehensive Assessment](docs/assessments/Comprehensive_Assessment_$DATE.md)
          - [Grade Card](docs/assessments/GRADE_CARD.md)

          ### Next Steps
          Review the assessment and address any items with grades below 7.

          ---
          *Generated by Jules Assessment Generator*" \
            --label "jules:assessment,tracking"
