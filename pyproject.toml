[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ud-tools"
version = "0.3.0"
description = "Shared engineering tools: URDF generation, signal processing, and process calculators."
readme = "src/shared/python/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "UpstreamDrift Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "defusedxml>=0.7.0",
]

[project.optional-dependencies]
# Full installation with all features
all = [
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "trimesh>=4.0.0",
    "mujoco>=3.0.0",
    "PyQt6>=6.5.0",
    "sympy>=1.12",
]
# URDF/Model generation only
urdf = [
    "trimesh>=4.0.0",
    "scipy>=1.10.0",
]
# Signal processing
signal = [
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "sympy>=1.12",
]
# Process calculators
process = [
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]
# Rotation converter / robotics kinematics
robotics = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]
# GUI components
gui = [
    "PyQt6>=6.5.0",
    "matplotlib>=3.7.0",
]
# Fleet-wide theme system (PyQt6 required for full features;
# color utilities work without Qt). See issue #551
theme = [
    "PyQt6>=6.5.0",
]
# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
urdf-gen = "model_generation.cli:main"

[project.urls]
Homepage = "https://github.com/D-sorganization/Tools"
Repository = "https://github.com/D-sorganization/Tools"

[tool.setuptools.packages.find]
where = ["src/shared/python", "src/python/src", "src"]
include = [
    "chat*",
    "notes*",
    "upstream_drift_tools*",
    "model_generation*",
    "humanoid_character_builder*",
    "signal_toolkit*",
    "rotation_converter*",
    "utils*",
    "tools*",
    "web_applications*",
]
exclude = [
    "*.tests*",
    "*tests*",
]

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]

[tool.ruff.lint.per-file-ignores]
"**/*.ipynb" = ["E402"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers"
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/node_modules/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
explicit_package_bases = true
