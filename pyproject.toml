[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ud-tools"
version = "0.3.0"
description = "Shared engineering tools: URDF generation, signal processing, and process calculators."
readme = "src/shared/python/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "UpstreamDrift Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "defusedxml>=0.7.0",
]

[project.optional-dependencies]
# Full installation with all features
all = [
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "trimesh>=4.0.0",
    "mujoco>=3.0.0",
    "PyQt6>=6.5.0",
    "sympy>=1.12",
]
# URDF/Model generation only
urdf = [
    "trimesh>=4.0.0",
    "scipy>=1.10.0",
]
# Signal processing
signal = [
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "sympy>=1.12",
]
# Process calculators
process = [
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
]
# Rotation converter / robotics kinematics
robotics = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]
# GUI components
gui = [
    "PyQt6>=6.5.0",
    "matplotlib>=3.7.0",
]
# Fleet-wide theme system (PyQt6 required for full features;
# color utilities work without Qt). See issue #551
theme = [
    "PyQt6>=6.5.0",
]
# P&ID generation
pid = [
    "ezdxf[draw]>=1.4.3",
]

# CAD geometry export (build123d pulls in its own matplotlib and PyQt6)
cad = [
    "build123d==0.10.0",
]
# DWSIM gasification model
dwsim = [
    "pythonnet>=3.0.0",
    "pydantic>=2.0.0",
]
# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.0.0",
    "pytest-benchmark>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
urdf-gen = "model_generation.cli:main"
generate-pid = "programmatic_pid.cli:main"
dwsim-model = "dwsim_model.__main__:main"

[project.urls]
Homepage = "https://github.com/D-sorganization/Tools"
Repository = "https://github.com/D-sorganization/Tools"

[tool.setuptools.packages.find]
where = ["src/shared/python", "src/python/src", "src"]
include = [
    "chat*",
    "notes*",
    "upstream_drift_tools*",
    "model_generation*",
    "humanoid_character_builder*",
    "signal_toolkit*",
    "rotation_converter*",
    "programmatic_pid*",
    "dwsim_model*",
    "utils*",
    "tools*",
    "web_applications*",
    "contracts*",
]
exclude = [
    "*.tests*",
    "*tests*",
]

# =============================================================================
# Pytest Configuration
# =============================================================================
[tool.ruff]
# Target Python 3.11 (matches CI environment)
target-version = "py311"
line-length = 88  # Matches Black standard (88 chars)

# Exclude generated code and standard noise
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".env",
    "node_modules",
    "*.ipynb",
    "**/*.json",
    "**/archive",
    "**/legacy",
    "replicants",
    # Exclude directories/files with syntax errors or intentional non-compliance
    "src/data_processing",
    "src/document_processing",
    "src/scientific_modeling",
    "src/tools/folder_tools",
    "src/tools/code_quality_check.py",
    "src/pendulum_simulator",
    "tests/data_processor",
    "python/src/tile_launcher/app_catalog.json",
    "python/tests",
]

[tool.ruff.lint]
# Enable specific rule sets:
# E = pycodestyle errors
# F = Pyflakes (Logic errors)
# W = pycodestyle warnings
# I = isort (Import sorting)
# B = flake8-bugbear (Catches likely bugs/traps)
# UP = pyupgrade (Modernizes old Python syntax)
select = ["E", "F", "W", "I", "B", "UP", "T20"]

# Ignore:
# D = pydocstyle (Doc-Scribe agent handles docstrings, not linted strictly here)
# FBT = flake8-boolean-trap (Boolean positional arguments - style preference, not critical)
# PT001 = pytest-fixture-incorrect-parentheses-style (Inconsistent between environments)
ignore = ["D", "FBT", "PT001"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
# Ignore "unused imports" in __init__.py files (common pattern)
# Also ignore E402 (module-level import not at top) for __init__.py files
# since version metadata assignments before imports are a standard Python pattern
"__init__.py" = ["F401", "E402"]
# Allow assertions in tests
"tests/*" = ["S101"]
"**/tests/*" = ["S101", "E402"]
"**/*.py" = ["E501"]
# Ignore boolean argument warnings in replicants
"replicants/**/*.py" = ["FBT001"]
# UP038 false positive: isinstance() requires tuple syntax, not union types
"**/Data_Processor_r0.py" = ["UP038"]
# Compatibility shims intentionally use version checks for older Python support
"tools/compatibility.py" = ["UP036", "UP017"]
# Scripts use print() for CLI output - this is intentional and correct
"scripts/**/*.py" = ["T201"]
"scripts/*.py" = ["T201"]
# verify_launcher.py is a CLI verification tool — print() is the correct output mechanism
"verify_launcher.py" = ["T201"]
# test_test_utils.py intentionally uses print() to test the captured_output() context manager
"tests/test_test_utils.py" = ["T201"]
# src/data_processing and src/pendulum_simulator are legacy directories excluded
# from ruff via [tool.ruff] exclude, but CI passes changed files directly to ruff
# (overriding exclude). Suppress the pre-existing violations in these directories.
"src/data_processing/**/*.py" = ["E402", "E501", "F811", "UP"]
"src/pendulum_simulator/**/*.py" = ["E402", "E501", "F811"]

[tool.ruff.lint.isort]
# Tells Ruff how to group your own code vs. libraries
known-first-party = ["src", "games", "tools"]

[tool.ruff.format]
# Make ruff-format produce identical output to black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra -q --strict-markers --strict-config --durations=20 --benchmark-disable -n auto --dist loadscope -m \"not live_simulation\""
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "live_simulation: marks tests requiring heavy physics engines or live simulation (deselect with '-m not live_simulation')",
    "performance: marks performance/benchmark tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/node_modules/*",
]

[tool.coverage.report]
fail_under = 40
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pass",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
explicit_package_bases = true
# Prevent CWD from creating phantom "src.*" namespace packages.
# With explicit_package_bases=true and both "src" and CWD as source roots,
# src/shared/python/__init__.py gets two module names ("shared.python" from
# the src MYPYPATH root and "src.shared.python" from CWD), causing a fatal
# "source file found twice" error.  Since src/ has no __init__.py, disabling
# namespace packages stops CWD from treating src/ as a namespace package.
namespace_packages = false

[[tool.mypy.overrides]]
module = "signal_toolkit.*"
ignore_errors = true
