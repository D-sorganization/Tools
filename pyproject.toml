[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upstream_drift_tools"
version = "0.1.0"
description = "A shared library of engineering tools and utilities."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src/shared/python"]
include = ["upstream_drift_tools*"]

[tool.ruff]
target-version = "py310"
select = ["E", "F", "B", "UP", "I"]
line-length = 88

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
files = "src/shared/python"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false 
