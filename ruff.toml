# Ruff configuration for aggressive code quality

target-version = "py311"
line-length = 100

# Exclude legacy code
exclude = [
    "archive/",
    "legacy/",
    "experimental/",
    "*/migrations/",
    "*_pb2.py",
    "matlab/",
    "output/",
]

[lint]
# Enable ALL rules then selectively disable
select = ["ALL"]
ignore = [
    "D",      # Docstring checks (we check separately)
    "COM812", # Missing trailing comma (conflicts with black)
    "ISC001", # Single line implicit string concat
    "S101",   # Use of assert (allowed in tests)
    "T201",   # Print statements (allowed in scripts)
    "BLE001", # Blind exception catching (too many to fix now)
    "G004",   # F-string logging (too many to fix now)
    "DTZ005", # datetime.now() without tz (too many to fix now)
    "DTZ006", # datetime.fromtimestamp() without tz (too many to fix now)
    "ANN201", # Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN204", # Missing return type annotation for __init__
    "ANN001", # Missing type annotation for function argument
    "INP001", # Missing __init__.py (intentional namespace packages)
    "ICN003", # Banned import from typing (needed for some cases)
    "S603",   # Subprocess call (build scripts need this)
    "C901",   # Too complex (refactoring needed)
    "PLR0911", # Too many return statements (refactoring needed)
    "PLR0912", # Too many branches (refactoring needed)
    "PLR0915", # Too many statements (refactoring needed)
]

# Stricter than defaults
fixable = ["ALL"]
unfixable = []

# Flake8 settings
flake8-quotes = {inline-quotes = "double", multiline-quotes = "double", docstring-quotes = "double"}
flake8-import-conventions = {banned-from = ["typing"]}
flake8-tidy-imports = {banned-module-level-imports = ["numpy", "pandas"]}

# Complexity settings
mccabe = {max-complexity = 10}
pylint = {max-args = 5, max-branches = 10, max-returns = 3, max-statements = 30}