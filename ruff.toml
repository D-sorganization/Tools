# Ruff configuration for aggressive code quality

target-version = "py311"
line-length = 100

# Exclude legacy code
exclude = [
    "archive/",
    "legacy/",
    "experimental/",
    "*/migrations/",
    "*_pb2.py",
    "matlab/",
    "output/",
]

[lint]
# Enable ALL rules then selectively disable
select = ["ALL"]
ignore = [
    "D",      # Docstring checks (we check separately)
    "COM812", # Missing trailing comma (conflicts with black)
    "ISC001", # Single line implicit string concat
    "S101",   # Use of assert (allowed in tests)
    "T201",   # Print statements (allowed in scripts)
    "BLE001", # Blind exception catching (too many to fix now)
    "G004",   # F-string logging (too many to fix now)
    "DTZ005", # datetime.now() without tz (too many to fix now)
    "DTZ006", # datetime.fromtimestamp() without tz (too many to fix now)
    "ANN201", # Missing return type annotation for public function
    "ANN202", # Missing return type annotation for private function
    "ANN204", # Missing return type annotation for __init__
    "ANN001", # Missing type annotation for function argument
    "INP001", # Missing __init__.py (intentional namespace packages)
    "ICN003", # Banned import from typing (needed for some cases)
    "S603",   # Subprocess call (build scripts need this)
    "C901",   # Too complex (refactoring needed)
    "PLR0911", # Too many return statements (refactoring needed)
    "PLR0912", # Too many branches (refactoring needed)
    "PLR0915", # Too many statements (refactoring needed)
    "TRY400",  # Use logging.exception (too many to fix now)
    "SIM117",  # Multiple with statements (readability)
    "NPY002",  # Legacy numpy random (intentional)
    "PLR2004", # Magic numbers in tests (allowed)
    "RET505",  # Superfluous else return (readability)
    "RET507",  # Superfluous else continue (readability)
    "TRY300",  # Try consider else (readability)
    "TRY004",  # Type check without type error (readability)
    "SIM102",  # Collapsible if (readability)
    "SIM108",  # If-else block instead of if-exp (readability)
    "SIM113",  # Enumerate for loop (readability)
    "PTH103",  # os.makedirs (pathlib preferred but acceptable)
    "PTH120",  # os.path.dirname (pathlib preferred but acceptable)
    "PTH122",  # os.path.splitext (pathlib preferred but acceptable)
    "PTH100",  # os.path.abspath (pathlib preferred but acceptable)
    "PTH204",  # os.path.getmtime (pathlib preferred but acceptable)
    "RUF001",  # Ambiguous unicode character (emoji in strings)
    "S606",    # Start process with no shell (build scripts)
    "FBT003",  # Boolean positional value (API compatibility)
    "ARG002",  # Unused method argument (API compatibility)
    "ARG001",  # Unused function argument (API compatibility)
    "ARG005",  # Unused lambda argument (API compatibility)
    "ANN206",  # Missing return type class method (too many to fix)
    "S110",    # Try-except-pass (intentional)
    "FBT001",  # Boolean type hint positional (API compatibility)
    "FBT002",  # Boolean default value positional (API compatibility)
    "PIE810",  # Multiple starts/ends with (readability)
    "SLF001",  # Private member access (intentional)
    "PERF401", # Manual list comprehension (readability)
    "UP038",   # Non-pep604 isinstance (readability)
]

# Stricter than defaults
fixable = ["ALL"]
unfixable = []

# Flake8 settings
flake8-quotes = {inline-quotes = "double", multiline-quotes = "double", docstring-quotes = "double"}
flake8-import-conventions = {banned-from = ["typing"]}
flake8-tidy-imports = {banned-module-level-imports = ["numpy", "pandas"]}

# Complexity settings
mccabe = {max-complexity = 10}
pylint = {max-args = 5, max-branches = 10, max-returns = 3, max-statements = 30}

[lint.per-file-ignores]
# Tests can be more relaxed
"test_*.py" = [
    "S101",   # Use of assert
    "PLR2004", # Magic numbers allowed in tests
]
"**/tests/*.py" = [
    "S101",
    "PLR2004",
]
"**/test_*.py" = [
    "S101",
    "PLR2004",
]
# Build scripts - allow prints and subprocess
"**/build_exe.py" = [
    "T201",   # Print statements
    "S603",   # Subprocess calls
    "ANN201", # Missing return type annotations
]
# Quality check scripts - allow complexity
"quality_check_script.py" = [
    "C901",   # Too complex (intentional)
    "PLR0911", # Too many return statements (intentional)
    "PLR0915", # Too many statements (intentional)
]
"tools/matlab_utilities/scripts/matlab_quality_check.py" = [
    "PLR0911", # Too many return statements (intentional)
    "S603",   # Subprocess calls needed
]