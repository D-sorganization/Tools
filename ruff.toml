# ruff.toml
# Configuration for the Ruff linter
# Matches standards defined in ci-standard.yml

# Target Python 3.11 (matches your CI environment)
target-version = "py311"
line-length = 88  # Matches Black standard (88 chars)

# Exclude generated code and standard noise
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".env",
    "node_modules",
    "**/*.json",
    "**/archive",
    "**/legacy",
    "replicants",
    # Exclude directories/files with syntax errors or intentional non-compliance
    "src/document_processing",
    "src/scientific_modeling",
    "src/tools/folder_tools",
    "src/tools/code_quality_check.py",
    "src/pendulum_simulator",
    # Vendored self-contained sub-app (migrated from D-sorganization/Movement_Optimizer,
    # which is archived in favour of this copy — see Tools#3407). Carries its own
    # quality bar (ruff line-length 100) and CI history; linted in its origin repo.
    "src/movement_optimizer",
    "tests/data_processor",
    "python/tests",
]

[lint]
# Enable specific rule sets:
# E = pycodestyle errors
# F = Pyflakes (Logic errors)
# W = pycodestyle warnings
# I = isort (Import sorting)
# B = flake8-bugbear (Catches likely bugs/traps)
# UP = pyupgrade (Modernizes old Python syntax)
# T201 = print() detection (src/ must use logging, not print)
select = ["E", "F", "W", "I", "B", "UP", "T201"]

# Ignore:
# D = pydocstyle (We let the 'Doc-Scribe' agent handle docstrings, so we don't lint them strictly here)
# FBT = flake8-boolean-trap (Boolean positional arguments - style preference, not critical)
# PT001 = pytest-fixture-incorrect-parentheses-style (Inconsistent between environments)
ignore = ["D", "FBT", "PT001"]

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Ignore "unused imports" in __init__.py files (common pattern)
"__init__.py" = ["F401"]
# Allow assertions in tests; allow print() in tests that explicitly test stdout capture
"tests/*" = ["S101"]
"**/tests/*" = ["S101", "E402"]
"tests/test_test_utils.py" = ["T201"]
# Ignore boolean argument warnings in replicants
"replicants/**/*.py" = ["FBT001"]
# UP038 false positive: isinstance() requires tuple syntax, not union types
"**/Data_Processor_r0.py" = ["UP038"]
# Compatibility shims intentionally use version checks for older Python support
"tools/compatibility.py" = ["UP036", "UP017"]
# Benchmark scripts use print() for CLI progress output and summary tables.
# E501 suppressed: long unit-description strings in metadata dicts.
# B023 suppressed: loop-variable capture in lambdas is intentional (called
# immediately inside the loop via _median_seconds).
"benchmarks/*.py" = ["T201", "E501", "B023", "F401", "UP035"]
# Scripts use print() for CLI output — this is intentional and correct.
# E501 also suppressed: scripts contain long embedded code templates and
# generated assessment text that cannot be reformatted without losing meaning.
"scripts/**/*.py" = ["T201", "E501"]
"scripts/*.py" = ["T201", "E501"]
# Root-level launcher and utility scripts use print() for CLI output
"launch.py" = ["T201"]
"verify_launcher.py" = ["T201"]
# codemap CLI / watcher / MCP server print to stdout/stderr by design.
"src/shared/python/codemap/cli.py" = ["T201"]
"src/shared/python/codemap/watcher.py" = ["T201"]
"src/shared/python/codemap/mcp_server.py" = ["T201"]
