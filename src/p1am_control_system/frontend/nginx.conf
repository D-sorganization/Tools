server {
    listen 3002;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy REST API and WebSocket stream to the FastAPI backend container.
    #
    # The backend binds 0.0.0.0 inside its container (see backend/Dockerfile) so
    # this proxy_pass resolves; the network boundary is drawn by compose, which
    # publishes the backend only on the host's loopback.
    #
    # Origin is forwarded verbatim on purpose: the backend's request guard
    # refuses a state-changing request whose Origin is outside the CORS
    # allowlist, and rewriting it here would defeat that (#4037).
    location /api {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        # Record the real client for the audit trail's benefit. NOTE: the
        # backend deliberately audits the transport peer, which cannot be
        # spoofed; these headers are for nginx-side log correlation.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }
}
