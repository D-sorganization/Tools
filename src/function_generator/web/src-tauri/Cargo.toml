[package]
name = "function-generator"
version = "1.0.0"
description = "Waveform Function Generator with Frequency Analysis"
authors = ["Tools Repository"]
license = "MIT"
repository = "https://github.com/your-org/Tools"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "function_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "^2", features = [] }
tauri-plugin-log = "2"

[workspace]
