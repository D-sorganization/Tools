[package]
name = "rotation-converter"
version = "1.0.0"
description = "Rotation Converter desktop wrapper"
authors = ["Tools Repository"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rotation_converter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "^2", features = [] }
tauri-plugin-log = "2"
