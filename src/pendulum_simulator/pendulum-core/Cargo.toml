[package]
name = "pendulum-core"
version = "0.2.0"
edition = "2021"
description = "Shared physics kernel for pendulum golf swing simulator"

[lib]
name = "pendulum_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = "0.33"
serde = { version = "1", features = ["derive"], optional = true }
rayon = { version = "1.10", optional = true }

[dependencies.pyo3]
version = "0.24.1"
features = ["extension-module"]
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[features]
default = ["parallel"]
python = ["pyo3", "parallel"]
wasm = ["wasm-bindgen", "js-sys"]
serde = ["dep:serde"]
parallel = ["rayon"]

[workspace]

