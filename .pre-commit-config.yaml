# =============================================================================
# Pre-commit Configuration - Fast Checks Only
# =============================================================================
# These hooks run on EVERY commit and must complete in <15 seconds.
# Slower checks (mypy, tests) run in pre-push hooks.
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type pre-push
#
# Manual run:
#   pre-commit run --all-files
# =============================================================================

repos:
  # -------------------------------------------------------------------------
  # Stage 1: Code Formatting (auto-fix)
  # -------------------------------------------------------------------------

  # Ruff - Fast Python linter with auto-fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "ruff (lint + fix)"
        args: ["--fix", "--exit-non-zero-on-fix"]
        types: [python]

      - id: ruff-format
        name: "ruff format"
        types: [python]

  # Black - Python code formatter (backup for ruff-format edge cases)
  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        name: "black (format)"
        language_version: python3.12

  # -------------------------------------------------------------------------
  # Stage 2: Quick Quality Checks
  # -------------------------------------------------------------------------

  # Local quality checks
  - repo: local
    hooks:
      # Prevent wildcard imports (bad practice)
      - id: no-wildcard-imports
        name: "no wildcard imports"
        entry: "from .* import \\*"
        language: pygrep
        types: [python]
        exclude: ^(archive/|legacy/|experimental/|tests/)

      # Quality check - no TODOs, FIXMEs, placeholders
      - id: quality-check
        name: "quality check (no placeholders)"
        entry: python scripts/tools/code_quality_check.py
        language: python
        pass_filenames: true
        types: [python]
        exclude: ^(archive/|legacy/|experimental/|scripts/tools/code_quality_check\.py)

      # Check for debug statements
      - id: no-debug-statements
        name: "no debug statements"
        entry: "(?:^|\\s)(breakpoint\\(|import pdb|pdb\\.set_trace)"
        language: pygrep
        types: [python]
        exclude: ^(tests/|archive/|legacy/)

  # -------------------------------------------------------------------------
  # Stage 3: Config File Formatting
  # -------------------------------------------------------------------------

  # Prettier - Format YAML, JSON, Markdown
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: "prettier (yaml/json/md)"
        types_or: [yaml, markdown, json]
        exclude: '(\.py|\.m|package-lock\.json|\.ipynb)$'

  # -------------------------------------------------------------------------
  # Stage 4: Pre-push Hooks (Slower - only run before push)
  # -------------------------------------------------------------------------

  # MyPy - Type checking (pre-push only)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: "mypy (type check)"
        stages: [pre-push]
        additional_dependencies:
          - types-requests
          - types-PyYAML
        args: [--config-file=pyproject.toml, --ignore-missing-imports]
        files: ^src/
        exclude: |
          (?x)^(
            archive/|
            legacy/|
            experimental/|
            __pycache__/|
            \.pytest_cache/|
            \.venv/
          )

  # Bandit - Security scanning (pre-push only)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        name: "bandit (security scan)"
        stages: [pre-push]
        args: ["-r", "src/", "-ll", "-ii", "-x", "tests/,archive/,legacy/"]
        pass_filenames: false

  # Pytest - Unit tests (pre-push only)
  - repo: local
    hooks:
      - id: pytest-unit
        name: "pytest (unit tests)"
        stages: [pre-push]
        entry: python -m pytest tests/ -x -q --tb=short -m "not slow and not integration"
        language: system
        pass_filenames: false
        always_run: true

# =============================================================================
# Global Settings
# =============================================================================

default_language_version:
  python: python3.12

# Files to always exclude from all hooks
exclude: |
  (?x)^(
    archive/|
    legacy/|
    experimental/|
    replicants/|
    \.git/|
    __pycache__/|
    \.mypy_cache/|
    \.ruff_cache/|
    \.pytest_cache/|
    node_modules/|
    \.venv/|
    venv/|
    build/|
    dist/|
    .*\.egg-info/
  )

# Fail fast - stop on first failure
fail_fast: false

# CI configuration
ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: "main"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  skip: [pytest-unit] # Skip tests in CI (they run in dedicated workflow)
