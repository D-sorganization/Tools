repos:
  # Python formatters
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # Python linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix", "--select", "E,F,W,I,B,UP", "--ignore", "D"]

  # Type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: ["types-requests", "types-PyYAML"]
        args: [--config-file=mypy.ini, --ignore-missing-imports]
        exclude: |
          (?x)^(
            archive/|
            legacy/|
            experimental/|
            \.git/|
            __pycache__/|
            \.pytest_cache/|
            \.venv/|
            venv/
          )

  # Security audit
  - repo: https://github.com/pypa/pip-audit
    rev: v2.7.3
    hooks:
      - id: pip-audit
        args: ["-r", "requirements.txt"]

  # Local quality checks
  - repo: local
    hooks:
      # Main quality gate
      - id: quality-check
        name: Quality check (no placeholders/magic numbers)
        entry: python tools/code_quality_check.py
        language: python
        pass_filenames: false
        always_run: true
        additional_dependencies: []

  # Infrastructure formatter (YAML, JSON, MD)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        # Only target the files we care about
        types_or: [yaml, markdown, json, css, javascript]
        # explicitly exclude python/matlab just in case
        exclude: '\.(py|m)$'

# Global settings
default_language_version:
  python: python3.12

# Files to always exclude
exclude: '^(archive/|legacy/|experimental/|replicants/|\.git/)'
