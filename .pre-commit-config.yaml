# =============================================================================
# Fleet-Wide Pre-commit Configuration
# =============================================================================
# Fast checks on every commit (<15 seconds)
# Slower checks (mypy, bandit, tests) on pre-push only
#
# EXCEPTIONS:
# - Documentation-only changes (.md, .rst) skip Python checks
# - Workflow changes (.github/) skip Python checks
# - Config changes (.yml, .yaml, .json) only run prettier
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type pre-push
# =============================================================================

repos:
  # -------------------------------------------------------------------------
  # Stage 1: Code Formatting (auto-fix) - PYTHON FILES ONLY
  # -------------------------------------------------------------------------

  # Ruff - Fast Python linter with auto-fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "ruff (lint + fix)"
        args: ["--fix", "--exit-non-zero-on-fix"]
        types: [python]
        # Exclude directories that are also excluded in pyproject.toml [tool.ruff].
        # Pre-commit passes files directly (bypassing ruff's own exclude), so we must mirror here.
        exclude: ^(\.github/|docs/|.*\.md$|src/data_processing/|src/document_processing/|src/pendulum_simulator/|src/scientific_modeling/|src/tools/folder_tools/)

      - id: ruff-format
        name: "ruff format"
        types: [python]
        exclude: ^(\.github/|docs/|.*\.md$|src/data_processing/|src/document_processing/|src/pendulum_simulator/|src/scientific_modeling/|src/tools/folder_tools/)

  # Black removed: ruff-format is the canonical Python formatter.
  # Both ruff-format and black conflict on parenthesized assert style —
  # keeping both causes an infinite formatter loop in pre-commit.

  # -------------------------------------------------------------------------
  # Stage 2: Quick Quality Checks - PYTHON FILES ONLY
  # -------------------------------------------------------------------------

  - repo: local
    hooks:
      # Prevent wildcard imports
      - id: no-wildcard-imports
        name: "no wildcard imports"
        entry: "from .* import \\*"
        language: pygrep
        types: [python]
        exclude: ^(archive/|legacy/|experimental/|tests/|\.github/)

      # Check for debug statements
      - id: no-debug-statements
        name: "no debug statements"
        entry: "(?:^|\\s)(breakpoint\\(|import pdb|pdb\\.set_trace)"
        language: pygrep
        types: [python]
        exclude: ^(tests/|archive/|legacy/|\.github/)

      # Check for print statements in src (should use logging)
      - id: no-print-in-src
        name: "no print() in src (use logging)"
        entry: "^\\s*print\\("
        language: pygrep
        files: ^src/
        exclude: ^(src/.*/__main__\.py|tests/|\.github/)

  # -------------------------------------------------------------------------
  # Stage 3: Config File Formatting - ALWAYS RUNS
  # -------------------------------------------------------------------------

  # Prettier - Format YAML, JSON, Markdown (lightweight, always runs)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: "prettier (yaml/json/md)"
        types_or: [yaml, markdown, json]
        exclude: '(\.py|\.m|package-lock\.json|\.ipynb)$'

  # -------------------------------------------------------------------------
  # Stage 4: Pre-push Hooks (Slower - PYTHON FILES ONLY)
  # -------------------------------------------------------------------------

  # MyPy - Type checking (pre-push only, Python only)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: "mypy (type check)"
        stages: [pre-push]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic
        args: [--ignore-missing-imports]
        types: [python]
        files: ^src/
        exclude: |
          (?x)^(
            src/matlab/|
            src/javascript/|
            src/archive/|
            src/legacy/|
            src/experimental/|
            __pycache__/|
            \.pytest_cache/|
            \.venv/|
            \.github/|
            .*/tests/|
            src/shared/python/dwsim_model/|
            src/dwsim_model/|
            src/shared/python/upstream_drift_tools/|
            src/shared/python/model_generation/|
            src/shared/python/signal_toolkit/|
            src/shared/python/programmatic_pid/|
            src/electrode_advisor/|
            src/function_generator/|
            src/data_processing/data_processor/|
            src/glass_bath_fea/|
            src/tools/folder_tools/|
            src/pendulum_simulator/|
            src/shared/python/theme/|
            src/folder_tool/|
            src/folder_packer_pro/|
            src/solar_system_model/|
            src/optimizer_gui/|
            src/humanoid_builder_gui/|
            src/rrt_path_planner/|
            src/rotation_converter/screw_visualization\.py
          )

  # Bandit - Security scanning (pre-push only, Python only)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        name: "bandit (security scan)"
        stages: [pre-push]
        # Run on changed Python src/ files only (mirrors CI behavior).
        # Previously used pass_filenames: false + -r . which scanned the
        # entire repo on every push and blocked due to pre-existing findings.
        args: ["-ll", "-ii"]
        files: ^src/
        exclude: |
          (?x)^(
            src/matlab/|
            src/javascript/|
            src/archive/|
            src/legacy/|
            src/experimental/|
            .*/tests/|
            src/shared/python/upstream_drift_tools/|
            src/shared/python/model_generation/|
            src/data_processing/data_processor/|
            src/glass_bath_fea/
          )
        types: [python]

  # Pytest - Unit tests (pre-push only)
  - repo: local
    hooks:
      - id: pytest-unit
        name: "pytest (unit tests)"
        stages: [pre-push]
        entry: python3 -m pytest tests/unit -x -q --tb=short -m "not slow and not integration"
        language: system
        pass_filenames: false
        # Only run if Python files changed
        types: [python]

# =============================================================================
# Global Settings
# =============================================================================

default_language_version:
  python: python3.11

# Files to always exclude from all hooks
exclude: |
  (?x)^(
    archive/|
    legacy/|
    experimental/|
    \.git/|
    __pycache__/|
    \.mypy_cache/|
    \.ruff_cache/|
    \.pytest_cache/|
    node_modules/|
    \.venv/|
    venv/|
    build/|
    dist/|
    .*\.egg-info/
  )

# Don't fail fast - run all hooks
fail_fast: false

# CI configuration (for pre-commit.ci if used)
ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: "main"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  skip: [pytest-unit, bandit, mypy] # Skip slow hooks in CI
