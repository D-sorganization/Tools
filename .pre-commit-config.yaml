# =============================================================================
# Fleet-Wide Pre-commit Configuration
# =============================================================================
# Fast checks on every commit (<15 seconds)
# Slower checks (mypy, bandit, tests, dependency audit) on pre-push only
#
# This is the central source of truth for fleet hook behavior. Repo-local
# .pre-commit-config.yaml files may add language-specific checks, but should keep
# this contract: pre-commit catches cheap deterministic drift; pre-push catches
# bounded local confidence; CI owns matrix/container/integration/deployment work.
#
# EXCEPTIONS:
# - Documentation-only changes (.md, .rst) skip Python checks
# - Workflow changes (.github/) skip Python checks
# - Config changes (.yml, .yaml, .json) only run prettier
#
# Installation:
#   pip install pre-commit
#   pre-commit install
#   pre-commit install --hook-type pre-push
# =============================================================================

repos:
  # -------------------------------------------------------------------------
  # Stage 1: Code Formatting (auto-fix) - PYTHON FILES ONLY
  # -------------------------------------------------------------------------

  # Ruff - Fast Python linter with auto-fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "ruff (lint + fix)"
        args: ["--fix", "--exit-non-zero-on-fix"]
        types: [python]
        # Skip for docs-only or workflow-only changes
        exclude: ^(\.github/|docs/|.*\.md$|shared_scripts/)

      - id: ruff-format
        name: "ruff format"
        types: [python]
        exclude: ^(\.github/|docs/|.*\.md$|shared_scripts/)

  # -------------------------------------------------------------------------
  # Stage 2: Quick Quality Checks - PYTHON FILES ONLY
  # -------------------------------------------------------------------------

  - repo: local
    hooks:
      # Prevent wildcard imports
      - id: no-wildcard-imports
        name: "no wildcard imports"
        entry: "from .* import \\*"
        language: pygrep
        types: [python]
        exclude: ^(archive/|legacy/|experimental/|tests/|\.github/)

      # Check for debug statements
      - id: no-debug-statements
        name: "no debug statements"
        entry: "(?:^|\\s)(breakpoint\\(|import pdb|pdb\\.set_trace)"
        language: pygrep
        types: [python]
        exclude: ^(tests/|archive/|legacy/|\.github/)

      # Check for print statements in src (should use logging)
      - id: no-print-in-src
        name: "no print() in src (use logging)"
        entry: "^\\s*print\\("
        language: pygrep
        files: ^src/
        types: [python]
        exclude: ^(src/.*/__main__\.py|tests/|\.github/)

      - id: fleet-fast-guardrails
        name: "fleet fast guardrails"
        entry: python shared_scripts/fleet_hooks.py fast
        language: python
        pass_filenames: false
        always_run: true

      - id: design-manual-governance
        name: "engineering design-manual governance"
        entry: python -m scripts.check_design_manual_governance
        language: system
        pass_filenames: false
        files: ^(manuals/tools/|config/design_manual_governance\.json$|scripts/(check_design_manual_governance|design_manual_contract|tools_exemplar_contract|tools_module_inventory_contract|tools_textbook_chapter_contract|tools_textbook_chapter_lint)\.py$|AGENTS\.md$|CLAUDE\.md$|SPEC\.md$|AGENT_HANDOFF\.md$)

      - id: tools-textbook-chapter-contract
        name: "Tools textbook chapter contract"
        entry: python -m scripts.lint_tools_textbook_chapters
        language: system
        pass_filenames: false
        files: ^(manuals/tools/|config/design_manual_governance\.json$|scripts/(lint_tools_textbook_chapters|tools_textbook_chapter_contract|tools_textbook_chapter_lint)\.py$|tests/architecture/test_tools_textbook_chapter_contract\.py$)

      # Companion to the module-inventory-regen git merge driver (#4818):
      # the driver stops a merge from halting on conflict markers in the
      # generated inventory, but only runs while the merge is still being
      # computed, before git has necessarily finished writing every other
      # path to the working tree -- so its regeneration can still be
      # stale. `pre-merge-commit` (a distinct git hook from `pre-commit`;
      # plain `pre-commit` does NOT fire for merge commits, confirmed
      # empirically) fires right before the merge commit is created, once
      # the full merged tree is actually checked out on disk, which is
      # what scripts/build_tools_module_inventory.py needs to produce a
      # correct result. Needs `pre-commit install --hook-type
      # pre-merge-commit` in addition to the default install (both are
      # already wired into scripts/setup_precommit.sh and
      # scripts/setup_hooks.py). See
      # scripts/git/regenerate_module_inventory_during_merge.py.
      - id: regenerate-module-inventory-during-merge
        name: "Tools module inventory merge fixup"
        entry: python -m scripts.git.regenerate_module_inventory_during_merge
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit]

      - id: tools-module-inventory-freshness
        name: "Tools module inventory freshness"
        entry: python -m scripts.build_tools_module_inventory --check
        language: system
        pass_filenames: false
        files: ^(src/|rust_core/|scripts/|shared_scripts/|schemas/|config/|manuals/tools/(manifests/module-inventory\.json|schemas/module-inventory\.schema\.json)$|tests/architecture/test_tools_module_inventory_contract\.py$)

      - id: tools-exemplar-contract
        name: "Tools governed exemplar traceability"
        entry: python -m scripts.check_tools_exemplars
        language: system
        pass_filenames: false
        files: ^(manuals/tools/|config/design_manual_governance\.json$|scripts/(check_tools_exemplars|tools_exemplar_contract)\.py$|tests/architecture/test_tools_exemplar_manuals_contract\.py$|src/shared/python/swing_sim/impact/dplane\.py$|src/rate_of_closure/simulation/impact_kinematics\.py$|tests/rate_of_closure/test_impact_kinematics\.py$)

      - id: tools-manual-artifact-freshness
        name: "Tools manual artifact freshness and semantics"
        entry: python -m scripts.render_tools_design_manual --check
        language: system
        pass_filenames: false
        files: ^(manuals/tools/|config/design_manual_governance\.json$|scripts/(render_tools_design_manual|tools_manual_artifacts|tools_manual_renderer_contract)\.py$|tests/architecture/test_tools_manual_renderer_contract\.py$)

      - id: tracked-text-normalization
        name: "tracked LF blob normalization"
        entry: python scripts/check_tracked_text_normalization.py
        language: system
        pass_filenames: false
        always_run: true

      - id: root-allowlist
        name: "tracked top-level entry allowlist"
        entry: python scripts/check_root_allowlist.py
        language: system
        pass_filenames: false
        always_run: true

      - id: fleet-spec-freshness-warning
        name: "SPEC.md freshness warning"
        entry: python shared_scripts/fleet_hooks.py spec-freshness --warn-only
        language: python
        pass_filenames: false
        always_run: true

      # PR-keyed SPEC.md change-log rows (Repository_Management#1520). Fails
      # closed: a serial version in the key column, a reused PR key, or a
      # SPEC.md edit alongside source changes that adds no row. Degrades to a
      # warning if shared_scripts/spec_changelog.py is ever absent, so a
      # partial fleet rollout cannot block a commit.
      - id: fleet-spec-changelog
        name: "SPEC.md change-log rows (PR-keyed)"
        entry: python shared_scripts/fleet_hooks.py spec-changelog
        language: python
        pass_filenames: false
        always_run: true

      - id: code-quality-check-report
        name: "code quality check (report-only)"
        entry: python scripts/quality-check.py --report-only
        language: system
        types: [python]
        exclude: ^(archive/|legacy/|experimental/|\.github/)

  # -------------------------------------------------------------------------
  # Stage 3: Config File Formatting - ALWAYS RUNS
  # -------------------------------------------------------------------------

  # Prettier - Format YAML, JSON, Markdown (lightweight, always runs)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        name: "prettier (yaml/json/md)"
        types_or: [yaml, markdown, json]
        # The module manifest has a deterministic Python serializer; another
        # formatter would make the immediately preceding freshness gate stale.
        exclude: '(\.py|\.m|\.qmd|package-lock\.json|\.ipynb|manuals/tools/manifests/module-inventory(?:\.json|/.*\.json))$'

  # -------------------------------------------------------------------------
  # Stage 4: Pre-push Hooks (Slower - PYTHON FILES ONLY)
  # -------------------------------------------------------------------------

  # MyPy - Type checking (pre-push only, Python only)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: "mypy (type check)"
        stages: [pre-push]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - pydantic
        args: [--ignore-missing-imports, --follow-imports=skip]
        types: [python]
        files: ^src/
        exclude: |
          (?x)^(
            src/matlab/|
            src/javascript/|
            src/archive/|
            src/legacy/|
            src/experimental/|
            src/pendulum_simulator/|
            __pycache__/|
            \.pytest_cache/|
            \.venv/|
            \.github/
          )

  # Bandit - Security scanning (pre-push only, Python only)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        name: "bandit (security scan)"
        stages: [pre-push]
        args: ["-ll", "-ii"]
        # Only run if Python files changed
        types: [python]

  # Pytest - Unit tests (pre-push only)
  - repo: local
    hooks:
      - id: pytest-unit
        name: "pytest (unit tests)"
        stages: [pre-push]
        entry: python -m pytest tests/unit -x -q --tb=short -m "not slow and not integration"
        language: system
        pass_filenames: false
        # Only run if Python files changed
        types: [python]

      - id: pip-audit
        name: "pip-audit (Python dependency audit)"
        stages: [pre-push]
        entry: python shared_scripts/fleet_hooks.py dependency-audit
        language: python
        additional_dependencies: [pip-audit]
        pass_filenames: false
        always_run: true

      - id: fleet-push-guardrails
        name: "fleet pre-push guardrails"
        stages: [pre-push]
        entry: python shared_scripts/fleet_hooks.py push
        language: python
        additional_dependencies: [pip-audit]
        pass_filenames: false
        always_run: true

# =============================================================================
# Global Settings
# =============================================================================

default_language_version:
  python: python

# Files to always exclude from all hooks
exclude: |
  (?x)^(
    archive/|
    legacy/|
    experimental/|
    src/movement_optimizer/|
    \.git/|
    __pycache__/|
    \.mypy_cache/|
    \.ruff_cache/|
    \.pytest_cache/|
    node_modules/|
    \.venv/|
    venv/|
    build/|
    dist/|
    .*\.egg-info/
  )

# Don't fail fast - run all hooks
fail_fast: false

# CI configuration (for pre-commit.ci if used)
ci:
  autofix_commit_msg: "style: auto-fix from pre-commit hooks"
  autofix_prs: true
  autoupdate_branch: "main"
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  skip: [pytest-unit, bandit, mypy, pip-audit, fleet-push-guardrails] # Skip slow hooks in CI
